<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>bat2</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"> <script src="https://cdn.babylonjs.com/babylon.js"></script> <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script> <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background-color:white;overflow:hidden}#renderCanvas{width:100vw;height:100vh;display:block;touch-action:none;outline:0}#name-header{position:fixed;top:2rem;left:2rem;z-index:100;font-size:2.5rem;font-weight:600;color:#000;white-space:nowrap;border-right:2px solid currentColor;padding-right:.5rem;pointer-events:none}#subtitle{position:fixed;top:5rem;left:2rem;z-index:100;font-family:ui-monospace,monospace;color:#666;opacity:0;transition:opacity .6s ease;pointer-events:none}#subtitle.visible{opacity:1}#theme-toggle{position:fixed;top:1rem;right:1rem;z-index:9999;background:rgba(0,0,0,0.1);border:1px solid rgba(0,0,0,0.2);border-radius:50%;width:50px;height:50px;cursor:pointer;font-size:1.5rem;display:flex;align-items:center;justify-content:center;transition:all .2s ease}#theme-toggle:hover{background:rgba(0,0,0,0.2);transform:scale(1.1)}#orb-hint{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);z-index:100;font-family:ui-monospace,monospace;font-size:.75rem;color:#999;opacity:1;transition:opacity 1s ease;pointer-events:none}#orb-hint.hidden{opacity:0}body.dark{background-color:#1a1a1a}body.dark #name-header,body.dark #subtitle{color:#fff}body.dark #orb-hint{color:#555}body.dark #theme-toggle{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2)}body.dark #theme-toggle:hover{background:rgba(255,255,255,0.2)}</style> </head> <body> <canvas id="renderCanvas"></canvas> <h1 id="name-header"></h1> <p id="subtitle"><span id="live-age"></span> year old CS student that likes batman</p> <button id="theme-toggle">🌙</button> <p id="orb-hint">[ space ] to deploy</p> <script>
    // ─── AGE ──────────────────────────────────────────────────────────────────
    const birthDate = new Date("2006-12-30T02:00:00.700Z");
    function computeAge() {
      return ((new Date() - birthDate) / (365.2422 * 24*60*60*1000)).toFixed(10);
    }
    function updateAge() {
      const el = document.getElementById("live-age");
      if (el) el.textContent = computeAge();
    }

    // ─── TYPEWRITER ───────────────────────────────────────────────────────────
    function typeNameWithTypos(el) {
      if (!el || el.dataset.typing === "1") return;
      el.dataset.typing = "1";
      const firstName = "Akash ";
      const typos = ["Nabghirava", "Nagabhirva", "Nagabhirava"];
      let phase = "first", firstIndex = 0, stage = 0, index = 0, deleting = false;
      function jitter(base) { return Math.max(10, base + Math.floor(Math.random() * 60) - 30); }
      function step() {
        if (!document.body.contains(el)) { el.dataset.typing = "0"; return; }
        if (phase === "first") {
          el.textContent = firstName.slice(0, firstIndex + 1);
          firstIndex++;
          if (firstIndex < firstName.length) return setTimeout(step, jitter(110));
          phase = "last"; index = 0;
          return setTimeout(step, 200);
        }
        const target = typos[stage] || "";
        if (!deleting) {
          el.textContent = firstName + target.slice(0, index + 1);
          index++;
          if (index < target.length) return setTimeout(step, jitter(120));
          if (stage < typos.length - 1) {
            setTimeout(() => {
              let deleteCount = (stage === 0) ? 8 : (stage === 1) ? 3 : 1;
              deleteCount = Math.min(deleteCount, Math.max(1, (typos[stage]||"").length - 1));
              deleting = true;
              el.dataset.deletesLeft = String(deleteCount);
              step();
            }, 400);
            return;
          } else {
            setTimeout(() => {
              el.style.borderRight = "none";
              el.dataset.typing = "0";
              document.getElementById("subtitle").classList.add("visible");
            }, 320);
            return;
          }
        } else {
          let deletesLeft = parseInt(el.dataset.deletesLeft || "0", 10);
          if (deletesLeft <= 0) {
            deleting = false; stage++;
            setTimeout(() => { index = el.textContent.replace(firstName, "").length; step(); }, 200);
            return;
          }
          el.textContent = firstName + el.textContent.replace(firstName, "").slice(0, -1);
          el.dataset.deletesLeft = String(deletesLeft - 1);
          return setTimeout(step, 55);
        }
      }
      step();
    }

    // ─── BABYLON SCENE ────────────────────────────────────────────────────────
    function initBabylonScene() {
      const canvas = document.getElementById('renderCanvas');
      const engine = new BABYLON.Engine(canvas, true, { 
        antialias: true,
        powerPreference: "high-performance"
      });
      
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(1, 1, 1, 0);
      
      // Camera - NO LIMITS
      const camera = new BABYLON.ArcRotateCamera(
        "camera", 
        -Math.PI * 0.25,
        Math.PI * 0.35,
        10,
        new BABYLON.Vector3(0, 1, 0), 
        scene
      );
      camera.attachControl(canvas, true);
      // NO radius limits - infinite zoom
      camera.wheelPrecision = 15;
      camera.panningSensibility = 0;
      camera.angularSensibilityX = 500;
      camera.angularSensibilityY = 500;
      camera.inertia = 0.85;
      camera.minZ = 0.1;
      
      // Environment - Fixed version
      scene.createDefaultEnvironment({
        environmentTexture: "https://playground.babylonjs.com/textures/environment.dds",
        createSkybox: false,
        createGround: false
      });
      scene.environmentIntensity = 1.5;
      
      // Strong lighting
      const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
      hemiLight.intensity = 2.0;
      
      const dirLight1 = new BABYLON.DirectionalLight("dir1", new BABYLON.Vector3(-1, -2, -1), scene);
      dirLight1.intensity = 2.5;
      
      const dirLight2 = new BABYLON.DirectionalLight("dir2", new BABYLON.Vector3(1, -2, 1), scene);
      dirLight2.intensity = 1.5;
      
      // ─── ORB DATA ─────────────────────────────────────────────────────────
      const ORB_LINKS = [
        { emoji: '🐙', label: 'GitHub',    url: 'https://github.com/akashngb',                              color: [0.2, 0.2, 0.2] },
        { emoji: '💼', label: 'LinkedIn',  url: 'https://www.linkedin.com/in/akash-nagabhirava-164155327/', color: [0.0, 0.47, 0.71] },
        { emoji: '🎵', label: 'Spotify',   url: 'https://open.spotify.com/user/obxzyzxv5yuu7qo1u3qaxvsqm', color: [0.11, 0.73, 0.33] },
        { emoji: '📸', label: 'Instagram', url: 'https://instagram.com/akash30n',                           color: [0.88, 0.19, 0.42] },
        { emoji: '✉️', label: 'Email',     url: 'mailto:akash30n@gmail.com',                                color: [0.29, 0.56, 0.85] },
      ];
      
      const ORB_TARGETS = [
        new BABYLON.Vector3( 2.5,  1.0,  0.5),
        new BABYLON.Vector3(-2.5,  1.0,  0.5),
        new BABYLON.Vector3( 1.5,  2.2, -0.5),
        new BABYLON.Vector3(-1.5,  2.2, -0.5),
        new BABYLON.Vector3( 0.0,  2.8,  1.0),
      ];
      
      let orbsDeployed = false;
      let orbAnimating = false;
      let orbMeshes = [];
      let modelRoot = null;
      
      function createOrbTexture(emoji, color) {
        const size = 256;
        const cvs = document.createElement('canvas');
        cvs.width = cvs.height = size;
        const ctx = cvs.getContext('2d');
        
        ctx.fillStyle = `rgb(${color[0]*255},${color[1]*255},${color[2]*255})`;
        ctx.beginPath();
        ctx.arc(size/2, size/2, size/2 - 4, 0, Math.PI * 2);
        ctx.fill();
        
        const grd = ctx.createRadialGradient(size/2, size/2, size*0.1, size/2, size/2, size/2);
        grd.addColorStop(0, 'rgba(255,255,255,0.4)');
        grd.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(size/2, size/2, size/2 - 4, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.font = `${size * 0.44}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, size/2, size/2 + 4);
        
        const texture = new BABYLON.DynamicTexture("orbTex", size, scene, false);
        const context = texture.getContext();
        context.drawImage(cvs, 0, 0);
        texture.update();
        return texture;
      }
      
      function createOrbs() {
        if (!modelRoot) return;
        
        orbMeshes = ORB_LINKS.map((link, i) => {
          const sphere = BABYLON.MeshBuilder.CreateSphere(`orb${i}`, { diameter: 0.56, segments: 32 }, scene);
          
          const mat = new BABYLON.StandardMaterial(`orbMat${i}`, scene);
          mat.diffuseTexture = createOrbTexture(link.emoji, link.color);
          mat.emissiveColor = new BABYLON.Color3(...link.color);
          mat.emissiveIntensity = 0.3;
          mat.specularColor = new BABYLON.Color3(1, 1, 1);
          mat.specularPower = 128;
          sphere.material = mat;
          
          sphere.position = BABYLON.Vector3.Zero();
          sphere.parent = modelRoot;
          sphere.setEnabled(false);
          
          sphere.metadata = {
            target: ORB_TARGETS[i].clone(),
            origin: BABYLON.Vector3.Zero(),
            link: link.url,
            t: 0,
            bobOffset: i * (Math.PI * 2 / ORB_LINKS.length),
          };
          
          return sphere;
        });
      }
      
      function easeOutBack(t) {
        const c1 = 1.70158, c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }
      
      function easeInBack(t) {
        const c1 = 1.70158, c3 = c1 + 1;
        return c3 * t * t * t - c1 * t * t;
      }
      
      // Spacebar toggle - FIXED
      let spacePressed = false;
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !spacePressed) {
          e.preventDefault();
          spacePressed = true;
          if (orbAnimating || !modelRoot) return;
          orbsDeployed = !orbsDeployed;
          orbAnimating = true;
          if (orbsDeployed) {
            orbMeshes.forEach(orb => { 
              orb.setEnabled(true); 
              orb.metadata.t = 0; 
              orb.position = BABYLON.Vector3.Zero(); 
            });
            document.getElementById('orb-hint').classList.add('hidden');
          }
        }
      });
      
      document.addEventListener('keyup', (e) => {
        if (e.code === 'Space') spacePressed = false;
      });
      
      // Click detection
      scene.onPointerDown = (evt, pickResult) => {
        if (!orbsDeployed || !pickResult.hit) return;
        const mesh = pickResult.pickedMesh;
        if (mesh && mesh.metadata && mesh.metadata.link) {
          window.open(mesh.metadata.link, '_blank');
        }
      };
      
      // Hover cursor
      scene.onPointerMove = (evt, pickResult) => {
        if (!orbsDeployed) return;
        if (pickResult.hit && pickResult.pickedMesh.metadata && pickResult.pickedMesh.metadata.link) {
          canvas.style.cursor = 'pointer';
        } else {
          canvas.style.cursor = 'grab';
        }
      };
      
      // Load model - KEEP ORIGINAL MATERIALS
      BABYLON.SceneLoader.ImportMesh(
        "",
        "/assets/models/",
        "batmobile_armored.glb",
        scene,
        (meshes) => {
          modelRoot = new BABYLON.TransformNode("modelRoot", scene);
          
          meshes.forEach(mesh => {
            if (mesh.parent === null) mesh.parent = modelRoot;
          });
          
          // Center and scale
          const boundingBox = modelRoot.getHierarchyBoundingVectors();
          const center = BABYLON.Vector3.Center(boundingBox.min, boundingBox.max);
          const size = boundingBox.max.subtract(boundingBox.min);
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 8 / maxDim;
          
          modelRoot.position = center.scale(-scale);
          modelRoot.scaling = new BABYLON.Vector3(scale, scale, scale);
          
          createOrbs();
          console.log("Model loaded successfully!");
        },
        null,
        (scene, message) => console.error("Model load error:", message)
      );
      
      // Animation loop
      let time = 0;
      scene.registerBeforeRender(() => {
        time += engine.getDeltaTime() / 1000;
        
        let allDone = true;
        orbMeshes.forEach((orb) => {
          const md = orb.metadata;
          const speed = 0.045;
          
          if (orbsDeployed) {
            if (md.t < 1) { md.t = Math.min(1, md.t + speed); allDone = false; }
            const easedT = easeOutBack(md.t);
            orb.position = BABYLON.Vector3.Lerp(md.origin, md.target, easedT);
            
            if (md.t >= 1) {
              orb.position.y = md.target.y + Math.sin(time * 1.4 + md.bobOffset) * 0.08;
              orb.rotation.y = time * 0.6 + md.bobOffset;
            }
          } else {
            if (md.t > 0) { md.t = Math.max(0, md.t - speed * 1.4); allDone = false; }
            const easedT = easeInBack(Math.max(0, md.t));
            orb.position = BABYLON.Vector3.Lerp(md.origin, md.target, easedT);
            if (md.t <= 0) orb.setEnabled(false);
          }
        });
        
        if (allDone) orbAnimating = false;
      });
      
      engine.runRenderLoop(() => scene.render());
      window.addEventListener('resize', () => engine.resize());
    }

    // ─── THEME ────────────────────────────────────────────────────────────────
    const toggle = document.getElementById('theme-toggle');
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      toggle.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      toggle.textContent = '☀️';
    }

    // ─── INIT ─────────────────────────────────────────────────────────────────
    updateAge();
    setInterval(updateAge, 100);
    typeNameWithTypos(document.getElementById('name-header'));
    initBabylonScene();
  </script> </body> </html>
