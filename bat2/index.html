<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>bat2</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"> <script src="https://cdn.babylonjs.com/babylon.js"></script> <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script> <script src="https://cdn.babylonjs.com/postProcessesLibrary/babylonjs.postProcess.min.js"></script> <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background-color:white;overflow:hidden}#renderCanvas{width:100vw;height:100vh;display:block;touch-action:none}#name-header{position:fixed;top:2rem;left:2rem;z-index:100;font-size:2.5rem;font-weight:600;color:#000;white-space:nowrap;border-right:2px solid currentColor;padding-right:.5rem;pointer-events:none}#subtitle{position:fixed;top:5rem;left:2rem;z-index:100;font-family:ui-monospace,monospace;color:#666;opacity:0;transition:opacity .6s ease;pointer-events:none}#subtitle.visible{opacity:1}#theme-toggle{position:fixed;top:1rem;right:1rem;z-index:9999;background:rgba(0,0,0,0.1);border:1px solid rgba(0,0,0,0.2);border-radius:50%;width:50px;height:50px;cursor:pointer;font-size:1.5rem;display:flex;align-items:center;justify-content:center;transition:all .2s ease}#theme-toggle:hover{background:rgba(0,0,0,0.2);transform:scale(1.1)}#orb-hint{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);z-index:100;font-family:ui-monospace,monospace;font-size:.75rem;color:#999;opacity:1;transition:opacity 1s ease;pointer-events:none}#orb-hint.hidden{opacity:0}body.dark{background-color:#1a1a1a}body.dark #name-header,body.dark #subtitle{color:#fff}body.dark #orb-hint{color:#555}body.dark #theme-toggle{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2)}body.dark #theme-toggle:hover{background:rgba(255,255,255,0.2)}</style> </head> <body> <canvas id="renderCanvas"></canvas> <h1 id="name-header"></h1> <p id="subtitle"><span id="live-age"></span> years</p> <button id="theme-toggle">🌙</button> <p id="orb-hint">[ space ] to deploy</p> <script>
    // ─── AGE ──────────────────────────────────────────────────────────────────
    const birthDate = new Date("2006-12-30T02:00:00.700Z");
    function computeAge() {
      return ((new Date() - birthDate) / (365.2422 * 24*60*60*1000)).toFixed(10);
    }
    function updateAge() {
      const el = document.getElementById("live-age");
      if (el) el.textContent = computeAge();
    }

    // ─── TYPEWRITER ───────────────────────────────────────────────────────────
    function typeNameWithTypos(el) {
      if (!el || el.dataset.typing === "1") return;
      el.dataset.typing = "1";
      const firstName = "Akash ";
      const typos = ["Nabghirava", "Nagabhirva", "Nagabhirava"];
      let phase = "first", firstIndex = 0, stage = 0, index = 0, deleting = false;
      function jitter(base) { return Math.max(10, base + Math.floor(Math.random() * 60) - 30); }
      function step() {
        if (!document.body.contains(el)) { el.dataset.typing = "0"; return; }
        if (phase === "first") {
          el.textContent = firstName.slice(0, firstIndex + 1);
          firstIndex++;
          if (firstIndex < firstName.length) return setTimeout(step, jitter(110));
          phase = "last"; index = 0;
          return setTimeout(step, 200);
        }
        const target = typos[stage] || "";
        if (!deleting) {
          el.textContent = firstName + target.slice(0, index + 1);
          index++;
          if (index < target.length) return setTimeout(step, jitter(120));
          if (stage < typos.length - 1) {
            setTimeout(() => {
              let deleteCount = (stage === 0) ? 8 : (stage === 1) ? 3 : 1;
              deleteCount = Math.min(deleteCount, Math.max(1, (typos[stage]||"").length - 1));
              deleting = true;
              el.dataset.deletesLeft = String(deleteCount);
              step();
            }, 400);
            return;
          } else {
            setTimeout(() => {
              el.style.borderRight = "none";
              el.dataset.typing = "0";
              document.getElementById("subtitle").classList.add("visible");
            }, 320);
            return;
          }
        } else {
          let deletesLeft = parseInt(el.dataset.deletesLeft || "0", 10);
          if (deletesLeft <= 0) {
            deleting = false; stage++;
            setTimeout(() => { index = el.textContent.replace(firstName, "").length; step(); }, 200);
            return;
          }
          el.textContent = firstName + el.textContent.replace(firstName, "").slice(0, -1);
          el.dataset.deletesLeft = String(deletesLeft - 1);
          return setTimeout(step, 55);
        }
      }
      step();
    }

    // ─── BABYLON SCENE ────────────────────────────────────────────────────────
    function initBabylonScene() {
      const canvas = document.getElementById('renderCanvas');
      const engine = new BABYLON.Engine(canvas, true, { 
        preserveDrawingBuffer: true, 
        stencil: true,
        antialias: true,
        powerPreference: "high-performance"
      });
      
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(1, 1, 1, 0); // Transparent
      
      // Camera - Arc rotate for better control
      const camera = new BABYLON.ArcRotateCamera(
        "camera", 
        -Math.PI * 0.25,  // Alpha (horizontal)
        Math.PI * 0.35,   // Beta (vertical) 
        10,               // Radius (distance)
        new BABYLON.Vector3(0, 1, 0), 
        scene
      );
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 3;
      camera.upperRadiusLimit = 30;
      camera.wheelPrecision = 15; // FAST zoom (lower = faster)
      camera.panningSensibility = 0; // Disable panning
      camera.angularSensibilityX = 500; // FAST rotation (lower = faster)
      camera.angularSensibilityY = 500;
      camera.inertia = 0.85; // Smooth damping
      camera.minZ = 0.1;
      
      // HDRI Environment
      const hdrTexture = new BABYLON.CubeTexture.CreateFromPrefilteredData(
        "https://playground.babylonjs.com/textures/environment.dds",
        scene
      );
      scene.environmentTexture = hdrTexture;
      scene.environmentIntensity = 1.2;
      
      // Image processing (tone mapping & color grading)
      scene.imageProcessingConfiguration.contrast = 1.3;
      scene.imageProcessingConfiguration.exposure = 1.4;
      scene.imageProcessingConfiguration.toneMappingEnabled = true;
      scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
      
      // POST-PROCESSING PIPELINE - The good stuff
      const defaultPipeline = new BABYLON.DefaultRenderingPipeline(
        "defaultPipeline",
        true,
        scene,
        [camera]
      );
      
      // BLOOM - Makes highlights glow
      defaultPipeline.bloomEnabled = true;
      defaultPipeline.bloomThreshold = 0.8;
      defaultPipeline.bloomWeight = 0.3;
      defaultPipeline.bloomKernel = 64;
      defaultPipeline.bloomScale = 0.5;
      
      // DEPTH OF FIELD - Cinematic focus blur
      defaultPipeline.depthOfFieldEnabled = true;
      defaultPipeline.depthOfFieldBlurLevel = BABYLON.DepthOfFieldEffectBlurLevel.Low;
      defaultPipeline.depthOfField.focalLength = 150;
      defaultPipeline.depthOfField.fStop = 2.8;
      defaultPipeline.depthOfField.focusDistance = 10000;
      
      // FXAA - Anti-aliasing for smooth edges
      defaultPipeline.fxaaEnabled = true;
      defaultPipeline.samples = 4;
      
      // SHARPEN - Crisp details
      defaultPipeline.sharpenEnabled = true;
      defaultPipeline.sharpen.edgeAmount = 0.3;
      defaultPipeline.sharpen.colorAmount = 0.0;
      
      // IMAGE ADJUSTMENTS - Final color grading
      defaultPipeline.imageProcessingEnabled = true;
      defaultPipeline.imageProcessing.vignetteEnabled = true;
      defaultPipeline.imageProcessing.vignetteWeight = 0.5;
      defaultPipeline.imageProcessing.vignetteStretch = 0.5;
      defaultPipeline.imageProcessing.vignetteCameraFov = 0.8;
      
      // Lighting
      const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
      hemiLight.intensity = 0.6;
      
      // ─── ORB DATA ─────────────────────────────────────────────────────────
      const ORB_LINKS = [
        { emoji: '🐙', label: 'GitHub',    url: 'https://github.com/akashngb',                              color: [0.2, 0.2, 0.2] },
        { emoji: '💼', label: 'LinkedIn',  url: 'https://www.linkedin.com/in/akash-nagabhirava-164155327/', color: [0.0, 0.47, 0.71] },
        { emoji: '🎵', label: 'Spotify',   url: 'https://open.spotify.com/user/obxzyzxv5yuu7qo1u3qaxvsqm', color: [0.11, 0.73, 0.33] },
        { emoji: '📸', label: 'Instagram', url: 'https://instagram.com/akash30n',                           color: [0.88, 0.19, 0.42] },
        { emoji: '✉️', label: 'Email',     url: 'mailto:akash30n@gmail.com',                                color: [0.29, 0.56, 0.85] },
      ];
      
      const ORB_TARGETS = [
        new BABYLON.Vector3( 2.5,  1.0,  0.5),
        new BABYLON.Vector3(-2.5,  1.0,  0.5),
        new BABYLON.Vector3( 1.5,  2.2, -0.5),
        new BABYLON.Vector3(-1.5,  2.2, -0.5),
        new BABYLON.Vector3( 0.0,  2.8,  1.0),
      ];
      
      let orbsDeployed = false;
      let orbAnimating = false;
      let orbMeshes = [];
      let modelRoot = null;
      
      function createOrbTexture(emoji, color) {
        const size = 256;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        
        // Base color circle
        ctx.fillStyle = `rgb(${color[0]*255},${color[1]*255},${color[2]*255})`;
        ctx.beginPath();
        ctx.arc(size/2, size/2, size/2 - 4, 0, Math.PI * 2);
        ctx.fill();
        
        // Gradient highlight
        const grd = ctx.createRadialGradient(size/2, size/2, size*0.1, size/2, size/2, size/2);
        grd.addColorStop(0, 'rgba(255,255,255,0.4)');
        grd.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(size/2, size/2, size/2 - 4, 0, Math.PI * 2);
        ctx.fill();
        
        // Emoji
        ctx.font = `${size * 0.44}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, size/2, size/2 + 4);
        
        const texture = new BABYLON.Texture("data:orb", scene, false, false);
        texture.getAlphaFromRGB = false;
        const context = texture.getContext();
        context.drawImage(canvas, 0, 0);
        texture.update();
        return texture;
      }
      
      function createOrbs() {
        if (!modelRoot) return;
        
        orbMeshes = ORB_LINKS.map((link, i) => {
          const sphere = BABYLON.MeshBuilder.CreateSphere(`orb${i}`, { diameter: 0.56, segments: 32 }, scene);
          
          const mat = new BABYLON.StandardMaterial(`orbMat${i}`, scene);
          mat.diffuseTexture = createOrbTexture(link.emoji, link.color);
          mat.emissiveColor = new BABYLON.Color3(...link.color);
          mat.emissiveIntensity = 0.3;
          mat.specularColor = new BABYLON.Color3(1, 1, 1);
          mat.specularPower = 128;
          sphere.material = mat;
          
          sphere.position = BABYLON.Vector3.Zero();
          sphere.parent = modelRoot;
          sphere.setEnabled(false);
          
          sphere.userData = {
            target: ORB_TARGETS[i].clone(),
            origin: BABYLON.Vector3.Zero(),
            link: link.url,
            t: 0,
            bobOffset: i * (Math.PI * 2 / ORB_LINKS.length),
          };
          
          return sphere;
        });
      }
      
      function easeOutBack(t) {
        const c1 = 1.70158, c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }
      
      function easeInBack(t) {
        const c1 = 1.70158, c3 = c1 + 1;
        return c3 * t * t * t - c1 * t * t;
      }
      
      // Spacebar toggle
      window.addEventListener('keydown', (e) => {
        if (e.code !== 'Space') return;
        e.preventDefault();
        if (orbAnimating || !modelRoot) return;
        orbsDeployed = !orbsDeployed;
        orbAnimating = true;
        if (orbsDeployed) {
          orbMeshes.forEach(orb => { 
            orb.setEnabled(true); 
            orb.userData.t = 0; 
            orb.position = BABYLON.Vector3.Zero(); 
          });
          document.getElementById('orb-hint').classList.add('hidden');
        }
      });
      
      // Click detection
      scene.onPointerDown = (evt, pickResult) => {
        if (!orbsDeployed || !pickResult.hit) return;
        const mesh = pickResult.pickedMesh;
        if (mesh && mesh.userData && mesh.userData.link) {
          window.open(mesh.userData.link, '_blank');
        }
      };
      
      // Hover cursor
      scene.onPointerMove = (evt, pickResult) => {
        if (!orbsDeployed) return;
        if (pickResult.hit && pickResult.pickedMesh.userData && pickResult.pickedMesh.userData.link) {
          canvas.style.cursor = 'pointer';
        } else {
          canvas.style.cursor = 'grab';
        }
      };
      
      // Load model
      BABYLON.SceneLoader.ImportMesh(
        "",
        "/assets/models/",
        "batmobile_armored.glb",
        scene,
        (meshes) => {
          modelRoot = new BABYLON.TransformNode("modelRoot", scene);
          
          meshes.forEach(mesh => {
            if (mesh.parent === null) {
              mesh.parent = modelRoot;
            }
            
            // Apply PBR materials for better quality
            if (mesh.material) {
              const oldMat = mesh.material;
              const pbr = new BABYLON.PBRMetallicRoughnessMaterial(mesh.name + "_pbr", scene);
              
              if (oldMat.albedoTexture) pbr.baseTexture = oldMat.albedoTexture;
              if (oldMat.bumpTexture) pbr.normalTexture = oldMat.bumpTexture;
              
              pbr.baseColor = oldMat.albedoColor || new BABYLON.Color3(0.2, 0.2, 0.2);
              pbr.metallic = 0.9;
              pbr.roughness = 0.3;
              
              mesh.material = pbr;
            }
          });
          
          // Center and scale
          const boundingBox = modelRoot.getHierarchyBoundingVectors();
          const center = BABYLON.Vector3.Center(boundingBox.min, boundingBox.max);
          const size = boundingBox.max.subtract(boundingBox.min);
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 8 / maxDim;
          
          modelRoot.position = center.scale(-scale);
          modelRoot.scaling = new BABYLON.Vector3(scale, scale, scale);
          
          createOrbs();
        },
        null,
        (scene, message) => console.error("Model load error:", message)
      );
      
      // Animation loop
      let time = 0;
      scene.registerBeforeRender(() => {
        time += engine.getDeltaTime() / 1000;
        
        let allDone = true;
        orbMeshes.forEach((orb) => {
          const ud = orb.userData;
          const speed = 0.045;
          
          if (orbsDeployed) {
            if (ud.t < 1) { ud.t = Math.min(1, ud.t + speed); allDone = false; }
            const easedT = easeOutBack(ud.t);
            orb.position = BABYLON.Vector3.Lerp(ud.origin, ud.target, easedT);
            
            if (ud.t >= 1) {
              orb.position.y = ud.target.y + Math.sin(time * 1.4 + ud.bobOffset) * 0.08;
              orb.rotation.y = time * 0.6 + ud.bobOffset;
            }
          } else {
            if (ud.t > 0) { ud.t = Math.max(0, ud.t - speed * 1.4); allDone = false; }
            const easedT = easeInBack(Math.max(0, ud.t));
            orb.position = BABYLON.Vector3.Lerp(ud.origin, ud.target, easedT);
            if (ud.t <= 0) orb.setEnabled(false);
          }
        });
        
        if (allDone) orbAnimating = false;
      });
      
      engine.runRenderLoop(() => scene.render());
      window.addEventListener('resize', () => engine.resize());
    }

    // ─── THEME ────────────────────────────────────────────────────────────────
    const toggle = document.getElementById('theme-toggle');
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      toggle.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      toggle.textContent = '☀️';
    }

    // ─── INIT ─────────────────────────────────────────────────────────────────
    updateAge();
    setInterval(updateAge, 100);
    typeNameWithTypos(document.getElementById('name-header'));
    initBabylonScene();
  </script> </body> </html>
