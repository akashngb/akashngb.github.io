<!DOCTYPE html> <html> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <title>Batmobile Showcase</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script> <style>body{margin:0;overflow:hidden;background:#f5f5f5}</style> </head> <body> <script>

// ---------- SAFE PATH (WORKS WITH JEKYLL LAYOUTS) ----------
function PATH(p){ return window.location.origin + p; }

// ---------- SCENE ----------
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf5f5f5);
scene.fog=new THREE.FogExp2(0xffffff,.05);

const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);
camera.position.set(0,2,8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);

// ---------- LIGHT ----------
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,.5));

const key=new THREE.DirectionalLight(0xffffff,2);
key.position.set(5,8,5);
scene.add(key);

// ---------- HDRI ----------
new THREE.RGBELoader().load(
PATH("/assets/hdri/studio_small_09_4k.hdr"),
hdr=>{
 const pmrem=new THREE.PMREMGenerator(renderer);
 scene.environment=pmrem.fromEquirectangular(hdr).texture;
 hdr.dispose(); pmrem.dispose();
});

// ---------- REFLECTION FLOOR ----------
const refl=new THREE.Reflector(
 new THREE.PlaneGeometry(30,30),
 {textureWidth:1024,textureHeight:1024,color:0x777777}
);
refl.rotation.x=-Math.PI/2;
scene.add(refl);

// ---------- CONTROLS ----------
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.autoRotate=true;
controls.autoRotateSpeed=.3;

// ---------- BATMOBILE ----------
let carModel;
new THREE.GLTFLoader().load(
PATH("/assets/models/batmobile_armored.glb"),
g=>{
 carModel=g.scene;

 carModel.traverse(o=>{
  if(!o.isMesh)return;

  let m=o.material;
  if(!m)return;

  // DEEP BLACK PAINT FIX
  if(!m.transparent){
   m.color=new THREE.Color(0x000000);
   m.metalness=.7;
   m.roughness=.25;
   m.envMapIntensity=1.2;
  }

  // GLASS
  if(m.transparent||m.opacity<.95){
   m.transmission=.7;
   m.roughness=.05;
  }
 });

 scene.add(carModel);
});

// ---------- ICONS ----------
const ICONS=[
 {file:"github.glb",url:"https://github.com/akashngb/akashngb.github.io"},
 {file:"instagram.glb",url:"https://www.instagram.com/akash30n/"},
 {file:"linkedin.glb",url:"https://www.linkedin.com/in/akash-nagabhirava-164155327/"},
 {file:"spotify.glb",url:"https://open.spotify.com/user/obxzyzxv5yuu7qo1u3qaxvsqm"},
 {file:"mail.glb",url:"mailto:akash30n@gmail.com"},
 {file:"sun.glb",url:"theme"},
 {file:"moon.glb",url:"theme"}
];

const loader=new THREE.GLTFLoader();
const icons=[];
let iconsVisible=false;

ICONS.forEach(i=>{
 loader.load(PATH("/assets/icons/"+i.file),g=>{
  let m=g.scene;
  m.scale.setScalar(.5);
  m.visible=false;
  m.userData=i;
  scene.add(m);
  icons.push(m);
 });
});

// ---------- SPACE TOGGLE ----------
window.addEventListener("keydown",e=>{
 if(e.code!=="Space")return;
 iconsVisible=!iconsVisible;

 icons.forEach((m,i)=>{
  m.visible=iconsVisible;

  const angle=i*(Math.PI*2/icons.length);
  const r=3;
  m.position.set(
   Math.cos(angle)*r,
   .5+(i%2)*.8,
   Math.sin(angle)*r
  );
 });
});

// ---------- HOVER ----------
const ray=new THREE.Raycaster();
const mouse=new THREE.Vector2();

window.addEventListener("mousemove",e=>{
 mouse.x=e.clientX/innerWidth*2-1;
 mouse.y=-(e.clientY/innerHeight*2-1);
});

window.addEventListener("click",()=>{
 ray.setFromCamera(mouse,camera);
 const hits=ray.intersectObjects(icons,true);
 if(!hits.length)return;

 let m=hits[0].object.parent;
 let data=m.userData;

 if(data.url==="theme"){
  toggleTheme();
 }else{
  window.open(data.url,"_blank");
 }
});

// ---------- THEME ----------
let dark=false;
function toggleTheme(){
 dark=!dark;

 scene.background=new THREE.Color(dark?0x000000:0xf5f5f5);
 scene.fog.color.set(dark?0x000000:0xffffff);

 if(carModel){
  carModel.traverse(o=>{
   if(o.isMesh)o.material.wireframe=dark;
  });
 }
}

// ---------- ANIMATE ----------
function animate(){
 requestAnimationFrame(animate);

 ray.setFromCamera(mouse,camera);
 const hits=ray.intersectObjects(icons,true);

 icons.forEach(m=>{
  m.scale.setScalar(.5);
  m.traverse(o=>{
   if(o.material)o.material.emissiveIntensity=0;
  });
 });

 if(hits.length){
  let m=hits[0].object.parent;
  m.scale.setScalar(.65);
  m.traverse(o=>{
   if(o.material)o.material.emissive=new THREE.Color(0xffffff);
  });
 }

 controls.update();
 renderer.render(scene,camera);
}
animate();

// ---------- RESIZE ----------
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script> </body> </html>
