<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Batmobile Scene</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VignetteShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script> <style>body{margin:0;background:#f5f5f5;overflow:hidden}canvas{display:block}</style> </head> <body> <script>
const scene=new THREE.Scene()
scene.background=new THREE.Color(0xf5f5f5)
scene.fog=new THREE.FogExp2(0x000000,0.03)

const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.1,1000)
camera.position.set(0,2,8)

const renderer=new THREE.WebGLRenderer({antialias:true})
renderer.setSize(innerWidth,innerHeight)
renderer.setPixelRatio(Math.min(devicePixelRatio,2))
renderer.outputEncoding=THREE.sRGBEncoding
renderer.toneMapping=THREE.ACESFilmicToneMapping
renderer.toneMappingExposure=1.2
document.body.appendChild(renderer.domElement)

const composer=new THREE.EffectComposer(renderer)
composer.addPass(new THREE.RenderPass(scene,camera))
composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.35,0.4,0.85))
composer.addPass(new THREE.ShaderPass(THREE.VignetteShader))
composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader))

const controls=new THREE.OrbitControls(camera,renderer.domElement)
controls.enableDamping=true
controls.autoRotate=true
controls.autoRotateSpeed=0.2

// lights
scene.add(new THREE.HemisphereLight(0xffffff,0x222222,0.4))
const d=new THREE.DirectionalLight(0xffffff,2)
d.position.set(6,10,6)
scene.add(d)

// hdri
new THREE.RGBELoader().load('assets/hdri/studio_small_09_4k.hdr',hdr=>{
 const pmrem=new THREE.PMREMGenerator(renderer)
 scene.environment=pmrem.fromEquirectangular(hdr).texture
 hdr.dispose();pmrem.dispose()
})

let carModel
let wireframe=false
new THREE.GLTFLoader().load('assets/batmobile_armored.glb',g=>{
 carModel=g.scene
 carModel.traverse(o=>{
  if(!o.isMesh) return
  o.material=new THREE.MeshPhysicalMaterial({
   color:0x050505,
   metalness:1,
   roughness:0.35,
   clearcoat:0.7,
   envMapIntensity:1.5
  })
 })
 scene.add(carModel)
})

// ---------- ICONS ----------
const iconLinks={
 instagram:'https://www.instagram.com/akash30n/',
 linkedin:'https://www.linkedin.com/in/akash-nagabhirava-164155327/',
 spotify:'https://open.spotify.com/user/obxzyzxv5yuu7qo1u3qaxvsqm',
 github:'https://github.com/akashngb/akashngb.github.io',
 mail:'mailto:akash30n@gmail.com'
}

const iconNames=['instagram','linkedin','spotify','github','mail','sun']
const icons=[]
let iconsOut=false
const loader=new THREE.GLTFLoader()

iconNames.forEach((n,i)=>{
 loader.load('assets/icons/'+n+'.glb',g=>{
  const m=g.scene
  m.scale.set(0.4,0.4,0.4)
  m.visible=false
  m.userData.name=n
  scene.add(m)
  icons.push(m)
 })
})

function toggleIcons(){
 iconsOut=!iconsOut
 icons.forEach((icon,i)=>{
  if(!carModel) return
  if(iconsOut){
   icon.visible=true
   const angle=i*Math.PI*2/icons.length
   const y=i%2?1.2:0.8
   icon.position.set(Math.cos(angle)*4,y,Math.sin(angle)*4)
  }else{
   icon.visible=false
  }
 })
}

addEventListener('keydown',e=>{
 if(e.code==='Space') toggleIcons()
})

// hover glow + click
const raycaster=new THREE.Raycaster()
const mouse=new THREE.Vector2()
let hovered

addEventListener('mousemove',e=>{
 mouse.x=(e.clientX/innerWidth)*2-1
 mouse.y=-(e.clientY/innerHeight)*2+1
 raycaster.setFromCamera(mouse,camera)
 const hits=raycaster.intersectObjects(icons,true)
 if(hovered) hovered.scale.set(0.4,0.4,0.4)
 hovered=hits[0]?.object?.parent
 if(hovered){hovered.scale.set(0.55,0.55,0.55)}
})

addEventListener('click',()=>{
 if(!hovered) return
 const n=hovered.userData.name
 if(iconLinks[n]) window.open(iconLinks[n],'_blank')
 if(n==='sun'||n==='moon'){
  wireframe=!wireframe
  scene.background=new THREE.Color(wireframe?0x000000:0xf5f5f5)
  carModel?.traverse(o=>{
   if(o.isMesh) o.material.wireframe=wireframe
  })
 }
})

function animate(){
 requestAnimationFrame(animate)
 controls.update()
 composer.render()
}
animate()

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight
 camera.updateProjectionMatrix()
 renderer.setSize(innerWidth,innerHeight)
 composer.setSize(innerWidth,innerHeight)
})
</script> </body> </html>
