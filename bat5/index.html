<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <title>Batmobile Scene</title> <style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style> </head> <body> <script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js';
import { RGBELoader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/RGBELoader.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/ShaderPass.js';
import { CopyShader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/shaders/CopyShader.js';
import { LuminosityHighPassShader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/shaders/LuminosityHighPassShader.js';

let scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.035); // cinematic mist

let camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(6,3,8);

let renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.physicallyCorrectLights = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

let controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// HDRI
new RGBELoader().load('assets/hdri/studio_small_09_4k.hdr', tex => {
  tex.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = tex;
});

// Lights
let key = new THREE.DirectionalLight(0xffffff, 2);
key.position.set(5,10,5);
scene.add(key);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// Ground
let groundGeo = new THREE.PlaneGeometry(200,200);
let groundMat = new THREE.MeshStandardMaterial({
  color:0x000000,
  roughness:0.9,
  metalness:0.0
});
let ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.01;
scene.add(ground);

// Batmobile
let loader = new GLTFLoader();
let carModel;
loader.load('assets/models/batmobile_armored.glb', gltf => {
  carModel = gltf.scene;
  carModel.traverse(o => {
    if(o.isMesh){
      if(o.name.toLowerCase().includes('window')){
        o.material = new THREE.MeshPhysicalMaterial({
          color:0x111111,
          metalness:0,
          roughness:0.05,
          transmission:0.9,
          thickness:0.5,
          envMapIntensity:2
        });
      }else if(o.name.toLowerCase().includes('cylinder')){ // wheels gold
        o.material = new THREE.MeshStandardMaterial({
          color:0xd4af37,
          metalness:1,
          roughness:0.25,
          envMapIntensity:1.5
        });
      }else{
        o.material = new THREE.MeshStandardMaterial({
          color:0x050505, // darker black fix
          metalness:1,
          roughness:0.35,
          envMapIntensity:1.5
        });
      }
    }
  });
  scene.add(carModel);
});

// ICONS
let iconPaths = [
 'assets/icons/github.glb',
 'assets/icons/instagram.glb',
 'assets/icons/spotify.glb',
 'assets/icons/linkedin.glb',
 'assets/icons/mail.glb',
 'assets/icons/sun.glb'
];

let icons = [];
let iconsVisible = false;

iconPaths.forEach(path=>{
 loader.load(path, gltf=>{
   let icon = gltf.scene;
   icon.scale.set(0.5,0.5,0.5);
   icon.visible = false;
   scene.add(icon);
   icons.push(icon);
 });
});

function arrangeIcons(show){
 if(!carModel || icons.length===0) return;
 let radius = 3;
 icons.forEach((icon,i)=>{
   let angle = (i/6)*Math.PI*2;
   let height = (i%2===0)?1.5:0.5;
   icon.targetPos = new THREE.Vector3(
     Math.cos(angle)*radius,
     height,
     Math.sin(angle)*radius
   );
   if(show){
     icon.visible = true;
   }else{
     icon.targetPos = new THREE.Vector3(0,0.5,0);
   }
 });
}

window.addEventListener('keydown', e=>{
 if(e.code==='Space'){
   iconsVisible = !iconsVisible;
   arrangeIcons(iconsVisible);
 }
});

// Post FX
let composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
let bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.7,0.4,0.85);
composer.addPass(bloom);

// Animate
function animate(){
 requestAnimationFrame(animate);
 controls.update();
 
 icons.forEach(icon=>{
   if(icon.targetPos){
     icon.position.lerp(icon.targetPos,0.08);
     if(!iconsVisible && icon.position.length()<0.2){
       icon.visible=false;
     }
   }
 });
 
 composer.render();
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect = innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 composer.setSize(innerWidth,innerHeight);
});
</script> </body> </html>
