<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>bat5</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VignetteShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script> <style>body{margin:0;overflow:hidden;background:#0b0b0b}#c{width:100vw;height:100vh}</style> </head> <body> <div id="c"></div> <script>
const BASE = "/";
const PATH = (p)=> BASE + p;

let scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x000000,.035);

let camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,1000);
camera.position.set(0,2,8);

let renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.9;
document.getElementById("c").appendChild(renderer.domElement);

let controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.autoRotate=true;
controls.autoRotateSpeed=.2;

// LIGHTS
scene.add(new THREE.HemisphereLight(0xffffff,0x111111,.3));
let k=new THREE.DirectionalLight(0xffffff,2);
k.position.set(5,8,5);
scene.add(k);

// HDRI SAFE
new THREE.RGBELoader().load(PATH("/assets/hdri/studio_small_09_4k.hdr"),(hdr)=>{
let pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromEquirectangular(hdr).texture;
hdr.dispose();pmrem.dispose();
});

// POST FX
let composer=new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene,camera));
composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.2,.4,.85));
composer.addPass(new THREE.ShaderPass(THREE.VignetteShader));

// LOAD CAR
let car;
new THREE.GLTFLoader().load(PATH("/assets/models/batmobile_armored.glb"),(g)=>{
car=g.scene;
car.traverse(o=>{
if(o.isMesh && o.material){
o.material.color.multiplyScalar(.6);
o.material.envMapIntensity=1.2;
}
});
scene.add(car);
});

// ICONS
const ICONS=[
{file:"github.glb",url:"https://github.com/akashngb/akashngb.github.io"},
{file:"instagram.glb",url:"https://www.instagram.com/akash30n/"},
{file:"linkedin.glb",url:"https://www.linkedin.com/in/akash-nagabhirava-164155327/"},
{file:"spotify.glb",url:"https://open.spotify.com/user/obxzyzxv5yuu7qo1u3qaxvsqm"},
{file:"mail.glb",url:"mailto:akash30n@gmail.com"},
{file:"sun.glb",url:"theme"}
];

let iconMeshes=[];
ICONS.forEach((i,idx)=>{
new THREE.GLTFLoader().load(PATH("/assets/icons/"+i.file),(g)=>{
let m=g.scene;
m.scale.setScalar(.6);
m.visible=false;
m.userData=i;
scene.add(m);
iconMeshes.push(m);
});
});

let open=false;
window.addEventListener("keydown",e=>{
if(e.code!=="Space")return;
open=!open;
iconMeshes.forEach((m,i)=>{
m.visible=open;
m.position.set(Math.cos(i*Math.PI/3)*3, i%2?1.2:.7, Math.sin(i*Math.PI/3)*3);
});
});

let ray=new THREE.Raycaster();
let mouse=new THREE.Vector2();
window.addEventListener("click",e=>{
mouse.x=(e.clientX/innerWidth)*2-1;
mouse.y=-(e.clientY/innerHeight)*2+1;
ray.setFromCamera(mouse,camera);
let hit=ray.intersectObjects(iconMeshes,true)[0];
if(hit){
let url=hit.object.parent.userData.url;
if(url==="theme") document.body.style.background="#fff";
else window.open(url,"_blank");
}
});

function anim(){
requestAnimationFrame(anim);
controls.update();
composer.render();
}
anim();

addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
composer.setSize(innerWidth,innerHeight);
});
</script> </body> </html>
