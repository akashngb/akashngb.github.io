<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>bat5</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VignetteShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script> <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f5f5;overflow:hidden}#three-container{width:100vw;height:100vh}#icon-nav{position:fixed;left:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:24px;z-index:10}#icon-nav a{display:flex;align-items:center;justify-content:center;width:26px;height:26px;opacity:.5;transition:opacity .2s ease,transform .2s ease}#icon-nav a:hover{opacity:1;transform:scale(1.15)}#icon-nav a svg,#icon-nav a img{width:100%;height:100%;display:block;transition:all .25s ease}</style> </head> <body> <nav id="icon-nav"> <a href="#" title="GitHub"> <img src="/assets/icons/github.svg" alt="GitHub"> </a> <a href="#" title="Instagram"> <img src="/assets/icons/instagram.svg" alt="Instagram"> </a> <a href="#" title="Mail"> <img src="/assets/icons/mail.svg" alt="Mail"> </a> <a href="#" title="Spotify"> <img src="/assets/icons/spotify.svg" alt="Spotify"> </a> <a href="#" title="LinkedIn"> <img src="/assets/icons/linkedin.svg" alt="LinkedIn"> </a> </nav> <div id="three-container"></div> <script>
function init(){
const container=document.getElementById('three-container')

const scene=new THREE.Scene()
scene.background=new THREE.Color(0xf5f5f5)

// === WIREFRAME TOGGLE STATE ===
let isWireframe=false
let loadedModel=null

const camera=new THREE.PerspectiveCamera(28,window.innerWidth/window.innerHeight,.1,1000)
camera.position.set(0,2,8)

const renderer=new THREE.WebGLRenderer({antialias:true})
renderer.setSize(window.innerWidth,window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2))
renderer.outputEncoding=THREE.sRGBEncoding
renderer.toneMapping=THREE.ACESFilmicToneMapping
renderer.toneMappingExposure=1.25
renderer.shadowMap.enabled=true
renderer.shadowMap.type=THREE.PCFSoftShadowMap
renderer.physicallyCorrectLights=true
container.appendChild(renderer.domElement)

// POST PROCESSING
const composer=new THREE.EffectComposer(renderer)
composer.addPass(new THREE.RenderPass(scene,camera))

const bloom=new THREE.UnrealBloomPass(
new THREE.Vector2(window.innerWidth,window.innerHeight),
0.18,
0.4,
0.9
)
composer.addPass(bloom)

const vignette=new THREE.ShaderPass(THREE.VignetteShader)
vignette.uniforms["offset"].value=1.05
vignette.uniforms["darkness"].value=1.15
composer.addPass(vignette)
composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader))

// HDRI
new THREE.RGBELoader().load('/assets/hdri/studio_small_09_4k.hdr',(hdr)=>{
const pmrem=new THREE.PMREMGenerator(renderer)
scene.environment=pmrem.fromEquirectangular(hdr).texture
hdr.dispose();pmrem.dispose()
})

// LIGHTING
const key=new THREE.DirectionalLight(0xffffff,2.2)
key.position.set(6,10,6)
key.castShadow=true
scene.add(key)

const fill=new THREE.DirectionalLight(0xffffff,0.6)
fill.position.set(-6,4,2)
scene.add(fill)

const rim=new THREE.DirectionalLight(0xffffff,0.9)
rim.position.set(0,6,-8)
scene.add(rim)

scene.add(new THREE.HemisphereLight(0xffffff,0xcccccc,0.3))

// REFLECTIVE FLOOR
const reflector=new THREE.Reflector(new THREE.PlaneGeometry(30,30),{
textureWidth:512,
textureHeight:512,
color:0x999999
})
reflector.rotation.x=-Math.PI/2
reflector.position.y=0
scene.add(reflector)

const softenFloor=new THREE.Mesh(
new THREE.PlaneGeometry(30,30),
new THREE.MeshPhysicalMaterial({
color:0xffffff,
roughness:0.7,
metalness:0,
transparent:true,
opacity:0.35
})
)
softenFloor.rotation.x=-Math.PI/2
softenFloor.position.y=0.002
scene.add(softenFloor)

// CONTROLS
const controls=new THREE.OrbitControls(camera,renderer.domElement)
controls.enableDamping=true
controls.dampingFactor=0.09
controls.autoRotate=true
controls.autoRotateSpeed=0.12
controls.zoomSpeed=2
controls.target.set(0,0.6,0)

// MODEL
new THREE.GLTFLoader().load('/assets/models/batmobile_armored.glb',gltf=>{
  const model=gltf.scene
  loadedModel=model

  model.traverse(o=>{
    if(!o.isMesh) return
    o.castShadow=o.receiveShadow=true

    const mat=o.material
    if(!mat) return

    if(mat.transparent || mat.opacity < 0.95){
      mat.transmission=0.7
      mat.roughness=0.04
      mat.envMapIntensity=2.5
      return
    }

    if(mat.metalness > 0.6){
      mat.envMapIntensity=2
      mat.roughness=Math.max(mat.roughness,0.2)
      return
    }

    mat.clearcoat=0.8
    mat.clearcoatRoughness=0.05
    mat.envMapIntensity=1.8
  })

  const box=new THREE.Box3().setFromObject(model)
  const center=box.getCenter(new THREE.Vector3())
  model.position.sub(center)

  const newBox=new THREE.Box3().setFromObject(model)
  model.position.y-=newBox.min.y

  scene.add(model)
})

// === ICON SVG INLINING ===
// Fetch and inline each SVG so we can manipulate fill/stroke directly.
const iconNav = document.getElementById('icon-nav')
const iconLinks = Array.from(iconNav.querySelectorAll('a'))

async function inlineSVGs() {
  for (const link of iconLinks) {
    const img = link.querySelector('img')
    if (!img) continue
    try {
      const res = await fetch(img.src)
      const text = await res.text()
      const parser = new DOMParser()
      const doc = parser.parseFromString(text, 'image/svg+xml')
      const svg = doc.querySelector('svg')
      if (!svg) continue
      svg.setAttribute('width', '100%')
      svg.setAttribute('height', '100%')
      svg.style.transition = 'all 0.25s ease'
      link.replaceChild(svg, img)
    } catch(e) {
      // Fetch failed — leave as <img>, handled via CSS filter fallback
      console.warn('Could not inline SVG:', img.src)
    }
  }
}

function applyIconWireframe(wire) {
  // Handle inlined SVGs
  iconNav.querySelectorAll('svg').forEach(svg => {
    const els = [svg, ...svg.querySelectorAll('*')]
    els.forEach(el => {
      if (wire) {
        // Store originals once
        if (el.dataset.origFill === undefined) {
          el.dataset.origFill        = el.getAttribute('fill')         ?? ''
          el.dataset.origStroke      = el.getAttribute('stroke')       ?? ''
          el.dataset.origStrokeWidth = el.getAttribute('stroke-width') ?? ''
          el.dataset.origStyleFill   = el.style.fill   ?? ''
          el.dataset.origStyleStroke = el.style.stroke ?? ''
        }
        // Strip fills, apply black stroke
        el.setAttribute('fill', 'none')
        el.style.fill = 'none'
        el.setAttribute('stroke', '#000000')
        el.style.stroke = '#000000'
        const sw = parseFloat(el.getAttribute('stroke-width'))
        el.setAttribute('stroke-width', isNaN(sw) ? '1.5' : Math.max(sw, 1.2))
      } else {
        // Restore originals
        if (el.dataset.origFill !== undefined) {
          el.dataset.origFill        ? el.setAttribute('fill',         el.dataset.origFill)        : el.removeAttribute('fill')
          el.dataset.origStroke      ? el.setAttribute('stroke',       el.dataset.origStroke)      : el.removeAttribute('stroke')
          el.dataset.origStrokeWidth ? el.setAttribute('stroke-width', el.dataset.origStrokeWidth) : el.removeAttribute('stroke-width')
          el.style.fill   = el.dataset.origStyleFill
          el.style.stroke = el.dataset.origStyleStroke
        }
      }
    })
  })

  // Fallback for any <img> tags that couldn't be inlined
  iconNav.querySelectorAll('img').forEach(img => {
    img.style.filter = wire ? 'brightness(0) opacity(0.25)' : ''
  })
}

inlineSVGs()

// === SPACE KEY TOGGLE ===
window.addEventListener('keydown', (e) => {
  if (e.code !== 'Space') return;
  if (!loadedModel) return;

  isWireframe = !isWireframe;

  // --- 3D model ---
  loadedModel.traverse(obj => {
    if (!obj.isMesh) return;

    if (isWireframe) {
      if (!obj.userData.originalMaterial) {
        obj.userData.originalMaterial = obj.material;
      }
      obj.material = new THREE.MeshBasicMaterial({
        color: 0x000000,
        wireframe: true,
      });
    } else {
      if (obj.userData.originalMaterial) {
        obj.material = obj.userData.originalMaterial;
      }
    }
  });

  reflector.visible = !isWireframe;
  softenFloor.visible = !isWireframe;

  // --- Icons ---
  applyIconWireframe(isWireframe);
});


function animate(){
requestAnimationFrame(animate)
controls.update()
composer.render()
}
animate()

window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight
camera.updateProjectionMatrix()
renderer.setSize(window.innerWidth,window.innerHeight)
composer.setSize(window.innerWidth,window.innerHeight)
})
}
init()
</script> </body> </html>
