<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>batmobile</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background-color:white;overflow:hidden}#three-container{width:100vw;height:100vh}#name-header{position:fixed;top:2rem;left:2rem;z-index:100;font-size:2.5rem;font-weight:600;color:#000;white-space:nowrap;border-right:2px solid currentColor;padding-right:.5rem}#subtitle{position:fixed;top:5rem;left:2rem;z-index:100;font-family:ui-monospace,monospace;color:#666;opacity:0;transition:opacity .6s ease}#subtitle.visible{opacity:1}#theme-toggle{position:fixed;top:1rem;right:1rem;z-index:9999;background:rgba(0,0,0,0.1);border:1px solid rgba(0,0,0,0.2);border-radius:50%;width:50px;height:50px;cursor:pointer;font-size:1.5rem;display:flex;align-items:center;justify-content:center;transition:all .2s ease}#theme-toggle:hover{background:rgba(0,0,0,0.2);transform:scale(1.1)}body.dark{background-color:#1a1a1a}body.dark #name-header,body.dark #subtitle{color:#fff}body.dark #theme-toggle{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2)}body.dark #theme-toggle:hover{background:rgba(255,255,255,0.2)}</style> </head> <body> <div id="three-container"></div> <h1 id="name-header"></h1> <p id="subtitle"><span id="live-age"></span> bats</p> <button id="theme-toggle">🌙</button> <script>
    const birthDate = new Date("2006-12-30T02:00:00.700Z");
    
    function computeAge() {
      const now = new Date();
      return ((now - birthDate) / (365.2422 * 24*60*60*1000)).toFixed(10);
    }
    
    function updateAge() {
      const el = document.getElementById("live-age");
      if (el) el.textContent = computeAge();
    }
    
    function typeNameWithTypos(el) {
      if (!el || el.dataset.typing === "1") return;
      el.dataset.typing = "1";
      
      const firstName = "Akash ";
      const typos = ["Nabghirava", "Nagabhirva", "Nagabhirava"];
      let phase = "first";
      let firstIndex = 0;
      let stage = 0;
      let index = 0;
      let deleting = false;
      
      function jitter(base) {
        return Math.max(10, base + Math.floor(Math.random() * 60) - 30);
      }
      
      function step() {
        if (!document.body.contains(el)) {
          el.dataset.typing = "0";
          return;
        }
        
        if (phase === "first") {
          el.textContent = firstName.slice(0, firstIndex + 1);
          firstIndex++;
          if (firstIndex < firstName.length) {
            return setTimeout(step, jitter(110));
          }
          phase = "last";
          index = 0;
          return setTimeout(step, 200);
        }
        
        const target = typos[stage] || "";
        
        if (!deleting) {
          const visibleLast = target.slice(0, index + 1);
          el.textContent = firstName + visibleLast;
          index++;
          
          if (index < target.length) {
            return setTimeout(step, jitter(120));
          }
          
          if (stage < typos.length - 1) {
            setTimeout(() => {
              let deleteCount = (stage === 0) ? 8 : (stage === 1) ? 3 : 1;
              const visibleLen = (typos[stage] || "").length;
              deleteCount = Math.min(deleteCount, Math.max(1, visibleLen - 1));
              deleting = true;
              el.dataset.deletesLeft = String(deleteCount);
              step();
            }, 400);
            return;
          } else {
            setTimeout(() => {
              el.style.borderRight = "none";
              el.dataset.typing = "0";
              document.getElementById("subtitle").classList.add("visible");
            }, 320);
            return;
          }
        } else {
          let deletesLeft = parseInt(el.dataset.deletesLeft || "0", 10);
          if (deletesLeft <= 0) {
            deleting = false;
            stage++;
            setTimeout(() => {
              const visible = el.textContent.replace(firstName, "");
              index = visible.length;
              step();
            }, 200);
            return;
          }
          
          const currentVisible = el.textContent.replace(firstName, "");
          const newVisible = currentVisible.slice(0, -1);
          el.textContent = firstName + newVisible;
          deletesLeft--;
          el.dataset.deletesLeft = String(deletesLeft);
          return setTimeout(step, 55);
        }
      }
      
      step();
    }
    
    function initThreeScene() {
      const container = document.getElementById('three-container');
      const scene = new THREE.Scene();
      
      const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.5, 10);
      camera.lookAt(0, 0, 0);
      
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.4;
      container.appendChild(renderer.domElement);
      
      // Load Tokyo Big Sight HDRI for environment
      const rgbeLoader = new THREE.RGBELoader();
      rgbeLoader.load(
        'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/tokyo_bigsight_1k.hdr',
        function (texture) {
          texture.mapping = THREE.EquirectangularReflectionMapping;
          scene.environment = texture;
          console.log("HDRI loaded!");
        },
        undefined,
        function (error) {
          console.error('Error loading HDRI:', error);
          // Fallback to basic lighting if HDRI fails
          const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
          scene.add(ambientLight);
          
          const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
          mainLight.position.set(5, 10, 7);
          scene.add(mainLight);
        }
      );
      
      // Drag controls - FAST & RESPONSIVE
      let isDragging = false;
      let previousMouseX = 0;
      let previousMouseY = 0;
      let rotationY = -Math.PI * 0.25;
      let rotationX = -0.15;
      let targetRotationY = rotationY;
      let targetRotationX = rotationX;
      
      container.addEventListener('mousedown', (e) => {
        isDragging = true;
        previousMouseX = e.clientX;
        previousMouseY = e.clientY;
        container.style.cursor = 'grabbing';
      });
      
      document.addEventListener('mouseup', () => {
        isDragging = false;
        container.style.cursor = 'grab';
      });
      
      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousMouseX;
        const deltaY = e.clientY - previousMouseY;
        
        // FAST drag sensitivity
        targetRotationY += deltaX * 0.01;
        targetRotationX += deltaY * 0.01;
        
        targetRotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotationX));
        previousMouseX = e.clientX;
        previousMouseY = e.clientY;
      });
      
      container.style.cursor = 'grab';
      
      // FAST zoom
      let zoomLevel = 10;
      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomLevel += e.deltaY * 0.05;
        zoomLevel = Math.max(3, Math.min(30, zoomLevel));
        camera.position.z = zoomLevel;
      });
      
      // Load model
      const loader = new THREE.GLTFLoader();
      let modelGroup;
      
      loader.load(
        '/assets/models/batmobile_armored.glb',
        function (gltf) {
          const model = gltf.scene;
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          model.position.x = -center.x;
          model.position.y = -center.y;
          model.position.z = -center.z;
          
          modelGroup = new THREE.Group();
          modelGroup.add(model);
          
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 8 / maxDim;
          modelGroup.scale.setScalar(scale);
          
          modelGroup.rotation.y = rotationY;
          modelGroup.rotation.x = rotationX;
          targetRotationY = rotationY;
          targetRotationX = rotationX;
          
          scene.add(modelGroup);
          console.log("Model loaded!");
        },
        undefined,
        function (error) {
          console.error('Error loading model:', error);
        }
      );
      
      function animate() {
        requestAnimationFrame(animate);
        if (modelGroup) {
          // FAST damping for responsive feel
          rotationY += (targetRotationY - rotationY) * 0.25;
          rotationX += (targetRotationX - rotationX) * 0.25;
          modelGroup.rotation.y = rotationY;
          modelGroup.rotation.x = rotationX;
        }
        renderer.render(scene, camera);
      }
      animate();
      
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
    
    // Theme toggle
    const toggle = document.getElementById('theme-toggle');
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      toggle.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
    
    // Init
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      toggle.textContent = '☀️';
    }
    
    updateAge();
    setInterval(updateAge, 100);
    typeNameWithTypos(document.getElementById('name-header'));
    initThreeScene();
  </script> </body> </html>
