<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>batmobile</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background-color:white;overflow:hidden}#three-container{width:100vw;height:100vh}#name-header{position:fixed;top:2rem;left:2rem;z-index:100;font-size:2.5rem;font-weight:600;color:#000;white-space:nowrap;border-right:2px solid currentColor;padding-right:.5rem}#subtitle{position:fixed;top:5rem;left:2rem;z-index:100;font-family:ui-monospace,monospace;color:#666;opacity:0;transition:opacity .6s ease}#subtitle.visible{opacity:1}#theme-toggle{position:fixed;top:1rem;right:1rem;z-index:9999;background:rgba(0,0,0,0.1);border:1px solid rgba(0,0,0,0.2);border-radius:50%;width:50px;height:50px;cursor:pointer;font-size:1.5rem;display:flex;align-items:center;justify-content:center;transition:all .2s ease}#theme-toggle:hover{background:rgba(0,0,0,0.2);transform:scale(1.1)}#orb-hint{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);z-index:100;font-family:ui-monospace,monospace;font-size:.75rem;color:#999;opacity:1;transition:opacity 1s ease;pointer-events:none}#orb-hint.hidden{opacity:0}body.dark{background-color:#1a1a1a}body.dark #name-header,body.dark #subtitle{color:#fff}body.dark #orb-hint{color:#555}body.dark #theme-toggle{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2)}body.dark #theme-toggle:hover{background:rgba(255,255,255,0.2)}</style> </head> <body> <div id="three-container"></div> <h1 id="name-header"></h1> <p id="subtitle"><span id="live-age"></span> tall</p> <button id="theme-toggle">🌙</button> <p id="orb-hint">[ space ] to deploy</p> <script>
    // ─── AGE ──────────────────────────────────────────────────────────────────
    const birthDate = new Date("2006-12-30T02:00:00.700Z");
    function computeAge() {
      return ((new Date() - birthDate) / (365.2422 * 24*60*60*1000)).toFixed(10);
    }
    function updateAge() {
      const el = document.getElementById("live-age");
      if (el) el.textContent = computeAge();
    }

    // ─── TYPEWRITER ───────────────────────────────────────────────────────────
    function typeNameWithTypos(el) {
      if (!el || el.dataset.typing === "1") return;
      el.dataset.typing = "1";
      const firstName = "Akash ";
      const typos = ["Nabghirava", "Nagabhirva", "Nagabhirava"];
      let phase = "first", firstIndex = 0, stage = 0, index = 0, deleting = false;
      function jitter(base) { return Math.max(10, base + Math.floor(Math.random() * 60) - 30); }
      function step() {
        if (!document.body.contains(el)) { el.dataset.typing = "0"; return; }
        if (phase === "first") {
          el.textContent = firstName.slice(0, firstIndex + 1);
          firstIndex++;
          if (firstIndex < firstName.length) return setTimeout(step, jitter(110));
          phase = "last"; index = 0;
          return setTimeout(step, 200);
        }
        const target = typos[stage] || "";
        if (!deleting) {
          el.textContent = firstName + target.slice(0, index + 1);
          index++;
          if (index < target.length) return setTimeout(step, jitter(120));
          if (stage < typos.length - 1) {
            setTimeout(() => {
              let deleteCount = (stage === 0) ? 8 : (stage === 1) ? 3 : 1;
              deleteCount = Math.min(deleteCount, Math.max(1, (typos[stage]||"").length - 1));
              deleting = true;
              el.dataset.deletesLeft = String(deleteCount);
              step();
            }, 400);
            return;
          } else {
            setTimeout(() => {
              el.style.borderRight = "none";
              el.dataset.typing = "0";
              document.getElementById("subtitle").classList.add("visible");
            }, 320);
            return;
          }
        } else {
          let deletesLeft = parseInt(el.dataset.deletesLeft || "0", 10);
          if (deletesLeft <= 0) {
            deleting = false; stage++;
            setTimeout(() => { index = el.textContent.replace(firstName, "").length; step(); }, 200);
            return;
          }
          el.textContent = firstName + el.textContent.replace(firstName, "").slice(0, -1);
          el.dataset.deletesLeft = String(deletesLeft - 1);
          return setTimeout(step, 55);
        }
      }
      step();
    }

    // ─── THREE SCENE ──────────────────────────────────────────────────────────
    function initThreeScene() {
      const container = document.getElementById('three-container');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.5, 10);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.4;
      container.appendChild(renderer.domElement);

      new THREE.RGBELoader().load(
        'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/tokyo_bigsight_1k.hdr',
        (texture) => { texture.mapping = THREE.EquirectangularReflectionMapping; scene.environment = texture; },
        undefined,
        () => {
          scene.add(new THREE.AmbientLight(0xffffff, 1.2));
          const d = new THREE.DirectionalLight(0xffffff, 0.8);
          d.position.set(5, 10, 7);
          scene.add(d);
        }
      );

      // ─── ORBS ─────────────────────────────────────────────────────────────
      const ORB_LINKS = [
        { emoji: '🐙', label: 'GitHub',    url: 'https://github.com/akashngb',                              color: 0x333333 },
        { emoji: '💼', label: 'LinkedIn',  url: 'https://www.linkedin.com/in/akash-nagabhirava-164155327/', color: 0x0077b5 },
        { emoji: '🎵', label: 'Spotify',   url: 'https://open.spotify.com/user/obxzyzxv5yuu7qo1u3qaxvsqm', color: 0x1db954 },
        { emoji: '📸', label: 'Instagram', url: 'https://instagram.com/akash30n',                           color: 0xe1306c },
        { emoji: '✉️', label: 'Email',     url: 'mailto:akash30n@gmail.com',                                    color: 0x4a90d9 },
      ];

      const ORB_TARGETS = [
        new THREE.Vector3( 2.5,  1.0,  0.5),
        new THREE.Vector3(-2.5,  1.0,  0.5),
        new THREE.Vector3( 1.5,  2.2, -0.5),
        new THREE.Vector3(-1.5,  2.2, -0.5),
        new THREE.Vector3( 0.0,  2.8,  1.0),
      ];

      let orbsDeployed = false;
      let orbAnimating = false;
      let orbMeshes = [];

      function makeOrbTexture(emoji, hexColor) {
        const size = 256;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        const r = (hexColor >> 16) & 255, g = (hexColor >> 8) & 255, b = hexColor & 255;
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.beginPath();
        ctx.arc(size/2, size/2, size/2 - 4, 0, Math.PI * 2);
        ctx.fill();
        const grd = ctx.createRadialGradient(size/2, size/2, size*0.1, size/2, size/2, size/2);
        grd.addColorStop(0, 'rgba(255,255,255,0.35)');
        grd.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(size/2, size/2, size/2 - 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = `${size * 0.44}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, size/2, size/2 + 4);
        return new THREE.CanvasTexture(canvas);
      }

      function createOrbs(modelGroup) {
        orbMeshes = ORB_LINKS.map((link, i) => {
          const mesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.28, 32, 32),
            new THREE.MeshStandardMaterial({
              map: makeOrbTexture(link.emoji, link.color),
              roughness: 0.3,
              metalness: 0.1,
              emissive: new THREE.Color(link.color),
              emissiveIntensity: 0.15,
            })
          );
          mesh.position.set(0, 0, 0);
          mesh.visible = false;
          mesh.userData = {
            target: ORB_TARGETS[i].clone(),
            origin: new THREE.Vector3(0, 0, 0),
            link: link.url,
            t: 0,
            bobOffset: i * (Math.PI * 2 / ORB_LINKS.length),
          };
          modelGroup.add(mesh);
          return mesh;
        });
      }

      function easeOutBack(t) {
        const c1 = 1.70158, c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }
      function easeInBack(t) {
        const c1 = 1.70158, c3 = c1 + 1;
        return c3 * t * t * t - c1 * t * t;
      }

      // Spacebar toggle
      document.addEventListener('keydown', (e) => {
        if (e.code !== 'Space') return;
        e.preventDefault();
        if (orbAnimating) return;
        orbsDeployed = !orbsDeployed;
        orbAnimating = true;
        if (orbsDeployed) {
          orbMeshes.forEach(orb => { orb.visible = true; orb.userData.t = 0; orb.position.set(0,0,0); });
          document.getElementById('orb-hint').classList.add('hidden');
        }
      });

      // Raycaster for clicks
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      container.addEventListener('click', (e) => {
        if (!orbsDeployed) return;
        mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(orbMeshes);
        if (hits.length > 0) window.open(hits[0].object.userData.link, '_blank');
      });

      // ─── DRAG ─────────────────────────────────────────────────────────────
      let isDragging = false, previousMouseX = 0, previousMouseY = 0;
      let rotationY = -Math.PI * 0.25, rotationX = -0.15;
      let targetRotationY = rotationY, targetRotationX = rotationX;

      container.addEventListener('mousedown', (e) => { isDragging = true; previousMouseX = e.clientX; previousMouseY = e.clientY; container.style.cursor = 'grabbing'; });
      document.addEventListener('mouseup', () => { isDragging = false; container.style.cursor = 'grab'; });
      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        targetRotationY += (e.clientX - previousMouseX) * 0.01;
        targetRotationX += (e.clientY - previousMouseY) * 0.01;
        targetRotationX = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotationX));
        previousMouseX = e.clientX; previousMouseY = e.clientY;
        // Cursor on orb hover
        if (orbsDeployed) {
          mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
          mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          container.style.cursor = raycaster.intersectObjects(orbMeshes).length > 0 ? 'pointer' : 'grabbing';
        }
      });
      container.style.cursor = 'grab';

      let zoomLevel = 10;
      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomLevel = Math.max(3, Math.min(30, zoomLevel + e.deltaY * 0.3));
        camera.position.z = zoomLevel;
      });

      // ─── LOAD MODEL ───────────────────────────────────────────────────────
      let modelGroup;
      new THREE.GLTFLoader().load(
        '/assets/models/batmobile_armored.glb',
        (gltf) => {
          const model = gltf.scene;
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          model.position.set(-center.x, -center.y, -center.z);
          modelGroup = new THREE.Group();
          modelGroup.add(model);
          const maxDim = Math.max(...box.getSize(new THREE.Vector3()).toArray());
          modelGroup.scale.setScalar(8 / maxDim);
          modelGroup.rotation.y = rotationY;
          modelGroup.rotation.x = rotationX;
          scene.add(modelGroup);
          createOrbs(modelGroup);
        },
        undefined,
        (e) => console.error('Model load error:', e)
      );

      // ─── ANIMATE ──────────────────────────────────────────────────────────
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        if (modelGroup) {
          rotationY += (targetRotationY - rotationY) * 0.25;
          rotationX += (targetRotationX - rotationX) * 0.25;
          modelGroup.rotation.y = rotationY;
          modelGroup.rotation.x = rotationX;
        }

        let allDone = true;
        orbMeshes.forEach((orb) => {
          const ud = orb.userData;
          const speed = 0.045;
          if (orbsDeployed) {
            if (ud.t < 1) { ud.t = Math.min(1, ud.t + speed); allDone = false; }
            orb.position.lerpVectors(ud.origin, ud.target, easeOutBack(ud.t));
            if (ud.t >= 1) {
              orb.position.y = ud.target.y + Math.sin(t * 1.4 + ud.bobOffset) * 0.08;
              orb.rotation.y = t * 0.6 + ud.bobOffset;
            }
          } else {
            if (ud.t > 0) { ud.t = Math.max(0, ud.t - speed * 1.4); allDone = false; }
            orb.position.lerpVectors(ud.origin, ud.target, easeInBack(Math.max(0, ud.t)));
            if (ud.t <= 0) orb.visible = false;
          }
        });
        if (allDone) orbAnimating = false;

        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // ─── THEME ────────────────────────────────────────────────────────────────
    const toggle = document.getElementById('theme-toggle');
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      toggle.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      toggle.textContent = '☀️';
    }

    // ─── INIT ─────────────────────────────────────────────────────────────────
    updateAge();
    setInterval(updateAge, 100);
    typeNameWithTypos(document.getElementById('name-header'));
    initThreeScene();
  </script> </body> </html>
