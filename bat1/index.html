<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>bat1</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VignetteShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script> <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f5f5;overflow:hidden}#three-container{width:100vw;height:100vh;cursor:default}#name-overlay{position:fixed;top:36px;left:40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:clamp(1.6rem,2.8vw,2.4rem);font-weight:700;color:#111;opacity:0;pointer-events:none;white-space:nowrap;z-index:100;letter-spacing:-0.01em}</style> </head> <body> <div id="three-container"></div> <div id="name-overlay">Akash Nagabhirava</div> <script>
function init(){
  let iconsVisible = false;
  const nameOverlay = document.getElementById('name-overlay');

  const CARDS = [
    { label: 'MAIL',      sub: 'Contact',   icon: '/assets/icons/mail.svg',      href: 'mailto:you@email.com' },
    { label: 'GITHUB',    sub: 'Code',      icon: '/assets/icons/github.svg',    href: 'https://github.com/' },
    { label: 'LINKEDIN',  sub: 'Network',   icon: '/assets/icons/linkedin.svg',  href: 'https://linkedin.com/' },
    { label: 'SPOTIFY',   sub: 'Music',     icon: '/assets/icons/spotify.svg',   href: 'https://open.spotify.com/' },
    { label: 'INSTAGRAM', sub: 'Visual',    icon: '/assets/icons/instagram.svg', href: 'https://instagram.com/' },
    { label: 'THEME',     sub: 'Settings',  icon: '/assets/icons/sun.svg',       href: '#' },
  ];

  // ── Scene ──────────────────────────────────────────────────────────
  const container = document.getElementById('three-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf5f5f5);

  const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(4.1, 2.1, 4.9);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  const composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  composer.addPass(new THREE.UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.5, 0.6
  ));
  composer.addPass(new THREE.ShaderPass(THREE.VignetteShader));
  composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));

  new THREE.RGBELoader().load('/assets/hdri/studio_small_09_1k.hdr', (hdr) => {
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromEquirectangular(hdr).texture;
    hdr.dispose(); pmrem.dispose();
  }, undefined, () => {});

  const key = new THREE.DirectionalLight(0xffffff, 2.5);
  key.position.set(6,10,6); key.castShadow = true; scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.5);
  fill.position.set(-6,4,2); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 1);
  rim.position.set(0,6,-8); scene.add(rim);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xcccccc, 0.25));

  const reflector = new THREE.Reflector(new THREE.PlaneGeometry(30,30), {
    textureWidth:1024, textureHeight:1024, color:0xbdbdbd, clipBias:0.003, multisample:4
  });
  reflector.rotation.x = -Math.PI/2;
  scene.add(reflector);

  const reflectionFade = new THREE.Mesh(
    new THREE.PlaneGeometry(30,30),
    new THREE.MeshPhysicalMaterial({ color:0xffffff, roughness:0.35, metalness:0, transparent:true, opacity:0.25 })
  );
  reflectionFade.rotation.x = -Math.PI/2;
  reflectionFade.position.y = 0.002;
  scene.add(reflectionFade);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.25;
  controls.zoomSpeed = 3;
  controls.target.set(0,0.8,0);
  controls.update();

  new THREE.GLTFLoader().load('/assets/models/batmobile_armored.glb', (gltf) => {
    const model = gltf.scene;
    model.rotation.y = Math.PI * 0.75 - Math.PI / 3;
    model.position.set(0,0,0);
    model.scale.set(1,1,1);
    model.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = o.receiveShadow = true;
      const mat = o.material;
      if (!mat) return;
      if (mat.transparent || mat.opacity < 0.95) {
        mat.transmission=0.6; mat.roughness=0.05; mat.envMapIntensity=2.5; return;
      }
      if (mat.metalness > 0.6) {
        mat.envMapIntensity=2; mat.roughness=Math.max(mat.roughness,0.2); return;
      }
      mat.clearcoat=0.6; mat.clearcoatRoughness=0.08; mat.envMapIntensity=1.6;
    });
    scene.add(model);
  }, undefined, (e) => console.error(e));

  // ── Holographic card canvas painter ───────────────────────────────
  const CW = 320, CH = 420;

  function drawHoloCard(ctx, label, sub, accentH) {
    ctx.clearRect(0, 0, CW, CH);

    // --- background fill: very dark navy, nearly black
    const bg = ctx.createLinearGradient(0, 0, 0, CH);
    bg.addColorStop(0,   'rgba(2,8,24,0.93)');
    bg.addColorStop(0.5, 'rgba(4,14,38,0.90)');
    bg.addColorStop(1,   'rgba(2,8,24,0.95)');
    roundRect(ctx, 0, 0, CW, CH, 8);
    ctx.fillStyle = bg;
    ctx.fill();

    // --- outer glow border
    const borderGrad = ctx.createLinearGradient(0, 0, CW, CH);
    borderGrad.addColorStop(0,   `hsla(${accentH},100%,70%,0.0)`);
    borderGrad.addColorStop(0.3, `hsla(${accentH},100%,70%,0.9)`);
    borderGrad.addColorStop(0.7, `hsla(${accentH},100%,70%,0.9)`);
    borderGrad.addColorStop(1,   `hsla(${accentH},100%,70%,0.0)`);
    roundRect(ctx, 0, 0, CW, CH, 8);
    ctx.strokeStyle = borderGrad;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // --- inner edge highlight (top + left)
    ctx.strokeStyle = `hsla(${accentH},100%,90%,0.25)`;
    ctx.lineWidth = 1;
    roundRect(ctx, 2, 2, CW-4, CH-4, 7);
    ctx.stroke();

    // --- top accent bar
    const topBar = ctx.createLinearGradient(0, 0, CW, 0);
    topBar.addColorStop(0,   `hsla(${accentH},100%,65%,0)`);
    topBar.addColorStop(0.3, `hsla(${accentH},100%,65%,1)`);
    topBar.addColorStop(0.7, `hsla(${accentH},100%,65%,1)`);
    topBar.addColorStop(1,   `hsla(${accentH},100%,65%,0)`);
    ctx.fillStyle = topBar;
    ctx.fillRect(0, 0, CW, 3);

    // --- bottom accent bar
    ctx.fillStyle = topBar;
    ctx.fillRect(0, CH-3, CW, 3);

    // --- corner brackets
    const bLen = 22, bThick = 2.5;
    ctx.strokeStyle = `hsla(${accentH},100%,80%,0.95)`;
    ctx.lineWidth = bThick;
    ctx.lineCap = 'square';
    // top-left
    ctx.beginPath(); ctx.moveTo(0,bLen); ctx.lineTo(0,0); ctx.lineTo(bLen,0); ctx.stroke();
    // top-right
    ctx.beginPath(); ctx.moveTo(CW-bLen,0); ctx.lineTo(CW,0); ctx.lineTo(CW,bLen); ctx.stroke();
    // bottom-left
    ctx.beginPath(); ctx.moveTo(0,CH-bLen); ctx.lineTo(0,CH); ctx.lineTo(bLen,CH); ctx.stroke();
    // bottom-right
    ctx.beginPath(); ctx.moveTo(CW-bLen,CH); ctx.lineTo(CW,CH); ctx.lineTo(CW,CH-bLen); ctx.stroke();

    // --- scanlines
    ctx.globalAlpha = 0.04;
    for (let y = 0; y < CH; y += 3) {
      ctx.fillStyle = `hsl(${accentH},80%,70%)`;
      ctx.fillRect(4, y, CW-8, 1);
    }
    ctx.globalAlpha = 1;

    // --- circuit trace decoration (bottom area)
    ctx.strokeStyle = `hsla(${accentH},100%,60%,0.18)`;
    ctx.lineWidth = 1;
    // horizontal trace
    ctx.beginPath(); ctx.moveTo(20, CH-55); ctx.lineTo(CW-20, CH-55); ctx.stroke();
    // vertical ticks
    for (let x = 30; x < CW-20; x += 18) {
      const h = (x % 36 === 12) ? 10 : 5;
      ctx.beginPath(); ctx.moveTo(x, CH-55); ctx.lineTo(x, CH-55-h); ctx.stroke();
    }

    // --- label (MAIL, GITHUB, etc.)
    ctx.font = `800 38px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.letterSpacing = '4px';
    // glow
    ctx.shadowColor = `hsla(${accentH},100%,70%,1)`;
    ctx.shadowBlur = 18;
    ctx.fillStyle = `hsla(${accentH},100%,88%,1)`;
    ctx.fillText(label, CW/2, CH - 90);
    ctx.shadowBlur = 0;

    // --- sub-label
    ctx.font = `400 16px 'Courier New', monospace`;
    ctx.fillStyle = `hsla(${accentH},80%,65%,0.6)`;
    ctx.fillText(sub.toUpperCase(), CW/2, CH - 64);
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  // accent hues per card (blue family with slight variation)
  const ACCENT_HUES = [195, 210, 185, 200, 215, 190];

  function makeHoloTexture(label, sub, iconSrc, accentH, onReady) {
    const canvas = document.createElement('canvas');
    canvas.width = CW; canvas.height = CH;
    const ctx = canvas.getContext('2d');

    function finish(iconImg) {
      drawHoloCard(ctx, label, sub, accentH);

      // icon — centered upper zone
      if (iconImg) {
        const iSize = 110;
        const ix = (CW - iSize) / 2;
        const iy = 42;

        // icon glow backdrop
        const glow = ctx.createRadialGradient(CW/2, iy+iSize/2, 0, CW/2, iy+iSize/2, iSize*0.9);
        glow.addColorStop(0,   `hsla(${accentH},100%,65%,0.22)`);
        glow.addColorStop(0.6, `hsla(${accentH},100%,55%,0.08)`);
        glow.addColorStop(1,   `hsla(${accentH},100%,55%,0.0)`);
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, CW, CH);

        // draw icon tinted cyan/blue via screen blend
        ctx.globalCompositeOperation = 'source-over';
        // dim placeholder so screen blend tints it
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = '#000';
        ctx.fillRect(ix, iy, iSize, iSize);
        ctx.globalAlpha = 1;

        ctx.drawImage(iconImg, ix, iy, iSize, iSize);

        // tint to blue via screen
        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = `hsla(${accentH},100%,55%,0.75)`;
        ctx.fillRect(ix, iy, iSize, iSize);
        ctx.globalCompositeOperation = 'source-over';

        // horizontal divider below icon
        const divGrad = ctx.createLinearGradient(0,0,CW,0);
        divGrad.addColorStop(0,   `hsla(${accentH},100%,70%,0)`);
        divGrad.addColorStop(0.5, `hsla(${accentH},100%,70%,0.5)`);
        divGrad.addColorStop(1,   `hsla(${accentH},100%,70%,0)`);
        ctx.strokeStyle = divGrad;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(24, iy+iSize+18);
        ctx.lineTo(CW-24, iy+iSize+18);
        ctx.stroke();
      }

      onReady(new THREE.CanvasTexture(canvas));
    }

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => finish(img);
    img.onerror = () => finish(null);
    img.src = iconSrc;
  }

  // ── Place cards in scene ──────────────────────────────────────────
  const cardGroup = new THREE.Group();
  scene.add(cardGroup);

  const cardMeshes = [];

  // Arc in front-right of car, angled toward viewer
  const ARC_RADIUS  = 3.8;
  const ARC_CX      = 1.0;
  const ARC_CZ      = 1.0;
  const ARC_START   = -Math.PI * 0.05;
  const ARC_SPAN    =  Math.PI * 0.68;
  const HIDDEN_Y    = -2.2;
  const FLOAT_Y     =  1.55;

  // card world dimensions
  const CW3 = 0.82;
  const CH3 = CW3 * (CH / CW);

  CARDS.forEach((card, i) => {
    const t = i / (CARDS.length - 1);
    const angle = ARC_START + t * ARC_SPAN;
    const x = ARC_CX + Math.cos(angle) * ARC_RADIUS;
    const z = ARC_CZ + Math.sin(angle) * ARC_RADIUS;

    const geo = new THREE.PlaneGeometry(CW3, CH3);
    const mat = new THREE.MeshBasicMaterial({
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
      depthWrite: false,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, HIDDEN_Y, z);
    mesh.lookAt(new THREE.Vector3(4.1, 2.1, 4.9));
    mesh.rotateX(-0.1);
    cardGroup.add(mesh);

    const floatOffset = Math.sin(i * 1.1) * 0.12;
    cardMeshes.push({ mesh, href: card.href, floatOffset });

    makeHoloTexture(card.label, card.sub, card.icon, ACCENT_HUES[i], (tex) => {
      mat.map = tex;
      mat.needsUpdate = true;
    });

    // ── Edge glow lines: thin bright planes on card edges ────────────
    const edgeColor = new THREE.Color().setHSL(ACCENT_HUES[i]/360, 1, 0.65);
    const edgeMat = new THREE.MeshBasicMaterial({ color: edgeColor, transparent: true, opacity: 0, side: THREE.DoubleSide });

    // top edge
    const topEdge = new THREE.Mesh(new THREE.PlaneGeometry(CW3, 0.006), edgeMat.clone());
    topEdge.position.set(0, CH3/2, 0.001);
    mesh.add(topEdge);
    // bottom edge
    const botEdge = new THREE.Mesh(new THREE.PlaneGeometry(CW3, 0.006), edgeMat.clone());
    botEdge.position.set(0, -CH3/2, 0.001);
    mesh.add(botEdge);
    // left edge
    const leftEdge = new THREE.Mesh(new THREE.PlaneGeometry(0.006, CH3), edgeMat.clone());
    leftEdge.position.set(-CW3/2, 0, 0.001);
    mesh.add(leftEdge);
    // right edge
    const rightEdge = new THREE.Mesh(new THREE.PlaneGeometry(0.006, CH3), edgeMat.clone());
    rightEdge.position.set(CW3/2, 0, 0.001);
    mesh.add(rightEdge);

    cardMeshes[i].edges = [topEdge, botEdge, leftEdge, rightEdge].map(e => e.material);
  });

  // ── Show / hide ───────────────────────────────────────────────────
  function showCards() {
    cardMeshes.forEach(({ mesh, floatOffset, edges }, i) => {
      gsap.to(mesh.position, {
        y: FLOAT_Y + floatOffset,
        duration: 0.8, delay: i * 0.09, ease: 'back.out(1.4)'
      });
      gsap.to(mesh.material, {
        opacity: 1, duration: 0.55, delay: i * 0.09, ease: 'power2.out'
      });
      edges && edges.forEach(em => {
        gsap.to(em, { opacity: 0.85, duration: 0.55, delay: i * 0.09 + 0.2 });
      });
    });
    gsap.to(nameOverlay, { opacity: 1, duration: 0.5, ease: 'power2.out' });
  }

  function hideCards() {
    cardMeshes.forEach(({ mesh, edges }, i) => {
      gsap.to(mesh.position, {
        y: HIDDEN_Y, duration: 0.45, delay: i * 0.05, ease: 'power2.in'
      });
      gsap.to(mesh.material, {
        opacity: 0, duration: 0.3, delay: i * 0.05
      });
      edges && edges.forEach(em => {
        gsap.to(em, { opacity: 0, duration: 0.25, delay: i * 0.05 });
      });
    });
    gsap.to(nameOverlay, { opacity: 0, duration: 0.3 });
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      iconsVisible = !iconsVisible;
      if (iconsVisible) showCards(); else hideCards();
    }
  });

  // ── Raycaster ─────────────────────────────────────────────────────
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  renderer.domElement.addEventListener('click', e => {
    if (!iconsVisible) return;
    mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(cardMeshes.map(c => c.mesh));
    if (hits.length > 0) {
      const hit = cardMeshes.find(c => c.mesh === hits[0].object);
      if (hit && hit.href && hit.href !== '#') window.open(hit.href, '_blank');
    }
  });

  renderer.domElement.addEventListener('mousemove', e => {
    if (!iconsVisible) { renderer.domElement.style.cursor = 'default'; return; }
    mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(cardMeshes.map(c => c.mesh));
    renderer.domElement.style.cursor = hits.length > 0 ? 'pointer' : 'default';
  });

  // ── Float + edge pulse animation ──────────────────────────────────
  const clock = new THREE.Clock();
  function floatCards(t) {
    if (!iconsVisible) return;
    cardMeshes.forEach(({ mesh, floatOffset, edges }, i) => {
      mesh.position.y = FLOAT_Y + floatOffset + Math.sin(t * 0.7 + i * 1.2) * 0.055;
      // pulse edge opacity
      if (edges) {
        const pulse = 0.55 + 0.3 * Math.sin(t * 2.2 + i * 0.8);
        edges.forEach(em => { if (em.opacity > 0.1) em.opacity = pulse; });
      }
    });
  }



  // ── Render loop ───────────────────────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    floatCards(clock.getElapsedTime());
    composer.render();
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });
}
init();
</script> </body> </html>
