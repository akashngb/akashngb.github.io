</script> <script>
  // ─── Sketchfab Viewer API ──────────────────────────────────────────────────────
  let sfApi = null;
  let camReady = false;

  // Cached camera state (owned while hand is active)
  let cEye = null, cTarget = null;
  let handActive = false;

  // Smoothed finger tracking
  let smoothX = null, smoothY = null;
  let prevSX = null, prevSY = null;
  const ALPHA = 0.35;       // Position smoothing (lower = smoother)
  const GAIN  = 4.0;        // Radians per normalized-screen-unit of finger movement
  const MIN_DELTA = 0.0008; // Dead zone to ignore jitter

  // ─── Rotate point around Y-axis (pure horizontal) ──────────────────────────────
  function rotateYAxis(eye, target, angle) {
    const dx = eye[0] - target[0];
    const dy = eye[1] - target[1]; // stays constant
    const dz = eye[2] - target[2];
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    return [
      target[0] + dx * cos - dz * sin,
      target[1] + dy,  // Y never changes
      target[2] + dx * sin + dz * cos
    ];
  }

  // ─── Init Sketchfab ────────────────────────────────────────────────────────────
  (function() {
    const iframe = document.getElementById('sketchfab-iframe');
    const client = new Sketchfab(iframe);
    client.init('sBv577Vdl9lrcvyFT3vbNvkGKml', {
      success: function(api) {
        sfApi = api;
        api.start(function() {
          api.setUserInteraction(true); // Mouse stays enabled
          setTimeout(function() { camReady = true; }, 2500);
        });
      },
      error: function() { console.error('Sketchfab init failed'); },
      autostart:1, preload:1, transparent:1,
      ui_animations:0, ui_infos:0, ui_stop:0, ui_inspector:0,
      ui_watermark_link:0, ui_watermark:0, ui_hint:0, ui_ar:0,
      ui_help:0, ui_settings:0, ui_vr:0, ui_fullscreen:0,
      ui_annotations:0, ui_downloads:0, ui_share:0,
    });
  })();

  // ─── Hand tracking ─────────────────────────────────────────────────────────────
  const videoEl = document.getElementById('hand-video');
  const canvas  = document.getElementById('hand-canvas');
  const ctx     = canvas.getContext('2d');
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ─── Draw neon skeleton (DEEP NEON BLUE) ───────────────────────────────────────
  function drawNeonSkeleton(lms) {
    const c = '#0066ff';
    ctx.save();
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#0088ff';
    ctx.strokeStyle = c;
    ctx.lineWidth = 3;
    const conn = [
      [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],[0,17]
    ];
    conn.forEach(([a,b]) => {
      ctx.beginPath();
      ctx.moveTo(lms[a].x*canvas.width, lms[a].y*canvas.height);
      ctx.lineTo(lms[b].x*canvas.width, lms[b].y*canvas.height);
      ctx.stroke();
    });
    ctx.fillStyle = c;
    lms.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x*canvas.width, p.y*canvas.height, 4, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.restore();
  }

  // ─── Gesture: pointer finger extended, all others curled ───────────────────────
  function isPointing(l) {
    return l[8].y < l[6].y - 0.02 &&
           l[12].y > l[10].y - 0.01 &&
           l[16].y > l[14].y - 0.01 &&
           l[20].y > l[18].y - 0.01;
  }

  // ─── Main callback ─────────────────────────────────────────────────────────────
  function onResults(results) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) {
      handActive = false;
      smoothX = smoothY = prevSX = prevSY = null;
      return;
    }

    const l = results.multiHandLandmarks[0];
    drawNeonSkeleton(l);

    // Only orbit when pointing (= "mousedown")
    if (!isPointing(l) || !sfApi || !camReady) {
      handActive = false;
      smoothX = smoothY = prevSX = prevSY = null;
      return;
    }

    // Smooth the finger tip position (mirrored X)
    const rawX = 1 - l[8].x;
    const rawY = l[8].y;
    if (smoothX === null) { smoothX = rawX; smoothY = rawY; }
    else { smoothX += ALPHA * (rawX - smoothX); smoothY += ALPHA * (rawY - smoothY); }

    // First frame of pointing: snapshot camera, initialize prev position
    if (!handActive) {
      handActive = true;
      prevSX = smoothX; prevSY = smoothY;
      sfApi.getCameraLookAt(function(err, cam) {
        if (!err) {
          cEye = cam.position.slice();
          cTarget = cam.target.slice();
        }
      });
      return; // Skip first frame for async sync
    }

    // Frame-to-frame delta from smoothed position (like a trackpad)
    const dx = smoothX - prevSX;
    prevSX = smoothX;
    prevSY = smoothY;

    // Dead zone filter — only check horizontal movement
    if (Math.abs(dx) < MIN_DELTA) return;

    // Pure Y-axis rotation: eye orbits target horizontally, Y never changes
    const angle = -dx * GAIN;  // finger right → model surface moves right
    cEye = rotateYAxis(cEye, cTarget, angle);
    sfApi.setCameraLookAt(cEye, cTarget, 0);
  }

  // ─── Init MediaPipe ────────────────────────────────────────────────────────────
  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  hands.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.85, minTrackingConfidence:0.85 });
  hands.onResults(onResults);
  const cam = new Camera(videoEl, {
    onFrame: async () => { await hands.send({image:videoEl}); },
    width: 1280, height: 720
  });
  cam.start();
</script> </body> </html>
