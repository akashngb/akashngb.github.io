<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>bat1</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VignetteShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script> <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f5f5;overflow:hidden}#three-container{width:100vw;height:100vh;cursor:default}#name-overlay{position:fixed;top:36px;left:40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:clamp(1.6rem,2.8vw,2.4rem);font-weight:700;color:#111;opacity:0;pointer-events:none;white-space:nowrap;z-index:100;letter-spacing:-0.01em}</style> </head> <body> <div id="three-container"></div> <div id="name-overlay">Akash Nagabhirava</div> <script>
function init(){
  let iconsVisible = false;
  const nameOverlay = document.getElementById('name-overlay');

  // ── Card definitions ──────────────────────────────────────────────
  const CARDS = [
    { label: 'Mail',      icon: '/assets/icons/mail.svg',      href: 'mailto:you@email.com' },
    { label: 'GitHub',    icon: '/assets/icons/github.svg',    href: 'https://github.com/' },
    { label: 'LinkedIn',  icon: '/assets/icons/linkedin.svg',  href: 'https://linkedin.com/' },
    { label: 'Spotify',   icon: '/assets/icons/spotify.svg',   href: 'https://open.spotify.com/' },
    { label: 'Instagram', icon: '/assets/icons/instagram.svg', href: 'https://instagram.com/' },
    { label: 'Sun',       icon: '/assets/icons/sun.svg',       href: '#' },
  ];

  // ── Scene setup ───────────────────────────────────────────────────
  const container = document.getElementById('three-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf5f5f5);

  const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(4.1, 2.1, 4.9);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  const composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.25, 0.4, 0.85));
  composer.addPass(new THREE.ShaderPass(THREE.VignetteShader));
  composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));

  // HDRI
  new THREE.RGBELoader().load('/assets/hdri/studio_small_09_1k.hdr', (hdr) => {
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromEquirectangular(hdr).texture;
    hdr.dispose(); pmrem.dispose();
  }, undefined, () => {});

  // Lights
  const key = new THREE.DirectionalLight(0xffffff, 2.5);
  key.position.set(6, 10, 6); key.castShadow = true; scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.5);
  fill.position.set(-6, 4, 2); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 1);
  rim.position.set(0, 6, -8); scene.add(rim);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xcccccc, 0.25));

  // Floor
  const reflector = new THREE.Reflector(new THREE.PlaneGeometry(30, 30), {
    textureWidth: 1024, textureHeight: 1024,
    color: 0xbdbdbd, clipBias: 0.003, multisample: 4
  });
  reflector.rotation.x = -Math.PI / 2;
  scene.add(reflector);

  const reflectionFade = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30),
    new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.35, metalness: 0, transparent: true, opacity: 0.25 })
  );
  reflectionFade.rotation.x = -Math.PI / 2;
  reflectionFade.position.y = 0.002;
  scene.add(reflectionFade);

  // Controls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.25;
  controls.zoomSpeed = 3;
  controls.target.set(0, 0.8, 0);
  controls.update();

  // Car
  new THREE.GLTFLoader().load('/assets/models/batmobile_armored.glb', (gltf) => {
    const model = gltf.scene;
    model.rotation.y = Math.PI * 0.75 - Math.PI / 6;
    model.position.set(0, 0, 0);
    model.scale.set(1, 1, 1);
    model.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = o.receiveShadow = true;
      const mat = o.material;
      if (!mat) return;
      if (mat.transparent || mat.opacity < 0.95) {
        mat.transmission = 0.6; mat.roughness = 0.05; mat.envMapIntensity = 2.5; return;
      }
      if (mat.metalness > 0.6) {
        mat.envMapIntensity = 2; mat.roughness = Math.max(mat.roughness, 0.2); return;
      }
      mat.clearcoat = 0.6; mat.clearcoatRoughness = 0.08; mat.envMapIntensity = 1.6;
    });
    scene.add(model);
  }, undefined, (err) => console.error('GLB load failed', err));

  // ── Build card texture via Canvas ─────────────────────────────────
  // Each card is a canvas-painted plane: dark glass look with icon + label
  const CARD_W = 256;
  const CARD_H = 320;

  function makeCardTexture(label, iconSrc, onReady) {
    const canvas = document.createElement('canvas');
    canvas.width = CARD_W;
    canvas.height = CARD_H;
    const ctx = canvas.getContext('2d');

    function draw(iconImg) {
      // Background — dark translucent glass
      const bg = ctx.createLinearGradient(0, 0, 0, CARD_H);
      bg.addColorStop(0, 'rgba(20,20,28,0.92)');
      bg.addColorStop(1, 'rgba(10,10,16,0.97)');
      ctx.clearRect(0, 0, CARD_W, CARD_H);

      // Rounded rect fill
      const r = 22;
      ctx.beginPath();
      ctx.moveTo(r, 0); ctx.lineTo(CARD_W - r, 0);
      ctx.quadraticCurveTo(CARD_W, 0, CARD_W, r);
      ctx.lineTo(CARD_W, CARD_H - r);
      ctx.quadraticCurveTo(CARD_W, CARD_H, CARD_W - r, CARD_H);
      ctx.lineTo(r, CARD_H); ctx.quadraticCurveTo(0, CARD_H, 0, CARD_H - r);
      ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = bg;
      ctx.fill();

      // Subtle top border glow
      const borderGrad = ctx.createLinearGradient(0, 0, CARD_W, 0);
      borderGrad.addColorStop(0,   'rgba(80,160,255,0)');
      borderGrad.addColorStop(0.5, 'rgba(80,160,255,0.7)');
      borderGrad.addColorStop(1,   'rgba(80,160,255,0)');
      ctx.strokeStyle = borderGrad;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(r, 0); ctx.lineTo(CARD_W - r, 0);
      ctx.stroke();

      // Scanlines overlay for HUD feel
      ctx.globalAlpha = 0.04;
      for (let y = 0; y < CARD_H; y += 4) {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, y, CARD_W, 1);
      }
      ctx.globalAlpha = 1;

      // Icon — centered upper portion
      if (iconImg) {
        const iconSize = 96;
        const ix = (CARD_W - iconSize) / 2;
        const iy = 60;
        // glow behind icon
        const glow = ctx.createRadialGradient(CARD_W/2, iy + iconSize/2, 0, CARD_W/2, iy + iconSize/2, iconSize * 0.85);
        glow.addColorStop(0, 'rgba(80,160,255,0.18)');
        glow.addColorStop(1, 'rgba(80,160,255,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, CARD_W, CARD_H);
        // tint icon white
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(iconImg, ix, iy, iconSize, iconSize);
        // overlay white tint
        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = 'rgba(200,220,255,0.55)';
        ctx.fillRect(ix, iy, iconSize, iconSize);
        ctx.globalCompositeOperation = 'source-over';
      }

      // Label
      ctx.font = '600 28px -apple-system, BlinkMacSystemFont, Helvetica, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.fillText(label, CARD_W / 2, CARD_H - 52);

      // Thin divider above label
      ctx.strokeStyle = 'rgba(80,160,255,0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(32, CARD_H - 72);
      ctx.lineTo(CARD_W - 32, CARD_H - 72);
      ctx.stroke();

      const tex = new THREE.CanvasTexture(canvas);
      onReady(tex);
    }

    // Load icon as image so we can draw it on canvas
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => draw(img);
    img.onerror = () => draw(null);
    img.src = iconSrc;
  }

  // ── Place cards in an arc in front-right of car ───────────────────
  // Arc centered slightly in front of car, fanning toward camera
  const cardGroup = new THREE.Group();
  scene.add(cardGroup);

  const cardMeshes = []; // { mesh, targetY, baseY, href }

  const ARC_RADIUS = 3.6;
  const ARC_CENTER_X = 1.2;
  const ARC_CENTER_Z = 1.2;
  // spread cards across ~120° arc angled toward camera
  const ARC_START = -Math.PI * 0.08;
  const ARC_SPAN  =  Math.PI * 0.72;
  const CARD_BASE_Y  = -1.8; // hidden below floor
  const CARD_FLOAT_Y =  1.5; // visible height

  // card world width/height in scene units
  const CW = 0.72;
  const CH = 0.9;

  CARDS.forEach((card, i) => {
    const t = i / (CARDS.length - 1);
    const angle = ARC_START + t * ARC_SPAN;
    const x = ARC_CENTER_X + Math.cos(angle) * ARC_RADIUS;
    const z = ARC_CENTER_Z + Math.sin(angle) * ARC_RADIUS;

    const geo = new THREE.PlaneGeometry(CW, CH);
    const mat = new THREE.MeshBasicMaterial({
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
      depthWrite: false,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, CARD_BASE_Y, z);

    // face the camera origin roughly
    mesh.lookAt(new THREE.Vector3(4.1, 2.1, 4.9));
    // tilt slightly back for elegance
    mesh.rotateX(-0.12);

    cardGroup.add(mesh);
    cardMeshes.push({ mesh, href: card.href, angle });

    makeCardTexture(card.label, card.icon, (tex) => {
      mat.map = tex;
      mat.needsUpdate = true;
    });
  });

  // ── Show / hide cards ─────────────────────────────────────────────
  function showCards() {
    cardMeshes.forEach(({ mesh }, i) => {
      gsap.to(mesh.position, {
        y: CARD_FLOAT_Y + Math.sin(i * 0.9) * 0.15, // slight height variation
        duration: 0.7,
        delay: i * 0.08,
        ease: 'back.out(1.6)'
      });
      gsap.to(mesh.material, {
        opacity: 1,
        duration: 0.5,
        delay: i * 0.08,
        ease: 'power2.out'
      });
    });
    gsap.to(nameOverlay, { opacity: 1, duration: 0.5, ease: 'power2.out' });
  }

  function hideCards() {
    cardMeshes.forEach(({ mesh }, i) => {
      gsap.to(mesh.position, {
        y: CARD_BASE_Y,
        duration: 0.45,
        delay: i * 0.05,
        ease: 'power2.in'
      });
      gsap.to(mesh.material, {
        opacity: 0,
        duration: 0.3,
        delay: i * 0.05,
        ease: 'power2.in'
      });
    });
    gsap.to(nameOverlay, { opacity: 0, duration: 0.3, ease: 'power2.in' });
  }

  // ── Space toggle ──────────────────────────────────────────────────
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      iconsVisible = !iconsVisible;
      if (iconsVisible) showCards(); else hideCards();
    }
  });

  // ── Raycaster for click-through to hrefs ──────────────────────────
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  renderer.domElement.addEventListener('click', (e) => {
    if (!iconsVisible) return;
    mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(cardMeshes.map(c => c.mesh));
    if (hits.length > 0) {
      const hit = cardMeshes.find(c => c.mesh === hits[0].object);
      if (hit && hit.href && hit.href !== '#') window.open(hit.href, '_blank');
    }
  });

  // cursor pointer on hover
  renderer.domElement.addEventListener('mousemove', (e) => {
    if (!iconsVisible) { renderer.domElement.style.cursor = 'default'; return; }
    mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(cardMeshes.map(c => c.mesh));
    renderer.domElement.style.cursor = hits.length > 0 ? 'pointer' : 'default';
  });

  // ── Gentle float animation ────────────────────────────────────────
  // animate each visible card bobbing slightly
  function floatCards(time) {
    if (!iconsVisible) return;
    cardMeshes.forEach(({ mesh }, i) => {
      const base = CARD_FLOAT_Y + Math.sin(i * 0.9) * 0.15;
      mesh.position.y = base + Math.sin(time * 0.8 + i * 1.1) * 0.06;
    });
  }

  // ── Music ─────────────────────────────────────────────────────────
  const audio = new Audio('/assets/music/wickedgames.mp3');
  audio.loop = true;
  audio.volume = 0.5;
  audio.play().catch(() => {
    const startMusic = () => {
      audio.play();
      window.removeEventListener('click', startMusic);
      window.removeEventListener('keydown', startMusic);
    };
    window.addEventListener('click', startMusic);
    window.addEventListener('keydown', startMusic);
  });

  // ── Render loop ───────────────────────────────────────────────────
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    floatCards(clock.getElapsedTime());
    composer.render();
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });
}
init();
</script> </body> </html>
