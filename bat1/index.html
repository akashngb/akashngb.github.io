</script> <script>
  // ─── Sketchfab Viewer API — camera control with rAF interpolation ──────────────
  let sfApi = null;
  let camEye = null, camTarget = null, camReady = false;

  // Velocity accumulators — written by MediaPipe, consumed by rAF loop
  let velOrbitX = 0, velOrbitY = 0;   // orbit (azimuth, elevation)
  let velPanX = 0, velPanY = 0;       // pan (right, up)
  let velZoom = 0;                     // zoom (distance scale)

  const DAMPING     = 0.85;   // Per-frame velocity damping for smooth deceleration
  const DEAD_ZONE   = 0.0005; // Ignore deltas below this
  const ORBIT_GAIN  = 2.5;
  const PAN_GAIN    = 3.0;
  const ZOOM_GAIN   = 4.0;

  // ─── Vector math ───────────────────────────────────────────────────────────────
  function vecSub(a, b) { return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
  function vecAdd(a, b) { return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
  function vecScale(v, s) { return [v[0]*s, v[1]*s, v[2]*s]; }
  function vecLen(v) { return Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]); }
  function vecNorm(v) { const l=vecLen(v); return l?[v[0]/l,v[1]/l,v[2]/l]:[0,0,1]; }
  function vecCross(a, b) {
    return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  }

  function toSpherical(eye, tgt) {
    const d=vecSub(eye,tgt), r=vecLen(d);
    return { r, theta: Math.atan2(d[0],d[2]), phi: Math.asin(Math.max(-1,Math.min(1,d[1]/r))) };
  }
  function fromSpherical(tgt, r, th, ph) {
    return [tgt[0]+r*Math.sin(th)*Math.cos(ph), tgt[1]+r*Math.sin(ph), tgt[2]+r*Math.cos(th)*Math.cos(ph)];
  }

  // ─── 60fps rAF camera loop ────────────────────────────────────────────────────
  function cameraLoop() {
    requestAnimationFrame(cameraLoop);
    if (!sfApi || !camReady) return;

    let dirty = false;

    // Orbit
    if (Math.abs(velOrbitX) > DEAD_ZONE || Math.abs(velOrbitY) > DEAD_ZONE) {
      const sph = toSpherical(camEye, camTarget);
      sph.theta += velOrbitX * ORBIT_GAIN;
      sph.phi   -= velOrbitY * ORBIT_GAIN;
      sph.phi = Math.max(-1.5, Math.min(1.5, sph.phi));
      camEye = fromSpherical(camTarget, sph.r, sph.theta, sph.phi);
      velOrbitX *= DAMPING;
      velOrbitY *= DAMPING;
      dirty = true;
    }

    // Pan
    if (Math.abs(velPanX) > DEAD_ZONE || Math.abs(velPanY) > DEAD_ZONE) {
      const fwd = vecNorm(vecSub(camTarget, camEye));
      const right = vecNorm(vecCross(fwd, [0,1,0]));
      const up = vecCross(right, fwd);
      const s = vecLen(vecSub(camEye, camTarget)) * PAN_GAIN;
      const off = vecAdd(vecScale(right, -velPanX*s), vecScale(up, velPanY*s));
      camEye = vecAdd(camEye, off);
      camTarget = vecAdd(camTarget, off);
      velPanX *= DAMPING;
      velPanY *= DAMPING;
      dirty = true;
    }

    // Zoom
    if (Math.abs(velZoom) > DEAD_ZONE) {
      const dir = vecSub(camEye, camTarget);
      const factor = 1.0 + velZoom * ZOOM_GAIN;
      camEye = vecAdd(camTarget, vecScale(dir, Math.max(0.05, factor)));
      velZoom *= DAMPING;
      dirty = true;
    }

    if (dirty) {
      sfApi.setCameraLookAt(camEye, camTarget, 0);
    }
  }
  requestAnimationFrame(cameraLoop);

  // ─── Init Sketchfab Viewer API ─────────────────────────────────────────────────
  (function() {
    const iframe = document.getElementById('sketchfab-iframe');
    const client = new Sketchfab(iframe);
    client.init('sBv577Vdl9lrcvyFT3vbNvkGKml', {
      success: function(api) {
        sfApi = api;
        api.start(function() {
          api.setUserInteraction(false);
          api.getCameraLookAt(function(err, cam) {
            if (!err) {
              camEye = cam.position.slice();
              camTarget = cam.target.slice();
              camReady = true;
            }
          });
        });
      },
      error: function() { console.error('Sketchfab init failed'); },
      autostart: 1, preload: 1, transparent: 1,
      ui_animations:0, ui_infos:0, ui_stop:0, ui_inspector:0,
      ui_watermark_link:0, ui_watermark:0, ui_hint:0, ui_ar:0,
      ui_help:0, ui_settings:0, ui_vr:0, ui_fullscreen:0,
      ui_annotations:0, ui_downloads:0, ui_share:0,
    });
  })();

  // ─── Hand tracking ─────────────────────────────────────────────────────────────
  const videoEl = document.getElementById('hand-video');
  const canvas  = document.getElementById('hand-canvas');
  const ctx     = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ─── Draw neon skeleton (GREEN) ────────────────────────────────────────────────
  function drawNeonSkeleton(lms) {
    const c = '#39ff14';
    ctx.save();
    ctx.shadowBlur = 18;
    ctx.shadowColor = c;
    ctx.strokeStyle = c;
    ctx.lineWidth = 3;
    const conn = [
      [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],[0,17]
    ];
    conn.forEach(([a,b]) => {
      ctx.beginPath();
      ctx.moveTo(lms[a].x*canvas.width, lms[a].y*canvas.height);
      ctx.lineTo(lms[b].x*canvas.width, lms[b].y*canvas.height);
      ctx.stroke();
    });
    ctx.fillStyle = c;
    lms.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x*canvas.width, p.y*canvas.height, 4, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.restore();
  }

  // ─── Gesture detection ─────────────────────────────────────────────────────────
  function d2(a,b) { return Math.hypot(a.x-b.x, a.y-b.y); }

  function isThreeFingerPinch(l) {
    return d2(l[4],l[8])<0.08 && d2(l[4],l[12])<0.08 && d2(l[8],l[12])<0.08;
  }
  function isPointing(l) {
    return l[8].y<l[6].y-0.02 && l[12].y>l[10].y-0.01 &&
           l[16].y>l[14].y-0.01 && l[20].y>l[18].y-0.01 && d2(l[4],l[8])>0.07;
  }
  function isOpenPalm(l) {
    return l[8].y<l[6].y-0.02 && l[12].y<l[10].y-0.02 &&
           l[16].y<l[14].y-0.02 && l[20].y<l[18].y-0.02;
  }

  // ─── Gesture state ─────────────────────────────────────────────────────────────
  let prevG = 'idle', prevPos = null, prevPinch = null;

  function onResults(results) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) {
      prevG = 'idle'; prevPos = null; prevPinch = null;
      return;
    }
    const l = results.multiHandLandmarks[0];
    drawNeonSkeleton(l);

    let g = 'idle';
    if (isThreeFingerPinch(l)) g = 'pinch';
    else if (isPointing(l)) g = 'point';
    else if (isOpenPalm(l)) g = 'palm';

    if (g !== prevG) { prevPos = null; prevPinch = null; prevG = g; }

    if (g === 'pinch') {
      const avg = (d2(l[4],l[8]) + d2(l[4],l[12]) + d2(l[8],l[12])) / 3;
      if (prevPinch !== null) velZoom += (avg - prevPinch);
      prevPinch = avg;
    } else if (g === 'point') {
      const cur = { x: 1-l[8].x, y: l[8].y };
      if (prevPos) { velOrbitX += cur.x-prevPos.x; velOrbitY += cur.y-prevPos.y; }
      prevPos = cur;
    } else if (g === 'palm') {
      const cur = { x: 1-l[0].x, y: l[0].y };
      if (prevPos) { velPanX += cur.x-prevPos.x; velPanY += cur.y-prevPos.y; }
      prevPos = cur;
    } else {
      prevPos = null; prevPinch = null;
    }
  }

  // ─── Init MediaPipe ────────────────────────────────────────────────────────────
  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  hands.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.85, minTrackingConfidence:0.85 });
  hands.onResults(onResults);
  const cam = new Camera(videoEl, {
    onFrame: async () => { await hands.send({image:videoEl}); },
    width: 1280, height: 720
  });
  cam.start();
</script> </body> </html>
