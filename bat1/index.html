<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>bat1</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VignetteShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script> <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f5f5;overflow:hidden}#three-container{width:100vw;height:100vh;cursor:default}#name-overlay{position:fixed;top:36px;left:40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:clamp(1.6rem,2.8vw,2.4rem);font-weight:700;color:#111;opacity:0;pointer-events:none;white-space:nowrap;z-index:100;letter-spacing:-0.01em}</style> </head> <body> <div id="three-container"></div> <div id="name-overlay">Akash Nagabhirava</div> <script>
function init(){
  let iconsVisible = false;
  const nameOverlay = document.getElementById('name-overlay');

  // Cards: GitHub is featured (large), rest are small grid
  const CARDS = [
    { label: 'GITHUB',    sub: 'Code',     icon: '/assets/icons/github.svg',    href: 'https://github.com/', featured: true },
    { label: 'LINKEDIN',  sub: 'Network',  icon: '/assets/icons/linkedin.svg',  href: 'https://linkedin.com/' },
    { label: 'MAIL',      sub: 'Contact',  icon: '/assets/icons/mail.svg',      href: 'mailto:you@email.com' },
    { label: 'SPOTIFY',   sub: 'Music',    icon: '/assets/icons/spotify.svg',   href: 'https://open.spotify.com/' },
    { label: 'INSTAGRAM', sub: 'Visual',   icon: '/assets/icons/instagram.svg', href: 'https://instagram.com/' },
    { label: 'THEME',     sub: 'Settings', icon: '/assets/icons/sun.svg',       href: '#' },
  ];

  // ── Scene ──────────────────────────────────────────────────────────
  const container = document.getElementById('three-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf5f5f5);

  const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(4.1, 2.1, 4.9);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  const composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  // Bloom dialed WAY down — just a gentle edge glow, no mist
  composer.addPass(new THREE.UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.12,  // strength — was 0.6, now minimal
    0.4,   // radius
    0.9    // threshold — only very bright pixels bloom
  ));
  composer.addPass(new THREE.ShaderPass(THREE.VignetteShader));
  composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));

  new THREE.RGBELoader().load('/assets/hdri/studio_small_09_1k.hdr', (hdr) => {
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromEquirectangular(hdr).texture;
    hdr.dispose(); pmrem.dispose();
  }, undefined, () => {});

  const key = new THREE.DirectionalLight(0xffffff, 2.5);
  key.position.set(6,10,6); key.castShadow = true; scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.5);
  fill.position.set(-6,4,2); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 1);
  rim.position.set(0,6,-8); scene.add(rim);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xcccccc, 0.25));

  const reflector = new THREE.Reflector(new THREE.PlaneGeometry(30,30), {
    textureWidth:1024, textureHeight:1024, color:0xbdbdbd, clipBias:0.003, multisample:4
  });
  reflector.rotation.x = -Math.PI/2;
  scene.add(reflector);

  const reflectionFade = new THREE.Mesh(
    new THREE.PlaneGeometry(30,30),
    new THREE.MeshPhysicalMaterial({ color:0xffffff, roughness:0.35, metalness:0, transparent:true, opacity:0.25 })
  );
  reflectionFade.rotation.x = -Math.PI/2;
  reflectionFade.position.y = 0.002;
  scene.add(reflectionFade);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.25;
  controls.zoomSpeed = 3;
  controls.target.set(0,0.8,0);
  controls.update();

  new THREE.GLTFLoader().load('/assets/models/batmobile_armored.glb', (gltf) => {
    const model = gltf.scene;
    model.rotation.y = Math.PI * 0.75 - Math.PI / 3;
    model.position.set(0,0,0);
    model.scale.set(1,1,1);
    model.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = o.receiveShadow = true;
      const mat = o.material;
      if (!mat) return;
      if (mat.transparent || mat.opacity < 0.95) {
        mat.transmission=0.6; mat.roughness=0.05; mat.envMapIntensity=2.5; return;
      }
      if (mat.metalness > 0.6) {
        mat.envMapIntensity=2; mat.roughness=Math.max(mat.roughness,0.2); return;
      }
      mat.clearcoat=0.6; mat.clearcoatRoughness=0.08; mat.envMapIntensity=1.6;
    });
    scene.add(model);
  }, undefined, (e) => console.error(e));

  // ── Card canvas painter ────────────────────────────────────────────
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  function paintCard(canvas, label, sub, iconImg, accentH, CW, CH) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, CW, CH);

    // bg
    const bg = ctx.createLinearGradient(0,0,0,CH);
    bg.addColorStop(0, 'rgba(2,8,24,0.94)');
    bg.addColorStop(1, 'rgba(4,14,40,0.97)');
    roundRect(ctx, 0, 0, CW, CH, 8);
    ctx.fillStyle = bg; ctx.fill();

    // outer border glow
    const border = ctx.createLinearGradient(0,0,CW,CH);
    border.addColorStop(0,   `hsla(${accentH},100%,70%,0)`);
    border.addColorStop(0.35,`hsla(${accentH},100%,70%,0.85)`);
    border.addColorStop(0.65,`hsla(${accentH},100%,70%,0.85)`);
    border.addColorStop(1,   `hsla(${accentH},100%,70%,0)`);
    roundRect(ctx, 0, 0, CW, CH, 8);
    ctx.strokeStyle = border; ctx.lineWidth = 1.5; ctx.stroke();

    // top accent bar
    const bar = ctx.createLinearGradient(0,0,CW,0);
    bar.addColorStop(0,   `hsla(${accentH},100%,65%,0)`);
    bar.addColorStop(0.3, `hsla(${accentH},100%,65%,1)`);
    bar.addColorStop(0.7, `hsla(${accentH},100%,65%,1)`);
    bar.addColorStop(1,   `hsla(${accentH},100%,65%,0)`);
    ctx.fillStyle = bar; ctx.fillRect(0, 0, CW, 3);

    // corner brackets
    const bLen = Math.min(18, CW*0.1);
    ctx.strokeStyle = `hsla(${accentH},100%,80%,0.95)`;
    ctx.lineWidth = 2; ctx.lineCap = 'square';
    ctx.beginPath(); ctx.moveTo(0,bLen); ctx.lineTo(0,0); ctx.lineTo(bLen,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CW-bLen,0); ctx.lineTo(CW,0); ctx.lineTo(CW,bLen); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,CH-bLen); ctx.lineTo(0,CH); ctx.lineTo(bLen,CH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CW-bLen,CH); ctx.lineTo(CW,CH); ctx.lineTo(CW,CH-bLen); ctx.stroke();

    // scanlines
    ctx.globalAlpha = 0.035;
    for (let y = 0; y < CH; y += 3) {
      ctx.fillStyle = `hsl(${accentH},80%,70%)`;
      ctx.fillRect(4, y, CW-8, 1);
    }
    ctx.globalAlpha = 1;

    // icon
    if (iconImg) {
      const iSize = Math.min(CW * 0.42, CH * 0.38);
      const ix = (CW - iSize) / 2;
      const iy = CH * 0.12;

      // glow
      const glow = ctx.createRadialGradient(CW/2,iy+iSize/2,0, CW/2,iy+iSize/2,iSize);
      glow.addColorStop(0, `hsla(${accentH},100%,65%,0.2)`);
      glow.addColorStop(1, `hsla(${accentH},100%,55%,0)`);
      ctx.fillStyle = glow; ctx.fillRect(0,0,CW,CH);

      ctx.drawImage(iconImg, ix, iy, iSize, iSize);
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = `hsla(${accentH},100%,55%,0.7)`;
      ctx.fillRect(ix, iy, iSize, iSize);
      ctx.globalCompositeOperation = 'source-over';

      // divider below icon
      const div = ctx.createLinearGradient(0,0,CW,0);
      div.addColorStop(0,   `hsla(${accentH},100%,70%,0)`);
      div.addColorStop(0.5, `hsla(${accentH},100%,70%,0.4)`);
      div.addColorStop(1,   `hsla(${accentH},100%,70%,0)`);
      ctx.strokeStyle = div; ctx.lineWidth = 1;
      const divY = iy + iSize + CH * 0.06;
      ctx.beginPath(); ctx.moveTo(CW*0.1, divY); ctx.lineTo(CW*0.9, divY); ctx.stroke();
    }

    // label
    const fontSize = Math.max(14, CW * 0.13);
    ctx.font = `800 ${fontSize}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.shadowColor = `hsla(${accentH},100%,70%,1)`;
    ctx.shadowBlur = 14;
    ctx.fillStyle = `hsla(${accentH},100%,88%,1)`;
    ctx.fillText(label, CW/2, CH * 0.82);
    ctx.shadowBlur = 0;

    // sub-label
    const subSize = Math.max(10, CW * 0.07);
    ctx.font = `400 ${subSize}px 'Courier New', monospace`;
    ctx.fillStyle = `hsla(${accentH},80%,65%,0.55)`;
    ctx.fillText(sub.toUpperCase(), CW/2, CH * 0.91);
  }

  function makeCardTexture(label, sub, iconSrc, accentH, CW, CH, onReady) {
    const canvas = document.createElement('canvas');
    canvas.width = CW; canvas.height = CH;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = () => { paintCard(canvas, label, sub, img,  accentH, CW, CH); onReady(new THREE.CanvasTexture(canvas)); };
    img.onerror = () => { paintCard(canvas, label, sub, null, accentH, CW, CH); onReady(new THREE.CanvasTexture(canvas)); };
    img.src = iconSrc;
  }

  // ── Layout: all cards on ONE flat vertical plane to the right ──────
  // Panel anchor: to the right of the car, same Z depth as camera target
  // Everything sits on x = PANEL_X, cards face camera directly

  const PANEL_X  =  3.8;   // right of car
  const PANEL_Z  = -0.5;   // slightly in front
  const PANEL_Y_CENTER = 1.4; // vertical center in scene

  // Featured (GitHub): large card
  const FEAT_W3 = 1.05;   // scene units wide
  const FEAT_H3 = 1.35;
  const FEAT_PX = 512;
  const FEAT_PY = 640;

  // Small cards: 2 columns x 2 rows = 5 cards (or 2x3 minus featured)
  const SM_W3 = 0.48;
  const SM_H3 = 0.58;
  const SM_PX = 256;
  const SM_PY = 300;

  const GAP = 0.06; // gap between cards

  // Layout plan (all in scene-unit offsets from panel center):
  // Featured card: top, centered
  // Small cards: 2 cols below
  const positions = [];

  // Featured centered at top
  positions.push({
    x: PANEL_X,
    y: PANEL_Y_CENTER + SM_H3 + GAP + FEAT_H3/2 - (FEAT_H3 + SM_H3*2 + GAP*2)/2 + (FEAT_H3 + SM_H3*2 + GAP*2)/2,
    z: PANEL_Z,
    w3: FEAT_W3, h3: FEAT_H3, pw: FEAT_PX, ph: FEAT_PY,
  });

  // We want: featured on top row, then 2x2 small grid below, then 1 last small centered
  // Total height: FEAT_H3 + GAP + SM_H3 + GAP + SM_H3
  const totalH = FEAT_H3 + GAP + SM_H3 + GAP + SM_H3;
  const topY   = PANEL_Y_CENTER + totalH / 2;

  // Recalc featured y
  positions[0].y = topY - FEAT_H3 / 2;

  // Row 1 of smalls (y below featured)
  const row1Y = topY - FEAT_H3 - GAP - SM_H3 / 2;
  const colOffset = SM_W3 / 2 + GAP / 2;
  positions.push({ x: PANEL_X - colOffset, y: row1Y, z: PANEL_Z, w3: SM_W3, h3: SM_H3, pw: SM_PX, ph: SM_PY });
  positions.push({ x: PANEL_X + colOffset, y: row1Y, z: PANEL_Z, w3: SM_W3, h3: SM_H3, pw: SM_PX, ph: SM_PY });

  // Row 2 of smalls
  const row2Y = row1Y - SM_H3 - GAP;
  positions.push({ x: PANEL_X - colOffset, y: row2Y, z: PANEL_Z, w3: SM_W3, h3: SM_H3, pw: SM_PX, ph: SM_PY });
  positions.push({ x: PANEL_X + colOffset, y: row2Y, z: PANEL_Z, w3: SM_W3, h3: SM_H3, pw: SM_PX, ph: SM_PY });
  // 6th card centered in row 3
  positions.push({ x: PANEL_X,             y: row2Y - SM_H3 - GAP, z: PANEL_Z, w3: SM_W3, h3: SM_H3, pw: SM_PX, ph: SM_PY });

  const ACCENT_HUES = [205, 195, 210, 200, 215, 190];
  const HIDDEN_Y = -3.0;

  const cardGroup = new THREE.Group();
  scene.add(cardGroup);
  const cardMeshes = [];

  // Cards all face the same direction: toward camera
  // Camera is at (4.1, 2.1, 4.9), cards are at x~3.8, z~-0.5
  // So cards should face roughly toward +Z direction
  const CARD_ROTATION_Y = -Math.PI * 0.55; // face toward camera

  CARDS.forEach((card, i) => {
    const pos = positions[i];
    const geo = new THREE.PlaneGeometry(pos.w3, pos.h3);
    const mat = new THREE.MeshBasicMaterial({
      transparent: true, opacity: 0,
      side: THREE.DoubleSide, depthWrite: false,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(pos.x, HIDDEN_Y, pos.z);
    mesh.rotation.y = CARD_ROTATION_Y;
    cardGroup.add(mesh);

    const floatBase = pos.y;
    cardMeshes.push({ mesh, href: card.href, floatBase });

    makeCardTexture(card.label, card.sub, card.icon, ACCENT_HUES[i], pos.pw, pos.ph, (tex) => {
      mat.map = tex; mat.needsUpdate = true;
    });
  });

  // ── Show / hide ────────────────────────────────────────────────────
  function showCards() {
    cardMeshes.forEach(({ mesh, floatBase }, i) => {
      gsap.to(mesh.position, { y: floatBase, duration: 0.75, delay: i * 0.08, ease: 'back.out(1.4)' });
      gsap.to(mesh.material, { opacity: 1,   duration: 0.5,  delay: i * 0.08, ease: 'power2.out' });
    });
    gsap.to(nameOverlay, { opacity: 1, duration: 0.5, ease: 'power2.out' });
  }

  function hideCards() {
    cardMeshes.forEach(({ mesh }, i) => {
      gsap.to(mesh.position, { y: HIDDEN_Y, duration: 0.4, delay: i * 0.04, ease: 'power2.in' });
      gsap.to(mesh.material, { opacity: 0,  duration: 0.28, delay: i * 0.04 });
    });
    gsap.to(nameOverlay, { opacity: 0, duration: 0.3 });
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      iconsVisible = !iconsVisible;
      if (iconsVisible) showCards(); else hideCards();
    }
  });

  // ── Raycaster ──────────────────────────────────────────────────────
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  renderer.domElement.addEventListener('click', e => {
    if (!iconsVisible) return;
    mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(cardMeshes.map(c => c.mesh));
    if (hits.length) {
      const hit = cardMeshes.find(c => c.mesh === hits[0].object);
      if (hit?.href && hit.href !== '#') window.open(hit.href, '_blank');
    }
  });

  renderer.domElement.addEventListener('mousemove', e => {
    if (!iconsVisible) { renderer.domElement.style.cursor = 'default'; return; }
    mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(cardMeshes.map(c => c.mesh));
    renderer.domElement.style.cursor = hits.length ? 'pointer' : 'default';
  });

  // ── Gentle float ───────────────────────────────────────────────────
  const clock = new THREE.Clock();
  function floatCards(t) {
    if (!iconsVisible) return;
    cardMeshes.forEach(({ mesh, floatBase }, i) => {
      mesh.position.y = floatBase + Math.sin(t * 0.6 + i * 0.5) * 0.03;
    });
  }

  // ── Render loop ────────────────────────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    floatCards(clock.getElapsedTime());
    composer.render();
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });
}
init();
</script> </body> </html>
