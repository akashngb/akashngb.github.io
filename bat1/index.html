<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>bat1</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VignetteShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script> <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f5f5;overflow:hidden}#three-container{width:100vw;height:100vh}#debug{position:fixed;top:12px;right:12px;background:rgba(200,30,30,0.93);color:#fff;font:12px/1.6 monospace;padding:10px 14px;border-radius:6px;max-width:440px;word-break:break-all;z-index:9999;display:none;pointer-events:none}#icon-menu{position:fixed;left:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:18px;padding:20px 16px;z-index:100;pointer-events:none}.icon-item{display:flex;align-items:center;opacity:0;pointer-events:none}.icon-item.visible{pointer-events:auto}.icon-item img{width:36px;height:36px;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.22));transition:transform .18s ease}.icon-item:hover img{transform:scale(1.18)}#name-overlay{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);font-family:'Georgia',serif;font-size:clamp(1.4rem,3vw,2.2rem);letter-spacing:.18em;color:#1a1a1a;opacity:0;pointer-events:none;white-space:nowrap;text-shadow:0 2px 12px rgba(255,255,255,0.7);z-index:100}</style> </head> <body> <div id="three-container"></div> <div id="debug"></div> <div id="icon-menu"> <div class="icon-item"><img src="/assets/icons/mail.svg" alt="Mail"></div> <div class="icon-item"><img src="/assets/icons/github.svg" alt="GitHub"></div> <div class="icon-item"><img src="/assets/icons/linkedin.svg" alt="LinkedIn"></div> <div class="icon-item"><img src="/assets/icons/spotify.svg" alt="Spotify"></div> <div class="icon-item"><img src="/assets/icons/instagram.svg" alt="Instagram"></div> <div class="icon-item"><img src="/assets/icons/sun.svg" alt="Sun"></div> </div> <div id="name-overlay">Akash Nagabhirava</div> <script>
const debugEl = document.getElementById('debug');
function showError(msg) {
  debugEl.style.display = 'block';
  debugEl.innerHTML += msg + '<br>';
  console.error(msg);
}
window.addEventListener('error', e => showError('JS: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')'));
window.addEventListener('unhandledrejection', e => showError('Promise: ' + e.reason));

function init(){
  let iconsVisible = false;
  const iconItems = Array.from(document.querySelectorAll('.icon-item'));
  const nameOverlay = document.getElementById('name-overlay');

  function showIcons() {
    iconItems.forEach((el, i) => {
      el.classList.add('visible');
      gsap.fromTo(el,
        { x: -120, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, delay: i * 0.07, ease: 'back.out(2)' }
      );
    });
    gsap.to(nameOverlay, { opacity: 1, duration: 0.6, delay: 0.15, ease: 'power2.out' });
  }

  function hideIcons() {
    iconItems.forEach((el, i) => {
      gsap.to(el, {
        x: -120, opacity: 0, duration: 0.38, delay: i * 0.05, ease: 'power2.in',
        onComplete: () => el.classList.remove('visible')
      });
    });
    gsap.to(nameOverlay, { opacity: 0, duration: 0.35, ease: 'power2.in' });
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      iconsVisible = !iconsVisible;
      if (iconsVisible) showIcons(); else hideIcons();
    }
  });

  const container = document.getElementById('three-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf5f5f5);

  const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.1, 1000);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  const composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.25, 0.4, 0.85));
  composer.addPass(new THREE.ShaderPass(THREE.VignetteShader));
  composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));

  // HDRI
  new THREE.RGBELoader().load(
    '/assets/hdri/studio_small_09_1k.hdr',
    (hdr) => {
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromEquirectangular(hdr).texture;
      hdr.dispose();
      pmrem.dispose();
    },
    undefined,
    (err) => {
      const url = err && err.target ? (err.target.responseURL || err.target.src || 'unknown') : String(err);
      showError('HDRI load failed: ' + url);
    }
  );

  const key = new THREE.DirectionalLight(0xffffff, 2.5);
  key.position.set(6, 10, 6);
  key.castShadow = true;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.5);
  fill.position.set(-6, 4, 2);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 1);
  rim.position.set(0, 6, -8);
  scene.add(rim);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xcccccc, 0.25));

  const reflector = new THREE.Reflector(new THREE.PlaneGeometry(30, 30), {
    textureWidth: 1024, textureHeight: 1024,
    color: 0xbdbdbd, clipBias: 0.003, multisample: 4
  });
  reflector.rotation.x = -Math.PI / 2;
  reflector.position.y = 0;
  scene.add(reflector);

  const reflectionFade = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30),
    new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.35, metalness: 0, transparent: true, opacity: 0.25 })
  );
  reflectionFade.rotation.x = -Math.PI / 2;
  reflectionFade.position.y = 0.002;
  scene.add(reflectionFade);

  camera.position.set(3.2, 1.6, 3.8);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.25;
  controls.zoomSpeed = 3;
  controls.target.set(0, 0.8, 0);
  controls.update();

  // GLB
  new THREE.GLTFLoader().load(
    '/assets/models/batmobile_armored.glb',
    (gltf) => {
      const model = gltf.scene;
      model.rotation.y = Math.PI * 0.25;
      model.position.set(0, 0, 0);
      model.scale.set(1, 1, 1);

      model.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = o.receiveShadow = true;
        const mat = o.material;
        if (!mat) return;
        if (mat.transparent || mat.opacity < 0.95) {
          mat.transmission = 0.6; mat.roughness = 0.05; mat.envMapIntensity = 2.5; return;
        }
        if (mat.metalness > 0.6) {
          mat.envMapIntensity = 2; mat.roughness = Math.max(mat.roughness, 0.2); return;
        }
        mat.clearcoat = 0.6; mat.clearcoatRoughness = 0.08; mat.envMapIntensity = 1.6;
      });

      scene.add(model);
    },
    undefined,
    (err) => {
      const url = err && err.target ? (err.target.responseURL || err.target.src || 'unknown') : String(err);
      showError('GLB load failed: ' + url);
    }
  );

  // Music
  const audio = new Audio('/assets/music/wickedgames.mp3');
  audio.loop = true;
  audio.volume = 0.5;
  audio.play().catch(() => {
    const startMusic = () => {
      audio.play();
      window.removeEventListener('click', startMusic);
      window.removeEventListener('keydown', startMusic);
    };
    window.addEventListener('click', startMusic);
    window.addEventListener('keydown', startMusic);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    composer.render();
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });
}
init();
</script> </body> </html>
