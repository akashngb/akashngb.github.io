<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Low Poly Meadow</title> <style>*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif}#three-container{width:100vw;height:100vh}.overlay{position:absolute;top:20px;left:20px;color:#1f3d1f;font-size:18px}</style> </head> <body> <div class="overlay"> F = Toggle First Person </div> <div id="three-container"></div> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script>

const container = document.getElementById('three-container')

/* SCENE */
const scene = new THREE.Scene()
scene.background = new THREE.Color(0x87CEEB)

/* CAMERA */
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000)
camera.position.set(0, 5, 15)

/* RENDERER */
const renderer = new THREE.WebGLRenderer({antialias:true})
renderer.setSize(window.innerWidth, window.innerHeight)
renderer.shadowMap.enabled = true
container.appendChild(renderer.domElement)

/* LIGHT */
const sun = new THREE.DirectionalLight(0xffffff, 1.5)
sun.position.set(50, 100, 50)
sun.castShadow = true
scene.add(sun)

scene.add(new THREE.HemisphereLight(0xffffff,0x444444,0.6))

/* CIRCULAR MAP */
const MAP_RADIUS = 120

const groundGeo = new THREE.CircleGeometry(MAP_RADIUS, 64)
const groundMat = new THREE.MeshStandardMaterial({color:0x3cb043})
const ground = new THREE.Mesh(groundGeo, groundMat)
ground.rotation.x = -Math.PI/2
ground.receiveShadow = true
scene.add(ground)

/* BOUNDARY VISUAL RIM */
const rimGeo = new THREE.RingGeometry(MAP_RADIUS-1, MAP_RADIUS, 64)
const rimMat = new THREE.MeshBasicMaterial({color:0x2e7d32, side:THREE.DoubleSide})
const rim = new THREE.Mesh(rimGeo, rimMat)
rim.rotation.x = -Math.PI/2
rim.position.y = 0.05
scene.add(rim)

/* TREE LOADING */
const loader = new THREE.GLTFLoader()

const treeFiles = [
  "tree1.glb",
  "tree2.glb",
  "tree3.glb",
  "tree4.glb"
]

treeFiles.forEach(file=>{
  loader.load(`/assets/models/${file}`, gltf=>{
    for(let i=0;i<20;i++){
      const tree = gltf.scene.clone()

      const angle = Math.random()*Math.PI*2
      const radius = Math.random()*(MAP_RADIUS-10)

      tree.position.set(
        Math.cos(angle)*radius,
        0,
        Math.sin(angle)*radius
      )

      tree.scale.set(2,2,2)

      tree.traverse(o=>{
        if(o.isMesh){
          o.castShadow = true
          o.receiveShadow = true
        }
      })

      scene.add(tree)
    }
  })
})

/* CLOUDS */
loader.load(`/assets/models/clouds.glb`, gltf=>{
  gltf.scene.traverse(child=>{
    if(child.isMesh){
      const cloud = child.clone()

      const angle = Math.random()*Math.PI*2
      const radius = Math.random()*80

      cloud.position.set(
        Math.cos(angle)*radius,
        40 + Math.random()*10,
        Math.sin(angle)*radius
      )

      cloud.scale.set(10,10,10)
      scene.add(cloud)
    }
  })
})

/* CONTROLS */
const orbit = new THREE.OrbitControls(camera, renderer.domElement)
orbit.enablePan = false
orbit.maxPolarAngle = Math.PI/2 - 0.05
orbit.minDistance = 10
orbit.maxDistance = 150

let fpv = false
let yaw = 0
let pitch = 0
const keys = {}

/* FIRST PERSON TOGGLE */
window.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()] = true

  if(e.key.toLowerCase() === 'f'){
    fpv = !fpv
    orbit.enabled = !fpv

    if(fpv){
      document.body.requestPointerLock()
    } else {
      document.exitPointerLock()
    }
  }
})

window.addEventListener('keyup', e=>{
  keys[e.key.toLowerCase()] = false
})

/* MOUSE LOOK */
document.addEventListener('mousemove', e=>{
  if(!fpv) return

  yaw -= e.movementX * 0.002
  pitch -= e.movementY * 0.002
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch))

  camera.rotation.order = "YXZ"
  camera.rotation.y = yaw
  camera.rotation.x = pitch
})

/* FPV MOVEMENT */
function updateFPV(){
  const speed = 0.5
  const forward = new THREE.Vector3(
    Math.sin(yaw),
    0,
    Math.cos(yaw)
  )
  const right = new THREE.Vector3(
    Math.cos(yaw),
    0,
    -Math.sin(yaw)
  )

  if(keys['w']) camera.position.add(forward.clone().multiplyScalar(-speed))
  if(keys['s']) camera.position.add(forward.clone().multiplyScalar(speed))
  if(keys['a']) camera.position.add(right.clone().multiplyScalar(-speed))
  if(keys['d']) camera.position.add(right.clone().multiplyScalar(speed))

  // boundary clamp
  const dist = Math.sqrt(camera.position.x**2 + camera.position.z**2)
  if(dist > MAP_RADIUS-5){
    const angle = Math.atan2(camera.position.z, camera.position.x)
    camera.position.x = Math.cos(angle)*(MAP_RADIUS-5)
    camera.position.z = Math.sin(angle)*(MAP_RADIUS-5)
  }

  camera.position.y = 5
}

/* ANIMATION */
function animate(){
  requestAnimationFrame(animate)

  if(fpv) updateFPV()
  else orbit.update()

  renderer.render(scene, camera)
}
animate()

/* RESIZE */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(window.innerWidth, window.innerHeight)
})

</script> </body> </html>
