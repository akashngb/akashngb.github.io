<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Japanese Neon Mode</title> <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050510;overflow:hidden;font-family:Arial,sans-serif}#three-container{width:100vw;height:100vh}.overlay{position:absolute;top:40px;left:40px;color:#0ff;font-size:28px;letter-spacing:3px;text-shadow:0 0 15px #0ff;pointer-events:none}</style> </head> <body> <div class="overlay">東京ネオンモード</div> <div id="three-container"></div> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VignetteShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script> <script>
const container = document.getElementById('three-container')

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x050510)
scene.fog = new THREE.FogExp2(0x0a0a18, 0.05)

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000)
camera.position.set(0, 3, 10)

const renderer = new THREE.WebGLRenderer({ antialias:true })
renderer.setSize(window.innerWidth, window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2))
renderer.outputEncoding = THREE.sRGBEncoding
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.4
renderer.shadowMap.enabled = true
container.appendChild(renderer.domElement)

/* POST */
const composer = new THREE.EffectComposer(renderer)
composer.addPass(new THREE.RenderPass(scene, camera))
const bloom = new THREE.UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.1, 0.6, 0.25
)
composer.addPass(bloom)
composer.addPass(new THREE.ShaderPass(THREE.VignetteShader))
composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader))

/* LIGHTING */
const pink = new THREE.DirectionalLight(0xff00cc, 3)
pink.position.set(6,8,4)
scene.add(pink)

const cyan = new THREE.DirectionalLight(0x00ffff, 2.5)
cyan.position.set(-6,5,-6)
scene.add(cyan)

scene.add(new THREE.HemisphereLight(0x4400ff,0x000022,0.5))

/* GROUND */
const groundGeo = new THREE.PlaneGeometry(200,200)
const groundMat = new THREE.MeshStandardMaterial({
  color:0x0a0a18,
  roughness:0.4,
  metalness:0.6
})
const ground = new THREE.Mesh(groundGeo, groundMat)
ground.rotation.x = -Math.PI/2
ground.receiveShadow = true
scene.add(ground)

/* JAPANESE NEON SIGNS */
function createSign(text,x,z,color){
  const canvas = document.createElement('canvas')
  canvas.width=512
  canvas.height=256
  const ctx = canvas.getContext('2d')
  ctx.fillStyle="#000"
  ctx.fillRect(0,0,512,256)
  ctx.fillStyle=color
  ctx.font="bold 120px Arial"
  ctx.textAlign="center"
  ctx.fillText(text,256,160)

  const texture = new THREE.CanvasTexture(canvas)
  const mat = new THREE.MeshBasicMaterial({ map:texture })
  const geo = new THREE.PlaneGeometry(6,3)
  const mesh = new THREE.Mesh(geo,mat)
  mesh.position.set(x,5,z)
  scene.add(mesh)
}

createSign("東京", -15, -20, "#ff00cc")
createSign("未来", 15, -25, "#00ffff")
createSign("光", 0, -35, "#ff00cc")
createSign("速度", -25, -30, "#00ffff")

/* DRIVING SYSTEM */
let car
let velocity = 0
let direction = 0
const keys = {}

window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true)
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false)

new THREE.GLTFLoader().load('/assets/models/batmobile_armored.glb', gltf=>{
  car = gltf.scene
  car.traverse(o=>{
    if(o.isMesh){
      o.castShadow = o.receiveShadow = true
    }
  })
  scene.add(car)
})

/* CAMERA CONTROLS */
const controls = new THREE.OrbitControls(camera, renderer.domElement)
controls.enablePan = false
controls.maxPolarAngle = Math.PI/2 - 0.05
controls.minDistance = 4
controls.maxDistance = 25
controls.zoomToCursor = true

/* ANIMATE */
function animate(){
  requestAnimationFrame(animate)

  if(car){
    if(keys['w']) velocity += 0.01
    if(keys['s']) velocity -= 0.01
    velocity *= 0.95

    if(keys['a']) direction += 0.03
    if(keys['d']) direction -= 0.03

    car.rotation.y = direction
    car.position.x -= Math.sin(direction) * velocity
    car.position.z -= Math.cos(direction) * velocity

    controls.target.copy(car.position)
  }

  controls.update()
  composer.render()
}
animate()

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(window.innerWidth,window.innerHeight)
  composer.setSize(window.innerWidth,window.innerHeight)
})
</script> </body> </html>
