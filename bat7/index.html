<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <script>
function init(){
const container=document.getElementById('three-container')

/* =========================
   SCENE
========================= */
const scene=new THREE.Scene()
scene.background=new THREE.Color(0x050510)
scene.fog=new THREE.FogExp2(0x0a0a18,0.08)

/* =========================
   CAMERA
========================= */
const camera=new THREE.PerspectiveCamera(40,window.innerWidth/window.innerHeight,.1,1000)
camera.position.set(0,2.2,9)

/* =========================
   RENDERER
========================= */
const renderer=new THREE.WebGLRenderer({antialias:true})
renderer.setSize(window.innerWidth,window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2))
renderer.outputEncoding=THREE.sRGBEncoding
renderer.toneMapping=THREE.ACESFilmicToneMapping
renderer.toneMappingExposure=1.5
renderer.shadowMap.enabled=true
container.appendChild(renderer.domElement)

/* =========================
   POST PROCESSING
========================= */
const composer=new THREE.EffectComposer(renderer)
composer.addPass(new THREE.RenderPass(scene,camera))

const bloom=new THREE.UnrealBloomPass(
new THREE.Vector2(window.innerWidth,window.innerHeight),
1.2,   // strength
0.6,
0.2
)
composer.addPass(bloom)

composer.addPass(new THREE.ShaderPass(THREE.VignetteShader))
composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader))

/* =========================
   CYBERPUNK LIGHTING
========================= */

// Pink key light
const pink=new THREE.DirectionalLight(0xff00cc,3)
pink.position.set(5,6,4)
pink.castShadow=true
scene.add(pink)

// Cyan rim
const cyan=new THREE.DirectionalLight(0x00ffff,2.5)
cyan.position.set(-6,4,-6)
scene.add(cyan)

// Soft purple fill
scene.add(new THREE.HemisphereLight(0x4400ff,0x000022,0.4))

/* =========================
   WET NEON FLOOR
========================= */
const reflector=new THREE.Reflector(new THREE.PlaneGeometry(40,40),{
textureWidth:1024,
textureHeight:1024,
color:0x111122
})
reflector.rotation.x=-Math.PI/2
reflector.position.y=0
scene.add(reflector)

const shadowFloor=new THREE.Mesh(
new THREE.PlaneGeometry(40,40),
new THREE.ShadowMaterial({opacity:0.2})
)
shadowFloor.rotation.x=-Math.PI/2
shadowFloor.position.y=0.001
shadowFloor.receiveShadow=true
scene.add(shadowFloor)

/* =========================
   DISTANT LIGHT TOWERS
========================= */
for(let i=0;i<30;i++){
  const geo=new THREE.BoxGeometry(.1,Math.random()*6+2,.1)
  const mat=new THREE.MeshBasicMaterial({
    color:Math.random()>.5?0xff00cc:0x00ffff
  })
  const tower=new THREE.Mesh(geo,mat)
  tower.position.set(
    (Math.random()-.5)*30,
    geo.parameters.height/2,
    -Math.random()*20-5
  )
  scene.add(tower)
}

/* =========================
   RAIN SYSTEM
========================= */
const rainGeo=new THREE.BufferGeometry()
const rainCount=6000
const rainPositions=new Float32Array(rainCount*3)

for(let i=0;i<rainCount;i++){
  rainPositions[i*3]=(Math.random()-.5)*40
  rainPositions[i*3+1]=Math.random()*20
  rainPositions[i*3+2]=(Math.random()-.5)*40
}

rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPositions,3))

const rainMat=new THREE.PointsMaterial({
  color:0x88ccff,
  size:0.05,
  transparent:true,
  opacity:0.7
})

const rain=new THREE.Points(rainGeo,rainMat)
scene.add(rain)

/* =========================
   CONTROLS
========================= */
const controls=new THREE.OrbitControls(camera,renderer.domElement)
controls.enableDamping=true
controls.autoRotate=true
controls.autoRotateSpeed=0.35
controls.target.set(0,0.6,0)

/* =========================
   LOAD MODEL
========================= */
new THREE.GLTFLoader().load('/assets/models/batmobile_armored.glb',gltf=>{
  const model=gltf.scene

  model.traverse(o=>{
    if(!o.isMesh) return
    o.castShadow=o.receiveShadow=true
    const mat=o.material
    if(!mat) return

    if(mat.transparent || mat.opacity < 0.95){
      mat.transmission=0.8
      mat.roughness=0.05
      mat.envMapIntensity=3
      return
    }

    if(mat.metalness > 0.6){
      mat.roughness=0.25
      mat.envMapIntensity=2.5
      return
    }

    mat.clearcoat=1
    mat.clearcoatRoughness=0.03
    mat.envMapIntensity=2
  })

  scene.add(model)
})

/* =========================
   ANIMATION
========================= */
function animate(){
requestAnimationFrame(animate)

controls.update()

// Animate rain
const pos=rain.geometry.attributes.position.array
for(let i=0;i<rainCount;i++){
  pos[i*3+1]-=0.3
  if(pos[i*3+1]<0) pos[i*3+1]=20
}
rain.geometry.attributes.position.needsUpdate=true

composer.render()
}
animate()

window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight
camera.updateProjectionMatrix()
renderer.setSize(window.innerWidth,window.innerHeight)
composer.setSize(window.innerWidth,window.innerHeight)
})
}
init()
</script> </head></html>
