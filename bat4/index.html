<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Cinematic Batmobile</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lights/RectAreaLightUniformsLib.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/DepthLimitedBlurShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/BokehPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VignetteShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script> <style>body{margin:0;background:#f5f5f5;overflow:hidden}#three-container{width:100vw;height:100vh}</style> </head> <body> <div id="three-container"></div> <script>
const container=document.getElementById('three-container');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf5f5f5);

const camera=new THREE.PerspectiveCamera(28,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,2,8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
renderer.shadowMap.enabled=true;
renderer.physicallyCorrectLights=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// POST PROCESSING
const composer=new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene,camera));

const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),0.2,0.4,0.9);
composer.addPass(bloom);

const bokeh=new THREE.BokehPass(scene,camera,{focus:6,aperture:0.00008,maxblur:0.01});
composer.addPass(bokeh);

const vignette=new THREE.ShaderPass(THREE.VignetteShader);
vignette.uniforms.offset.value=1.1;
vignette.uniforms.darkness.value=1.2;
composer.addPass(vignette);
composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));

// HDRI
new THREE.RGBELoader().load('/assets/hdri/studio_small_09_4k.hdr',hdr=>{
 const pmrem=new THREE.PMREMGenerator(renderer);
 scene.environment=pmrem.fromEquirectangular(hdr).texture;
 hdr.dispose();pmrem.dispose();
});

THREE.RectAreaLightUniformsLib.init();

const key=new THREE.DirectionalLight(0xffffff,2.5);
key.position.set(6,10,6);
key.castShadow=true;
scene.add(key);

const fill=new THREE.DirectionalLight(0xffffff,0.5);
fill.position.set(-6,4,2);
scene.add(fill);

const panel=new THREE.RectAreaLight(0xffffff,8,6,3);
panel.position.set(0,4,6);
panel.lookAt(0,0,0);
scene.add(panel);

scene.add(new THREE.HemisphereLight(0xffffff,0xcccccc,0.25));

// REFLECTIVE FLOOR
const reflector=new THREE.Reflector(new THREE.PlaneGeometry(30,30),{textureWidth:1024,textureHeight:1024,color:0x999999});
reflector.rotation.x=-Math.PI/2;
scene.add(reflector);

const blurFloor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:0.6,transparent:true,opacity:0.4}));
blurFloor.rotation.x=-Math.PI/2;
blurFloor.position.y=0.002;
scene.add(blurFloor);

// CONTROLS
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.09;
controls.autoRotate=true;
controls.autoRotateSpeed=0.12;
controls.target.set(0,0.6,0);

// LOAD MODEL
new THREE.GLTFLoader().load('/assets/models/batmobile_armored.glb',gltf=>{
 const model=gltf.scene;

 model.traverse(o=>{
  if(!o.isMesh) return;
  o.castShadow=o.receiveShadow=true;
  const mat=o.material;
  if(!mat) return;

  if(mat.transparent||mat.opacity<0.95){
    mat.transmission=0.6;
    mat.roughness=0.05;
    mat.envMapIntensity=2.5;
    return;
  }

  if(mat.metalness>0.6){
    mat.envMapIntensity=2;
    mat.roughness=Math.max(mat.roughness,0.2);
    return;
  }

  mat.clearcoat=0.6;
  mat.clearcoatRoughness=0.08;
  mat.envMapIntensity=1.6;
 });

 const box=new THREE.Box3().setFromObject(model);
 const center=box.getCenter(new THREE.Vector3());
 model.position.sub(center);
 const newBox=new THREE.Box3().setFromObject(model);
 model.position.y-=newBox.min.y;

 scene.add(model);
});

function animate(){requestAnimationFrame(animate);controls.update();composer.render();}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
 composer.setSize(window.innerWidth,window.innerHeight);
});
</script> </body> </html>
