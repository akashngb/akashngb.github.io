<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script> <style>body{margin:0;overflow:hidden;background:#f5f5f5}</style> </head> <body> <script>

// ================= PATH FIX FOR JEKYLL =================
function PATH(p){
 if(p.startsWith("/")) return p;
 return "/" + p;
}

// ================= BASIC SCENE =================
const scene=new THREE.Scene()
scene.fog=new THREE.Fog(0xf5f5f5,10,40)

const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,1000)
camera.position.set(0,2.5,9)

const renderer=new THREE.WebGLRenderer({antialias:true})
renderer.setSize(innerWidth,innerHeight)
renderer.outputEncoding=THREE.sRGBEncoding
renderer.toneMapping=THREE.ACESFilmicToneMapping
renderer.toneMappingExposure=1.1
renderer.shadowMap.enabled=true
document.body.appendChild(renderer.domElement)

const controls=new THREE.OrbitControls(camera,renderer.domElement)
controls.enableDamping=true
controls.autoRotate=true
controls.autoRotateSpeed=.3
controls.target.set(0,.6,0)

// ================= HDRI =================
new THREE.RGBELoader().load(PATH("assets/hdri/studio_small_09_4k.hdr"),hdr=>{
 const pmrem=new THREE.PMREMGenerator(renderer)
 scene.environment=pmrem.fromEquirectangular(hdr).texture
 hdr.dispose();pmrem.dispose()
})

// ================= LIGHTS =================
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,.3))

const key=new THREE.DirectionalLight(0xffffff,2.5)
key.position.set(6,10,6)
key.castShadow=true
scene.add(key)

const rim=new THREE.DirectionalLight(0xffffff,1)
rim.position.set(-6,4,-6)
scene.add(rim)

// ================= FLOOR =================
const floor=new THREE.Reflector(new THREE.PlaneGeometry(40,40),{
 textureWidth:1024,
 textureHeight:1024,
 color:0xaaaaaa
})
floor.rotation.x=-Math.PI/2
scene.add(floor)

// ================= BATMOBILE =================
let carModel
new THREE.GLTFLoader().load(PATH("assets/models/batmobile_armored.glb"),g=>{
 carModel=g.scene

 carModel.traverse(o=>{
  if(!o.isMesh) return
  const m=o.material
  if(!m) return

  // DO NOT replace material → keep wheels/windows correct

  if(m.transparent || m.opacity<0.95){
   m.envMapIntensity=2.5
   m.roughness=Math.min(m.roughness??.1,.08)
   return
  }

  if(m.metalness>0.6){
   m.envMapIntensity=2
   m.roughness=Math.max(m.roughness??.2,.25)
   return
  }

  // PAINT → keep black
  if(m.color && m.color.getHex()>0x888888){
    m.color.multiplyScalar(.2) // keep dark
  }

  m.clearcoat=.6
  m.clearcoatRoughness=.08
  m.envMapIntensity=1.5
 })

 scene.add(carModel)
})

// ================= ICONS =================
const ICONS=[
 {file:"instagram.glb",url:"https://www.instagram.com/akash30n/"},
 {file:"linkedin.glb",url:"https://www.linkedin.com/in/akash-nagabhirava-164155327/"},
 {file:"spotify.glb",url:"https://open.spotify.com/user/obxzyzxv5yuu7qo1u3qaxvsqm"},
 {file:"github.glb",url:"https://github.com/akashngb/akashngb.github.io"},
 {file:"mail.glb",url:"mailto:akash30n@gmail.com"},
 {file:"sun.glb",url:"THEME"}
]

let iconMeshes=[]
const loader=new THREE.GLTFLoader()

ICONS.forEach((i,idx)=>{
 loader.load(PATH("assets/icons/"+i.file),g=>{
  let m=g.scene
  m.visible=false
  m.userData=i

  // normalize size
  const box=new THREE.Box3().setFromObject(m)
  const size=new THREE.Vector3()
  box.getSize(size)
  const scale=1.2/Math.max(size.x,size.y,size.z)
  m.scale.setScalar(scale)

  scene.add(m)
  iconMeshes.push(m)
 })
})

// ================= ICON ANIMATION =================
let deployed=false
document.addEventListener("keydown",e=>{
 if(e.code!=="Space")return
 deployed=!deployed
})

function updateIcons(){
 const r=4
 iconMeshes.forEach((m,i)=>{
  if(!m)return
  m.visible=true

  const angle=i*Math.PI*2/iconMeshes.length
  const target=deployed?
   new THREE.Vector3(Math.cos(angle)*r,1+(i%2)*.6,Math.sin(angle)*r):
   new THREE.Vector3(0,0,0)

  m.position.lerp(target,.08)
 })
}

// ================= HOVER + CLICK =================
const ray=new THREE.Raycaster()
const mouse=new THREE.Vector2()

addEventListener("mousemove",e=>{
 mouse.x=e.clientX/innerWidth*2-1
 mouse.y=-(e.clientY/innerHeight*2-1)
})

addEventListener("click",()=>{
 ray.setFromCamera(mouse,camera)
 const hits=ray.intersectObjects(iconMeshes,true)
 if(!hits.length)return
 const obj=hits[0].object.parent
 const url=obj.userData.url
 if(url==="THEME"){toggleTheme();return}
 window.open(url,"_blank")
})

function hoverIcons(){
 ray.setFromCamera(mouse,camera)
 const hits=ray.intersectObjects(iconMeshes,true)

 iconMeshes.forEach(m=>m.scale.lerp(new THREE.Vector3(1,1,1),.1))

 if(hits.length){
  hits[0].object.parent.scale.lerp(new THREE.Vector3(1.3,1.3,1.3),.2)
 }
}

// ================= THEME =================
let dark=false
function toggleTheme(){
 dark=!dark
 scene.background=new THREE.Color(dark?0x000000:0xf5f5f5)
 scene.fog.color.set(dark?0x000000:0xf5f5f5)

 if(carModel){
  carModel.traverse(o=>{
   if(o.isMesh){
    o.material.wireframe=dark
   }
  })
 }
}

// ================= LOOP =================
function animate(){
 requestAnimationFrame(animate)
 updateIcons()
 hoverIcons()
 controls.update()
 renderer.render(scene,camera)
}
animate()

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight
 camera.updateProjectionMatrix()
 renderer.setSize(innerWidth,innerHeight)
})

</script> </body> </html>
