<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>bat6</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script> <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f5f5;overflow:hidden}#three-container{width:100vw;height:100vh}</style> </head> <body> <div id="three-container"></div> <script>
function init(){

let carModel=null
let iconsVisible=false

const container=document.getElementById('three-container')
const scene=new THREE.Scene()
scene.background=new THREE.Color(0xf5f5f5)

const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,1000)
camera.position.set(4.1,2.1,4.9)

const renderer=new THREE.WebGLRenderer({antialias:true})
renderer.setSize(innerWidth,innerHeight)
renderer.outputEncoding=THREE.sRGBEncoding
container.appendChild(renderer.domElement)

const controls=new THREE.OrbitControls(camera,renderer.domElement)
controls.enableDamping=true
controls.autoRotate=true
controls.autoRotateSpeed=0.25
controls.target.set(0,0.8,0)

scene.add(new THREE.HemisphereLight(0xffffff,0xcccccc,0.3))
scene.add(new THREE.DirectionalLight(0xffffff,2))

/* =====================
SAFE HDRI LOAD
===================== */
new THREE.RGBELoader().load(
'/assets/hdri/studio_small_09_1k.hdr',
hdr=>{
const pmrem=new THREE.PMREMGenerator(renderer)
scene.environment=pmrem.fromEquirectangular(hdr).texture
},
undefined,
()=>console.warn("HDRI not found, skipping")
)

/* =====================
CAR MODEL (UNCHANGED)
===================== */
new THREE.GLTFLoader().load('/assets/models/batmobile_armored.glb',gltf=>{
carModel=gltf.scene
carModel.rotation.y=Math.PI*0.75-Math.PI/6
scene.add(carModel)
})

/* =====================
SVG ICONS
===================== */
const iconGroup=new THREE.Group()
scene.add(iconGroup)

const texLoader=new THREE.TextureLoader()

const names=[
"mail","github","linkedin",
"spotify","instagram","sun"
]

names.forEach(n=>{
const tex=texLoader.load(`/assets/icons/${n}.svg`)
const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}))
sprite.scale.set(0.9,0.9,0.9)
sprite.visible=false
iconGroup.add(sprite)
})

function getCarCenter(){
if(!carModel) return new THREE.Vector3()
const box=new THREE.Box3().setFromObject(carModel)
const center=new THREE.Vector3()
box.getCenter(center)
center.y+=0.7
return center
}

function positionIcons(show){

if(!carModel) return

const center=getCarCenter()
const r=3
const total=iconGroup.children.length

iconGroup.children.forEach((icon,i)=>{

const angle=i*(Math.PI*2/total)

const x=center.x+Math.cos(angle)*r
const z=center.z+Math.sin(angle)*r
const y=center.y+1.2

icon.visible=true

if(show){

icon.scale.set(0.01,0.01,0.01)
icon.position.copy(center)

gsap.to(icon.scale,{x:1,y:1,z:1,duration:0.55,ease:"back.out(2)"})
gsap.to(icon.position,{x,y,z,duration:0.55,ease:"power3.out"})

}else{

gsap.to(icon.scale,{x:0.01,y:0.01,z:0.01,duration:0.45,ease:"power2.in"})
gsap.to(icon.position,{
x:center.x,y:center.y,z:center.z,
duration:0.45,
ease:"power2.in",
onComplete:()=>icon.visible=false
})

}

})

}

/* TOGGLE */
window.addEventListener('keydown',e=>{
if(e.code==="Space"){
iconsVisible=!iconsVisible
positionIcons(iconsVisible)
}
})

function animate(){
requestAnimationFrame(animate)
controls.update()
renderer.render(scene,camera)
}
animate()

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight
camera.updateProjectionMatrix()
renderer.setSize(innerWidth,innerHeight)
})

}
init()
</script> </body> </html>
