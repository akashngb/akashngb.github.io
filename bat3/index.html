<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>bat3</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f5f5;overflow:hidden}#three-container{width:100vw;height:100vh}</style> </head> <body> <div id="three-container"></div> <script>

function initThreeScene(){

const container=document.getElementById("three-container")

// SCENE
const scene=new THREE.Scene()
scene.background=new THREE.Color(0xf5f5f5)

// CAMERA
const camera=new THREE.PerspectiveCamera(35,window.innerWidth/window.innerHeight,.1,1000)
camera.position.set(0,2,8)

// RENDERER
const renderer=new THREE.WebGLRenderer({antialias:true})
renderer.setSize(window.innerWidth,window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2))
renderer.outputEncoding=THREE.sRGBEncoding
renderer.toneMapping=THREE.ACESFilmicToneMapping
renderer.toneMappingExposure=1.0
renderer.shadowMap.enabled=true
renderer.shadowMap.type=THREE.PCFSoftShadowMap
container.appendChild(renderer.domElement)


// ───────────────── HDR (SUBTLE, NOT METALLIC) ─────────────────

new THREE.RGBELoader().load('/assets/hdri/tokyo_bigsight_1k.hdr',(hdr)=>{
const pmrem=new THREE.PMREMGenerator(renderer)
const env=pmrem.fromEquirectangular(hdr).texture
scene.environment=env
hdr.dispose()
pmrem.dispose()
})


// ───────────────── STUDIO LIGHTING ─────────────────

// KEY LIGHT
const key=new THREE.DirectionalLight(0xffffff,1.6)
key.position.set(6,10,6)
key.castShadow=true
key.shadow.mapSize.set(2048,2048)
key.shadow.radius=4
key.shadow.bias=-0.0005
scene.add(key)

// FILL
const fill=new THREE.DirectionalLight(0xffffff,0.5)
fill.position.set(-6,4,2)
scene.add(fill)

// RIM
const rim=new THREE.DirectionalLight(0xffffff,0.4)
rim.position.set(0,5,-8)
scene.add(rim)

// HEMI FOR SOFT DEPTH
const hemi=new THREE.HemisphereLight(0xffffff,0xaaaaaa,0.35)
scene.add(hemi)


// ───────────────── GROUND ─────────────────

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(50,50),
new THREE.ShadowMaterial({opacity:0.22})
)
ground.rotation.x=-Math.PI/2
ground.position.y=-1
ground.receiveShadow=true
scene.add(ground)


// ───────────────── CONTROLS ─────────────────

const controls=new THREE.OrbitControls(camera,renderer.domElement)
controls.enableDamping=true
controls.dampingFactor=0.07
controls.autoRotate=true
controls.autoRotateSpeed=0.5
controls.minDistance=4
controls.maxDistance=20
controls.target.set(0,0,0)


// ───────────────── MODEL ─────────────────

let model

new THREE.GLTFLoader().load(
'/assets/models/batmobile_armored.glb',
(gltf)=>{

model=gltf.scene

model.traverse((child)=>{
if(child.isMesh){
child.castShadow=true
child.receiveShadow=true

if(child.material){

// MATTE BUT NOT DEAD
child.material.metalness=0
child.material.roughness=0.85
child.material.envMapIntensity=0.35

if(child.material.aoMap){
child.material.aoMapIntensity=1.2
}

child.material.needsUpdate=true
}
}
})

const box=new THREE.Box3().setFromObject(model)
const center=box.getCenter(new THREE.Vector3())
model.position.sub(center)

const size=box.getSize(new THREE.Vector3()).length()
const scale=5/size
model.scale.setScalar(scale)

scene.add(model)

},
undefined,
(e)=>console.error(e)
)


// ───────────────── LOOP ─────────────────

function animate(){
requestAnimationFrame(animate)
controls.update()
renderer.render(scene,camera)
}
animate()

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight
camera.updateProjectionMatrix()
renderer.setSize(window.innerWidth,window.innerHeight)
})

}

initThreeScene()

</script> </body> </html>
