<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><body> <div id="viewer" style="width:100%; height:100vh;"></div> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.160/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.160/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.160/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.160/examples/js/postprocessing/EffectComposer.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.160/examples/js/postprocessing/RenderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.160/examples/js/postprocessing/UnrealBloomPass.js"></script> <script>
window.onload = function() {
  const container = document.getElementById("viewer");

  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050505);

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  container.appendChild(renderer.domElement);

  // Camera
  const camera = new THREE.PerspectiveCamera(30, container.clientWidth/container.clientHeight, 0.1, 1000);
  camera.position.set(4, 1.6, 5);

  // Controls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 0.8, 0);
  controls.minDistance = 2;
  controls.maxDistance = 10;

  // HDR Environment
  new THREE.RGBELoader().setDataType(THREE.UnsignedByteType)
  .load("https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_03_1k.hdr", function(texture){
    texture.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = texture;
  });

  // Light
  const light = new THREE.DirectionalLight(0xffffff, 1.2);
  light.position.set(5,5,5);
  scene.add(light);

  // GLTF Model
  const loader = new THREE.GLTFLoader();
  loader.load("batmobile_armored.glb", function(gltf){
    const model = gltf.scene;
    scene.add(model);
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
  });

  // Postprocessing
  const composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(container.clientWidth, container.clientHeight), 0.25, 0.4, 0.85);
  composer.addPass(bloom);

  // Resize
  window.addEventListener("resize", ()=>{
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
    composer.setSize(container.clientWidth, container.clientHeight);
  });

  // Animate
  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    composer.render();
  }
  animate();
};
</script> </body></html>
