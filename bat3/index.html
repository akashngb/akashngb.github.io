<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>bat3</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VignetteShader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script> <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f5f5;overflow:hidden}#three-container{width:100vw;height:100vh}</style> </head> <body> <div id="three-container"></div> <script>
function init(){
const container=document.getElementById('three-container')

// SCENE
const scene=new THREE.Scene()
scene.background=new THREE.Color(0xf5f5f5)

// CAMERA
const camera=new THREE.PerspectiveCamera(35,window.innerWidth/window.innerHeight,.1,1000)
camera.position.set(0,2,8)

// RENDERER
const renderer=new THREE.WebGLRenderer({antialias:true})
renderer.setSize(window.innerWidth,window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2))
renderer.outputEncoding=THREE.sRGBEncoding
renderer.toneMapping=THREE.ACESFilmicToneMapping
renderer.toneMappingExposure=1.2
renderer.shadowMap.enabled=true
renderer.shadowMap.type=THREE.PCFSoftShadowMap
container.appendChild(renderer.domElement)

// POST PROCESSING
const composer=new THREE.EffectComposer(renderer)
composer.addPass(new THREE.RenderPass(scene,camera))
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),0.25,0.4,0.85)
composer.addPass(bloom)
const vignette=new THREE.ShaderPass(THREE.VignetteShader)
vignette.uniforms['darkness'].value=1.2
composer.addPass(vignette)
composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader))

// HDRI
new THREE.RGBELoader().load('/assets/hdri/studio_small_09_1k.hdr',(hdr)=>{
const pmrem=new THREE.PMREMGenerator(renderer)
scene.environment=pmrem.fromEquirectangular(hdr).texture
hdr.dispose();pmrem.dispose()
})

// LIGHTS
const key=new THREE.DirectionalLight(0xffffff,2.5)
key.position.set(6,10,6)
key.castShadow=true
key.shadow.mapSize.set(2048,2048)
scene.add(key)
scene.add(new THREE.DirectionalLight(0xffffff,0.5).position.set(-6,4,2))
scene.add(new THREE.DirectionalLight(0xffffff,1).position.set(0,6,-8))
scene.add(new THREE.HemisphereLight(0xffffff,0xcccccc,0.25))

// FLOOR (FIXED POSITION)
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.ShadowMaterial({opacity:0.1}))
floor.rotation.x=-Math.PI/2
floor.receiveShadow=true
scene.add(floor)

// CONTROLS
const controls=new THREE.OrbitControls(camera,renderer.domElement)
controls.enableDamping=true
controls.dampingFactor=0.08
controls.zoomSpeed=3.5
controls.enableZoom=true
controls.minDistance=0.1
controls.maxDistance=1000
controls.rotateSpeed=0.8
controls.target.set(0,0.6,0)

// EXTRA ZOOM INERTIA
let zoomVel=0
window.addEventListener('wheel',e=>zoomVel+=e.deltaY*0.0005)

// MODEL
new THREE.GLTFLoader().load('/assets/models/batmobile_armored.glb',gltf=>{
const model=gltf.scene
const subtleNormal=new THREE.TextureLoader().load('/assets/textures/subtle_normal.jpg')
subtleNormal.wrapS=subtleNormal.wrapT=THREE.RepeatWrapping
subtleNormal.repeat.set(2,2)

model.traverse(o=>{
if(o.isMesh){
o.castShadow=o.receiveShadow=true
const name=o.name.toLowerCase()

// WINDOWS
if(name.includes('glass')||name.includes('window')){
o.material=new THREE.MeshPhysicalMaterial({
color:0x111111,
roughness:0,
metalness:0,
transmission:0.1,
reflectivity:1,
clearcoat:1,
transparent:true,
envMapIntensity:2
})
return
}

// WHEELS GOLD
if(name.includes('wheel')||name.includes('rim')){
o.material=new THREE.MeshPhysicalMaterial({
color:0xD4AF37,
metalness:1,
roughness:0.25,
clearcoat:0.2
})
return
}

// BODY BLACK
o.material=new THREE.MeshPhysicalMaterial({
color:0x000000,
roughness:0.28,
metalness:0,
specularIntensity:0.5,
clearcoat:0.3,
clearcoatRoughness:0.1,
normalMap:subtleNormal,
normalScale:new THREE.Vector2(0.05,0.05),
envMapIntensity:1.4
})
}
})

// CENTER + FLOOR FIX
const box=new THREE.Box3().setFromObject(model)
const center=box.getCenter(new THREE.Vector3())
model.position.sub(center)
const minY=new THREE.Box3().setFromObject(model).min.y
model.position.y-=minY
floor.position.y=0
scene.add(model)
})

// LOOP
function animate(){
requestAnimationFrame(animate)
controls.update()
if(Math.abs(zoomVel)>0.0001){
camera.position.addScaledVector(camera.getWorldDirection(new THREE.Vector3()),zoomVel)
zoomVel*=0.85
}
composer.render()
}
animate()

window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight
camera.updateProjectionMatrix()
renderer.setSize(window.innerWidth,window.innerHeight)
composer.setSize(window.innerWidth,window.innerHeight)
})
}
init()
</script> </body> </html>
