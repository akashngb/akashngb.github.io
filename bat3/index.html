<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>bat3</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script> <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:#fff;overflow:hidden}#three-container{width:100vw;height:100vh}#name-header{position:fixed;top:2rem;left:2rem;z-index:100;font-size:2.5rem;font-weight:600;color:#000;border-right:2px solid currentColor;padding-right:.5rem}#subtitle{position:fixed;top:5rem;left:2rem;z-index:100;font-family:ui-monospace,monospace;color:#666;opacity:0;transition:opacity .6s}#subtitle.visible{opacity:1}#theme-toggle{position:fixed;top:1rem;right:1rem;z-index:9999;width:50px;height:50px;border-radius:50%;cursor:pointer;font-size:1.5rem}body.dark{background:#111}body.dark #name-header,body.dark #subtitle{color:#fff}</style> </head> <body> <div id="three-container"></div> <h1 id="name-header"></h1> <p id="subtitle"><span id="live-age"></span> feet</p> <button id="theme-toggle">🌙</button> <script>

const birthDate=new Date("2006-12-30T02:00:00.700Z");
function computeAge(){return((new Date()-birthDate)/(365.2422*24*60*60*1000)).toFixed(10)}
function updateAge(){document.getElementById("live-age").textContent=computeAge()}

function initThreeScene(){

const container=document.getElementById("three-container")
const scene=new THREE.Scene()
scene.background=new THREE.Color(0xffffff)

// CAMERA
const camera=new THREE.PerspectiveCamera(35,window.innerWidth/window.innerHeight,.1,1000)
camera.position.set(0,2,8)

// RENDERER
const renderer=new THREE.WebGLRenderer({antialias:true})
renderer.setSize(window.innerWidth,window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2))
renderer.outputEncoding=THREE.sRGBEncoding
renderer.toneMapping=THREE.ACESFilmicToneMapping
renderer.toneMappingExposure=1.0
renderer.physicallyCorrectLights=false
renderer.shadowMap.enabled=true
renderer.shadowMap.type=THREE.PCFSoftShadowMap
container.appendChild(renderer.domElement)

// LIGHTING — SOFT STUDIO SETUP

// Key light
const key=new THREE.DirectionalLight(0xffffff,1.8)
key.position.set(6,8,5)
key.castShadow=true
key.shadow.mapSize.set(2048,2048)
scene.add(key)

// Fill light
const fill=new THREE.DirectionalLight(0xffffff,0.6)
fill.position.set(-6,4,3)
scene.add(fill)

// Rim light
const rim=new THREE.DirectionalLight(0xffffff,0.5)
rim.position.set(0,6,-8)
scene.add(rim)

// Soft ambient
scene.add(new THREE.AmbientLight(0xffffff,0.35))

// GROUND SHADOW
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(50,50),
new THREE.ShadowMaterial({opacity:.18})
)
ground.rotation.x=-Math.PI/2
ground.position.y=-1
ground.receiveShadow=true
scene.add(ground)

// CONTROLS
const controls=new THREE.OrbitControls(camera,renderer.domElement)
controls.enableDamping=true
controls.dampingFactor=.06
controls.minDistance=3
controls.maxDistance=20
controls.target.set(0,0,0)

// MODEL
let model
new THREE.GLTFLoader().load(
'/assets/models/batmobile_armored.glb',
(gltf)=>{
model=gltf.scene

model.traverse((child)=>{
if(child.isMesh){
child.castShadow=true
child.receiveShadow=true

// FORCE MATTE LOOK
if(child.material){
child.material.metalness=0
child.material.roughness=0.9
child.material.envMapIntensity=0
child.material.needsUpdate=true
}
}
})

const box=new THREE.Box3().setFromObject(model)
const center=box.getCenter(new THREE.Vector3())
model.position.sub(center)

const size=box.getSize(new THREE.Vector3()).length()
const scale=5/size
model.scale.setScalar(scale)

scene.add(model)
},
undefined,
(e)=>console.error(e)
)

// LOOP
function animate(){
requestAnimationFrame(animate)
controls.update()
renderer.render(scene,camera)
}
animate()

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight
camera.updateProjectionMatrix()
renderer.setSize(window.innerWidth,window.innerHeight)
})

}


// THEME
const toggle=document.getElementById("theme-toggle")
toggle.onclick=()=>{
document.body.classList.toggle("dark")
toggle.textContent=document.body.classList.contains("dark")?"☀️":"🌙"
}

updateAge()
setInterval(updateAge,100)
initThreeScene()

</script> </body> </html>
