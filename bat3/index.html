<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><body> <div id="viewer" style="width:100%; height:100vh;"></div> <script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js";
import { RGBELoader } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/RGBELoader.js";

import { EffectComposer } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/EffectComposer.js";
import { RenderPass } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/UnrealBloomPass.js";
import { SSAOPass } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/SSAOPass.js";

const container = document.getElementById("viewer");

const scene = new THREE.Scene();
scene.background = new THREE.Color("#050505");

// renderer
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);

renderer.physicallyCorrectLights = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

container.appendChild(renderer.domElement);

// camera (cinematic)
const camera = new THREE.PerspectiveCamera(
  30, // cinematic FOV
  container.clientWidth/container.clientHeight,
  0.1,
  1000
);

camera.position.set(4, 1.6, 5);

// controls (sketchfab feel)
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

controls.target.set(0, 0.8, 0);
controls.minDistance = 2;
controls.maxDistance = 10;
controls.rotateSpeed = 0.8;
controls.zoomSpeed = 0.6;

// HDR ENVIRONMENT (THIS IS 80% OF THE LOOK)
new RGBELoader()
  .setPath("https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/")
  .load("studio_small_03_1k.hdr", function (hdr) {

    hdr.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = hdr;

  });

// subtle fill light
const light = new THREE.DirectionalLight(0xffffff, 1.2);
light.position.set(5,5,5);
scene.add(light);

// LOAD YOUR MODEL HERE
const loader = new GLTFLoader();
loader.load(
  "batmobile_armored.glb",
  (gltf)=>{
    const model = gltf.scene;
    scene.add(model);

    // center model automatically
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);

    controls.target.set(0,0.8,0);
  }
);

// POST PROCESSING (sketchfab cinematic)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

// SSAO depth
const ssao = new SSAOPass(scene, camera, container.clientWidth, container.clientHeight);
ssao.kernelRadius = 18;
ssao.minDistance = 0.001;
ssao.maxDistance = 0.1;
composer.addPass(ssao);

// bloom (metal highlights)
const bloom = new UnrealBloomPass(
  new THREE.Vector2(container.clientWidth, container.clientHeight),
  0.25, // strength
  0.4,  // radius
  0.85  // threshold
);
composer.addPass(bloom);

// resize
window.addEventListener("resize", ()=>{
  const w = container.clientWidth;
  const h = container.clientHeight;

  camera.aspect = w/h;
  camera.updateProjectionMatrix();

  renderer.setSize(w,h);
  composer.setSize(w,h);
});

// render loop
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  composer.render();
}
animate();
</script> </body></html>
