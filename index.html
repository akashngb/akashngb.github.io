/* Live age calculation */
const birthDate = new Date("2006-12-30T02:00:00.700Z");

function computeAge() {
  const now = new Date();
  return (now - birthDate) / (365.2422 * 24*60*60*1000);
}

function updateAgeHeader() {
  const el = document.getElementById("live-age");
  if (!el) return;
  el.textContent = computeAge().toFixed(10);
}

/* Typewriter name effect */
function typeNameWithTypos(el) {
  if (!el || el.dataset.typing === "1") return;
  el.dataset.typing = "1";

  const firstName = "Akash ";
  const typos = ["Nabghirava", "Nagabhirva", "Nagabhirava"];
  
  let phase = "first";
  let firstIndex = 0;
  let stage = 0;
  let index = 0;
  let deleting = false;

  function jitter(base) {
    return Math.max(10, base + Math.floor(Math.random() * 60) - 30);
  }

  function step() {
    if (!document.body.contains(el)) {
      el.dataset.typing = "0";
      return;
    }

    if (phase === "first") {
      el.textContent = firstName.slice(0, firstIndex + 1);
      firstIndex++;
      if (firstIndex < firstName.length) {
        return setTimeout(step, jitter(110));
      }
      phase = "last";
      index = 0;
      return setTimeout(step, 200);
    }

    const target = typos[stage] || "";

    if (!deleting) {
      const visibleLast = target.slice(0, index + 1);
      el.textContent = firstName + visibleLast;
      index++;

      if (index < target.length) {
        return setTimeout(step, jitter(120));
      }

      if (stage < typos.length - 1) {
        setTimeout(() => {
          let deleteCount = (stage === 0) ? 8 : (stage === 1) ? 3 : 1;
          const visibleLen = (typos[stage] || "").length;
          deleteCount = Math.min(deleteCount, Math.max(1, visibleLen - 1));
          deleting = true;
          el.dataset.deletesLeft = String(deleteCount);
          step();
        }, 400);
        return;
      } else {
        setTimeout(() => {
          el.style.borderRight = "none";
          el.dataset.typing = "0";
          
          // Show subtitle after typing finishes
          const subtitle = document.getElementById("subtitle");
          if (subtitle) subtitle.classList.add("subtitle-visible");
        }, 320);
        return;
      }
    } else {
      let deletesLeft = parseInt(el.dataset.deletesLeft || "0", 10);
      if (deletesLeft <= 0) {
        deleting = false;
        stage++;
        setTimeout(() => {
          const visible = el.textContent.replace(firstName, "");
          index = visible.length;
          step();
        }, 200);
        return;
      }

      const currentVisible = el.textContent.replace(firstName, "");
      const newVisible = currentVisible.slice(0, -1);
      el.textContent = firstName + newVisible;
      deletesLeft--;
      el.dataset.deletesLeft = String(deletesLeft);
      return setTimeout(step, 55);
    }
  }

  step();
}

/* Profile image rotator */
function initProfileRotator() {
  const imgEl = document.getElementById("profile-rotator");
  let images = [];
  try {
    images = JSON.parse('null');
  } catch (e) {
    console.error("Image JSON failed:", e);
  }

  if (!images || images.length === 0) return;

  let idx = 0;

  document.addEventListener("keydown", function (e) {
    const active = document.activeElement;
    if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) return;

    if (/^[a-zA-Z]$/.test(e.key)) {
      idx = (idx + 1) % images.length;
      if (imgEl) imgEl.src = images[idx];
    }
  });
}

function initThreeScene() {
  const container = document.getElementById('three-container');
  if (!container) {
    console.error("three-container not found!");
    return;
  }

  // Scene setup
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  // Add lights for dramatic effect
  const ambientLight = new THREE.AmbientLight(0x404040, 0.3); // Dim ambient
  scene.add(ambientLight);

  // Key light (main light from front-right)
  const keyLight = new THREE.DirectionalLight(0xffffff, 1);
  keyLight.position.set(5, 5, 5);
  scene.add(keyLight);

  // Fill light (softer from left)
  const fillLight = new THREE.DirectionalLight(0x8080ff, 0.5);
  fillLight.position.set(-5, 3, 2);
  scene.add(fillLight);

  // Rim light (behind for edge definition)
  const rimLight = new THREE.DirectionalLight(0xff8080, 0.7);
  rimLight.position.set(0, 2, -5);
  scene.add(rimLight);

  camera.position.z = 7;
  
  // Mouse tracking
  let mouseX = 0;
  let mouseY = 0;
  
  document.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = (e.clientY / window.innerHeight) * 2 - 1;
  });

  // Load a 3D model
  const loader = new THREE.GLTFLoader();
  let modelGroup;  // Changed from 'model' to 'modelGroup'

  loader.load(
    '/assets/models/batmobile_armored.glb',
    function (gltf) {
      const model = gltf.scene;
      
      // Calculate the bounding box and center
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      
      // Offset the model so its center is at (0,0,0)
      model.position.x = -center.x;
      model.position.y = -center.y;
      model.position.z = -center.z;
      
      // Create a group to hold the model
      modelGroup = new THREE.Group();
      modelGroup.add(model);
      modelGroup.scale.set(2, 2, 2);  // Scale the group, not the model
      
      scene.add(modelGroup);
      console.log("Model loaded and centered!");
    },
    function (xhr) {
      console.log((xhr.loaded / xhr.total * 100) + '% loaded');
    },
    function (error) {
      console.error('Error loading model:', error);
    }
  );

  // Animation loop
  function animate() {
    requestAnimationFrame(animate);
    
    // Rotate model based on mouse if it exists
    if (modelGroup) {  // Changed from 'model' to 'modelGroup'
      modelGroup.rotation.y = mouseX * Math.PI;
      modelGroup.rotation.x = mouseY * Math.PI;
    }
    
    renderer.render(scene, camera);
  }
  animate();

  // Handle window resize
  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
}

// Call it on page load
// Initialize everything on page load
document.addEventListener("DOMContentLoaded", function () {
  // Start age updates
  updateAgeHeader();
  setInterval(updateAgeHeader, 100);
  
  // Start typewriter
  const nameEl = document.getElementById("name-header");
  if (nameEl) typeNameWithTypos(nameEl);
  
  // Initialize image rotator
  initProfileRotator();
  
  // Initialize Three.js scene
  initThreeScene();
});
