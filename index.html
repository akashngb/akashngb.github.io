/* Live age calculation */
const birthDate = new Date("2006-12-30T02:00:00.700Z");

function computeAge() {
  const now = new Date();
  return (now - birthDate) / (365.2422 * 24*60*60*1000);
}

function updateAgeHeader() {
  const el = document.getElementById("live-age");
  if (!el) return;
  el.textContent = computeAge().toFixed(10);
}

/* Typewriter name effect */
function typeNameWithTypos(el) {
  if (!el || el.dataset.typing === "1") return;
  el.dataset.typing = "1";

  const firstName = "Akash ";
  const typos = ["Nabghirava", "Nagabhirva", "Nagabhirava"];
  
  let phase = "first";
  let firstIndex = 0;
  let stage = 0;
  let index = 0;
  let deleting = false;

  function jitter(base) {
    return Math.max(10, base + Math.floor(Math.random() * 60) - 30);
  }

  function step() {
    if (!document.body.contains(el)) {
      el.dataset.typing = "0";
      return;
    }

    if (phase === "first") {
      el.textContent = firstName.slice(0, firstIndex + 1);
      firstIndex++;
      if (firstIndex < firstName.length) {
        return setTimeout(step, jitter(110));
      }
      phase = "last";
      index = 0;
      return setTimeout(step, 200);
    }

    const target = typos[stage] || "";

    if (!deleting) {
      const visibleLast = target.slice(0, index + 1);
      el.textContent = firstName + visibleLast;
      index++;

      if (index < target.length) {
        return setTimeout(step, jitter(120));
      }

      if (stage < typos.length - 1) {
        setTimeout(() => {
          let deleteCount = (stage === 0) ? 8 : (stage === 1) ? 3 : 1;
          const visibleLen = (typos[stage] || "").length;
          deleteCount = Math.min(deleteCount, Math.max(1, visibleLen - 1));
          deleting = true;
          el.dataset.deletesLeft = String(deleteCount);
          step();
        }, 400);
        return;
      } else {
        setTimeout(() => {
          el.style.borderRight = "none";
          el.dataset.typing = "0";
          
          // Show subtitle after typing finishes
          const subtitle = document.getElementById("subtitle");
          if (subtitle) subtitle.classList.add("subtitle-visible");
        }, 320);
        return;
      }
    } else {
      let deletesLeft = parseInt(el.dataset.deletesLeft || "0", 10);
      if (deletesLeft <= 0) {
        deleting = false;
        stage++;
        setTimeout(() => {
          const visible = el.textContent.replace(firstName, "");
          index = visible.length;
          step();
        }, 200);
        return;
      }

      const currentVisible = el.textContent.replace(firstName, "");
      const newVisible = currentVisible.slice(0, -1);
      el.textContent = firstName + newVisible;
      deletesLeft--;
      el.dataset.deletesLeft = String(deletesLeft);
      return setTimeout(step, 55);
    }
  }

  step();
}

/* Profile image rotator */
function initProfileRotator() {
  const imgEl = document.getElementById("profile-rotator");
  let images = [];
  try {
    images = JSON.parse('null');
  } catch (e) {
    console.error("Image JSON failed:", e);
  }

  if (!images || images.length === 0) return;

  let idx = 0;

  document.addEventListener("keydown", function (e) {
    const active = document.activeElement;
    if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) return;

    if (e.key === " ") {
      e.preventDefault();
      return;
    }

    if (/^[a-zA-Z]$/.test(e.key)) {
      idx = (idx + 1) % images.length;
      if (imgEl) imgEl.src = images[idx];
    }
  });
}

// Initialize everything on page load
document.addEventListener("DOMContentLoaded", function () {
  updateAgeHeader();
  setInterval(updateAgeHeader, 100);
  
  const nameEl = document.getElementById("name-header");
  if (nameEl) typeNameWithTypos(nameEl);
  
  initProfileRotator();
});
</script> </div> <footer class="sticky-bottom mt-5" role="contentinfo"> <div class="container"> © Copyright 2026 Akash Nagabhirava . Last updated: February 22, 2026. </div> </footer> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/assets/js/masonry.js?a0db7e5d5c70cc3252b3138b0c91dcaf" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/assets/js/zoom.js?85ddb88934d28b74e78031fd54cf8308"></script> <script src="/assets/js/no_defer.js?2781658a0a2b13ed609542042a859126"></script> <script defer src="/assets/js/common.js?e0514a05c5c95ac1a93a8dfd5249b92e"></script> <script defer src="/assets/js/copy_code.js?c8a01c11a92744d44b093fc3bda915df" type="text/javascript"></script> <script defer src="/assets/js/jupyter_new_tab.js?d9f17b6adc2311cbabd747f4538bb15f"></script> <script async src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"></script> <script async src="https://badge.dimensions.ai/badge.js"></script> <script defer type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" int
