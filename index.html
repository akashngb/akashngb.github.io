/* Live age calculation */
const birthDate = new Date("2006-12-30T02:00:00.700Z");

function computeAge() {
  const now = new Date();
  return (now - birthDate) / (365.2422 * 24*60*60*1000);
}

function updateAgeHeader() {
  const el = document.getElementById("live-age");
  if (!el) return;
  el.textContent = computeAge().toFixed(10);
}

/* Typewriter name effect */
function typeNameWithTypos(el) {
  if (!el || el.dataset.typing === "1") return;
  el.dataset.typing = "1";

  const firstName = "Akash ";
  const typos = ["Nabghirava", "Nagabhirva", "Nagabhirava"];
  
  let phase = "first";
  let firstIndex = 0;
  let stage = 0;
  let index = 0;
  let deleting = false;

  function jitter(base) {
    return Math.max(10, base + Math.floor(Math.random() * 60) - 30);
  }

  function step() {
    if (!document.body.contains(el)) {
      el.dataset.typing = "0";
      return;
    }

    if (phase === "first") {
      el.textContent = firstName.slice(0, firstIndex + 1);
      firstIndex++;
      if (firstIndex < firstName.length) {
        return setTimeout(step, jitter(110));
      }
      phase = "last";
      index = 0;
      return setTimeout(step, 200);
    }

    const target = typos[stage] || "";

    if (!deleting) {
      const visibleLast = target.slice(0, index + 1);
      el.textContent = firstName + visibleLast;
      index++;

      if (index < target.length) {
        return setTimeout(step, jitter(120));
      }

      if (stage < typos.length - 1) {
        setTimeout(() => {
          let deleteCount = (stage === 0) ? 8 : (stage === 1) ? 3 : 1;
          const visibleLen = (typos[stage] || "").length;
          deleteCount = Math.min(deleteCount, Math.max(1, visibleLen - 1));
          deleting = true;
          el.dataset.deletesLeft = String(deleteCount);
          step();
        }, 400);
        return;
      } else {
        setTimeout(() => {
          el.style.borderRight = "none";
          el.dataset.typing = "0";
          
          // Show subtitle after typing finishes
          const subtitle = document.getElementById("subtitle");
          if (subtitle) subtitle.classList.add("subtitle-visible");
        }, 320);
        return;
      }
    } else {
      let deletesLeft = parseInt(el.dataset.deletesLeft || "0", 10);
      if (deletesLeft <= 0) {
        deleting = false;
        stage++;
        setTimeout(() => {
          const visible = el.textContent.replace(firstName, "");
          index = visible.length;
          step();
        }, 200);
        return;
      }

      const currentVisible = el.textContent.replace(firstName, "");
      const newVisible = currentVisible.slice(0, -1);
      el.textContent = firstName + newVisible;
      deletesLeft--;
      el.dataset.deletesLeft = String(deletesLeft);
      return setTimeout(step, 55);
    }
  }

  step();
}

/* Profile image rotator */
function initProfileRotator() {
  const imgEl = document.getElementById("profile-rotator");
  let images = [];
  try {
    images = JSON.parse('null');
  } catch (e) {
    console.error("Image JSON failed:", e);
  }

  if (!images || images.length === 0) return;

  let idx = 0;

  document.addEventListener("keydown", function (e) {
    const active = document.activeElement;
    if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) return;

    if (/^[a-zA-Z]$/.test(e.key)) {
      idx = (idx + 1) % images.length;
      if (imgEl) imgEl.src = images[idx];
    }
  });
}

function initThreeScene() {
  const container = document.getElementById('three-container');
  if (!container) {
    console.error("three-container not found!");
    return;
  }

  // Scene setup
  const scene = new THREE.Scene();
  scene.background = null;
  
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  container.appendChild(renderer.domElement);

  // Sketchfab-style lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
  mainLight.position.set(5, 10, 7);
  scene.add(mainLight);

  const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
  fillLight.position.set(-5, 5, 5);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
  rimLight.position.set(0, 5, -10);
  scene.add(rimLight);

  const cyanLight1 = new THREE.SpotLight(0x00ffff, 2);
  cyanLight1.position.set(-3, 4, 4);  // Left side
  cyanLight1.angle = Math.PI / 8;     // Narrow beam
  cyanLight1.penumbra = 0.3;
  cyanLight1.target.position.set(0, 1, 0);  // Point at windshield area
  scene.add(cyanLight1);
  scene.add(cyanLight1.target);

  const cyanLight2 = new THREE.SpotLight(0x00ffff, 2);
  cyanLight2.position.set(3, 4, 4);   // Right side
  cyanLight2.angle = Math.PI / 8;
  cyanLight2.penumbra = 0.3;
  cyanLight2.target.position.set(0, 1, 0);
  scene.add(cyanLight2);
  scene.add(cyanLight2.target);

  // Accent cyan point light
  const cyanAccent = new THREE.PointLight(0x00ffff, 1.5, 20);
  cyanAccent.position.set(0, 5, 3);  // Above and in front
  scene.add(cyanAccent);

  camera.position.set(0, 2, 4);
  camera.lookAt(0, 0, 0);

  // Drag-to-rotate controls
  let isDragging = false;
  let previousMouseX = 0;
  let previousMouseY = 0;
  let rotationY = 0;
  let rotationX = 0;
  let targetRotationY = 0;
  let targetRotationX = 0;

  container.addEventListener('mousedown', (e) => {
    isDragging = true;
    previousMouseX = e.clientX;
    previousMouseY = e.clientY;
    container.style.cursor = 'grabbing';
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
    container.style.cursor = 'grab';
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    
    const deltaX = e.clientX - previousMouseX;
    const deltaY = e.clientY - previousMouseY;
    
    targetRotationY += deltaX * 0.005;
    targetRotationX += deltaY * 0.005;
    
    targetRotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotationX));
    
    previousMouseX = e.clientX;
    previousMouseY = e.clientY;
  });

  container.style.cursor = 'grab';

  // Zoom with mouse wheel
  let zoomLevel = 4;  // Starting camera distance

  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    
    // Adjust zoom based on wheel delta
    zoomLevel += e.deltaY * 0.03;
    
    // Clamp zoom (don't get too close or too far)
    zoomLevel = Math.max(0.5, Math.min(100, zoomLevel));
    
    // Update camera position
    camera.position.z = zoomLevel;
  });

  // Load the model
  const loader = new THREE.GLTFLoader();
  let modelGroup;

  loader.load(
    '/assets/models/batmobile_armored.glb',
    function (gltf) {
      const model = gltf.scene;
      
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      model.position.x = -center.x;
      model.position.y = -center.y;
      model.position.z = -center.z;
      
      modelGroup = new THREE.Group();
      modelGroup.add(model);
      
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 8 / maxDim;
      modelGroup.scale.setScalar(scale);

      modelGroup.position.y = 1;

      modelGroup.rotation.y = -Math.PI * 0.6;  // Rotate 45 degrees (π/4)
      modelGroup.rotation.x = 0.1;

      let zoomLevel = 3;
      
      targetRotationY = modelGroup.rotation.y;
      targetRotationX = modelGroup.rotation.x;
      rotationY = modelGroup.rotation.y;
      rotationX = modelGroup.rotation.x;
      
      scene.add(modelGroup);
      console.log("Model loaded!");
    },
    undefined,
    function (error) {
      console.error('Error loading model:', error);
    }
  );

  // Animation loop
  function animate() {
    requestAnimationFrame(animate);
    
    if (modelGroup) {
      rotationY += (targetRotationY - rotationY) * 0.1;
      rotationX += (targetRotationX - rotationX) * 0.1;
      
      modelGroup.rotation.y = rotationY;
      modelGroup.rotation.x = rotationX;
    }
    
    renderer.render(scene, camera);
  }
  animate();

  // Handle window resize
  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
}

// Initialize everything on page load
document.addEventListener("DOMContentLoaded", function () {
  updateAgeHeader();
  setInterval(updateAgeHeader, 100);
  
  const nameEl = document.getElementById("name-header");
  if (nameEl) typeNameWithTypos(nameEl);
  
  initProfileRotator();
  initThreeScene();
});
