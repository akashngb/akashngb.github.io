/* -----------------------------
   LIVE AGE CONFIG
------------------------------ */
const birthDate = new Date("2006-12-30T02:00:00.700Z");

// Compute age in years
function computeAge() {
  const now = new Date();
  return (now - birthDate) / (365.2422 * 24*60*60*1000);
}

/* -----------------------------
   UPDATE LIVE AGE IN JSON PRE
------------------------------ */
function updatePlainAge() {
  const el = document.getElementById("plain-view");
  if (el) {
    let json = JSON.parse(el.textContent);
    json.intro = json.intro.replace(/\.(?=\S)/g, '.<br>'); // add <br> after each period
    el.innerHTML = JSON.stringify(json, null, 3)
                      .replace(/"(<br>)"/g, '"<br>"') // keep <br> inside quotes
                      .replace(/\\n/g, '<br>'); // optional
  }
  if (!el) return;

  let json;
  try {
    json = JSON.parse(el.textContent);
  } catch (err) {
    console.error("Failed to parse JSON:", err);
    return;
  }

  const age = computeAge();
  const newJson = { "name": json.name, "age": Number(age.toFixed(9)) };

  for (const key in json) {
    if (key !== "name") newJson[key] = json[key];
  }

  el.textContent = JSON.stringify(newJson, null, 3);
}

/* -----------------------------
   UPDATE AGE HEADER IF PRESENT
------------------------------ */
function updateAgeHeader() {
  const el = document.getElementById("live-age");
  if (!el) return;
  el.textContent = computeAge().toFixed(10);
}

/* -----------------------------
   INITIALIZE AGE UPDATES
------------------------------ */
function initAgeUpdates() {
  updateAgeHeader();

  // Update every second
  setInterval(() => {
    updateAgeHeader();
  }, 100);
}

/* -----------------------------
   PROFILE IMAGE ROTATOR & COMPILE TOGGLE
------------------------------ */
function initProfileRotator() {
  const images = ["/assets/img/rooftop.png","/assets/img/1.png","/assets/img/2.png","/assets/img/3.png","/assets/img/4.png","/assets/img/5.png","/assets/img/6.png","/assets/img/7.png","/assets/img/8.png","/assets/img/9.png","/assets/img/10.png","/assets/img/11.png","/assets/img/12.png","/assets/img/13.png","/assets/img/14.png","/assets/img/15.png","/assets/img/16.png","/assets/img/17.png","/assets/img/18.png","/assets/img/19.png","/assets/img/20.png","/assets/img/21.png","/assets/img/22.png","/assets/img/23.png","/assets/img/24.png","/assets/img/25.png","/assets/img/26.png","/assets/img/27.png","/assets/img/28.png","/assets/img/29.png","/assets/img/30.png","/assets/img/31.png","/assets/img/32.png","/assets/img/33.png","/assets/img/34.png","/assets/img/35.png","/assets/img/36.png","/assets/img/37.png","/assets/img/38.png","/assets/img/39.png","/assets/img/40.png","/assets/img/41.png","/assets/img/42.png","/assets/img/43.png","/assets/img/44.png","/assets/img/45.png","/assets/img/46.png"];
  const imgEl = document.getElementById("profile-rotator");
  const toggle = document.getElementById("compileToggle");
  const compiledView = document.getElementById("compiled-view");
  const plainView = document.getElementById("plain-view");
  const ageHeader = document.getElementById("age-header");
  let idx = 0;

  function setImage(i) {
    if (!imgEl) return;
    imgEl.src = images[i].startsWith('/') ? images[i] : '/' + images[i];
  }

  function updateCompileDisplay() {
    const isChecked = toggle.checked;
    
    const tocSidebar = document.getElementById("toc-sidebar");

    if (tocSidebar) {
      tocSidebar.style.display = isChecked ? "block" : "none";
    }
    
    if (compiledView) compiledView.style.display = isChecked ? "flex" : "none";
    if (plainView) plainView.style.display = isChecked ? "none" : "block";

    if (imgEl) imgEl.classList.toggle("profile-hidden", !isChecked);

    const nameHeader = document.getElementById("name-header");
    if (nameHeader) nameHeader.style.display = isChecked ? "block" : "none";

    const moreInfo = document.getElementById("more-info");
    if (moreInfo) moreInfo.style.display = isChecked ? "block" : "none";

    if (ageHeader) ageHeader.style.display = isChecked ? "block" : "none";

    const prettyContainer = document.querySelector(".pretty-container");
    if (prettyContainer) {
        prettyContainer.classList.toggle("pretty-enabled", isChecked);
    }
  }

  if (toggle) toggle.addEventListener("change", updateCompileDisplay);

  document.addEventListener("keydown", function (e) {
    const active = document.activeElement;
    if (active && (active.tagName === "INPUT" ||
                   active.tagName === "TEXTAREA" ||
                   active.isContentEditable)) return;

    if (e.code === "Space" || e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      toggle.checked = !toggle.checked;
      updateCompileDisplay();
      return;
    }

    if (/^[a-zA-Z]$/.test(e.key)) {
      idx = (idx + 1) % images.length;
      setImage(idx);
    }
  });
}

/* -----------------------------
   PRETTY-PRINT TOGGLE
------------------------------ */
function initPrettyToggle() {
  const toggle = document.getElementById("prettyToggle");
  const container = document.querySelector(".pretty-container");
  if (!toggle || !container) return;

  toggle.addEventListener("change", function () {
    container.classList.toggle("pretty-enabled", toggle.checked);
  });
}

/* -----------------------------
   DOM CONTENT LOADED INIT
------------------------------ */
document.addEventListener("DOMContentLoaded", function () {
  initAgeUpdates();
  initProfileRotator();
  initPrettyToggle();
});
