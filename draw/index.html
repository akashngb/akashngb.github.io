<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>ASL Translator</title> <style>@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#050508;--surface:rgba(18,18,25,0.65);--border:rgba(255,255,255,0.08);--cyan:#00f5ff;--purple:#9d4edd;--pink:#ff2a6d;--text:#e0e0e5;--dim:#777785}body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;background-image:radial-gradient(circle at 10% 40%,rgba(0,245,255,0.04),transparent 40%),radial-gradient(circle at 90% 60%,rgba(157,78,221,0.05),transparent 40%)}#header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:10}h1{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 20px rgba(0,245,255,0.2)}#main-container{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;width:100%;max-width:800px;padding:24px;gap:32px}.video-wrapper{position:relative;width:100%;max-width:640px;aspect-ratio:4/3;border-radius:16px;overflow:hidden;border:1px solid var(--border);box-shadow:0 20px 50px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.03);background:#000}video,canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}canvas{z-index:2}#output-container{display:flex;flex-direction:column;align-items:center;width:100%;gap:20px}.word-box{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:16px;padding:24px 48px;min-width:320px;text-align:center;font-size:36px;font-weight:600;color:#fff;min-height:90px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px);box-shadow:inset 0 0 30px rgba(0,0,0,0.5);letter-spacing:.08em;position:relative;overflow:hidden}.word-box::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);opacity:.5}.controls-row{display:flex;gap:16px;align-items:center}button{background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--text);font-family:'Space Mono',monospace;font-size:12px;padding:12px 24px;border-radius:10px;cursor:pointer;text-transform:uppercase;letter-spacing:.15em;transition:all .25s cubic-bezier(0.4,0,0.2,1);backdrop-filter:blur(4px)}button:hover{background:rgba(0,245,255,0.05);border-color:rgba(0,245,255,0.4);color:var(--cyan);transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,245,255,0.1)}button:active{transform:translateY(0)}#speak-btn{background:rgba(157,78,221,0.1);border-color:rgba(157,78,221,0.4);color:#fff;font-weight:700}#speak-btn:hover{background:rgba(157,78,221,0.2);border-color:var(--purple);color:#fff;box-shadow:0 5px 20px rgba(157,78,221,0.25)}.current-letter-container{position:absolute;bottom:24px;right:24px;background:rgba(10,10,15,0.8);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:12px;z-index:10;backdrop-filter:blur(8px);box-shadow:0 10px 25px rgba(0,0,0,0.5)}.current-letter{color:var(--cyan);font-size:32px;font-weight:800;font-family:'Space Mono',monospace;line-height:1;margin-bottom:8px;text-shadow:0 0 15px rgba(0,245,255,0.4)}.confidence-bar{width:60px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden}.confidence-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));width:0;transition:width .1s linear}#loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:50;transition:opacity .5s ease}.spinner{width:48px;height:48px;border:2px solid var(--border);border-top-color:var(--cyan);border-right-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.instruction{font-size:13px;color:var(--dim);letter-spacing:.1em;font-family:'Space Mono',monospace}</style> </head> <body> <div id="loading-overlay"> <div class="spinner"></div> <div style="color:#fff; font-size: 12px; font-family: 'Space Mono'; letter-spacing: 0.2em; text-transform: uppercase;">Initializing ASL Engine</div> </div> <div id="header"> <h1>✦ ASL Translator</h1> <div class="instruction">Hold gestures to type • Beta Engine</div> </div> <div id="main-container"> <div class="video-wrapper"> <video id="webcam" autoplay playsinline muted></video> <canvas id="output_canvas"></canvas> <div class="current-letter-container"> <div class="current-letter" id="current-letter">-</div> <div class="confidence-bar"><div class="confidence-fill" id="conf-fill"></div></div> </div> </div> <div id="output-container"> <div class="word-box" id="word-box"></div> <div class="controls-row"> <button onclick="addSpace()">Space</button> <button onclick="backspace()">Delete</button> <button onclick="clearText()">Clear</button> <button id="speak-btn" onclick="speakText()">Speak Output</button> </div> </div> </div> <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script> <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script> <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script> <script>
// UI Elements
const video = document.getElementById('webcam');
const canvas = document.getElementById('output_canvas');
const ctx = canvas.getContext('2d');
const letterEl = document.getElementById('current-letter');
const confFill = document.getElementById('conf-fill');
const wordBox = document.getElementById('word-box');
const loadingOverlay = document.getElementById('loading-overlay');

let currentWord = "";
let pendingLetter = null;
let holdCounter = 0;
const HOLD_THRESHOLD = 20; // required frames to lock-in letter

function getFingerStates(landmarks) {
  const wrist = landmarks[0];
  
  const calcDist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
  
  // Extended if tip distance to wrist > pip distance to wrist
  const indexExtended = calcDist(landmarks[8], wrist) > calcDist(landmarks[6], wrist);
  const middleExtended = calcDist(landmarks[12], wrist) > calcDist(landmarks[10], wrist);
  const ringExtended = calcDist(landmarks[16], wrist) > calcDist(landmarks[14], wrist);
  const pinkyExtended = calcDist(landmarks[20], wrist) > calcDist(landmarks[18], wrist);

  // Thumb rules (distance from tip to pinky base vs thumb base)
  const thumbOut = calcDist(landmarks[4], landmarks[17]) > 0.15; 
  const thumbUp = landmarks[4].y < landmarks[3].y;

  return { 
    thumb: thumbOut || thumbUp, 
    index: indexExtended, 
    middle: middleExtended, 
    ring: ringExtended, 
    pinky: pinkyExtended 
  };
}

function detectLetter(states) {
  const { thumb, index, middle, ring, pinky } = states;
  
  // A simple heuristic rule-based engine mapping open/closed fingers 
  // to American Sign Language alphabet. (Approximations)

  const fcount = [index, middle, ring, pinky].filter(Boolean).length;

  // 0 fingers
  if (fcount === 0) {
    if (thumb) return 'A';    // thumb out
    return 'S';              // fist
  }

  // 1 finger
  if (fcount === 1) {
    if (index) {
      if (thumb) return 'L';
      return 'D'; 
    }
    if (pinky) {
      if (thumb) return 'Y';
      return 'I';
    }
  }

  // 2 fingers
  if (fcount === 2) {
    if (index && middle) return 'V';
    if (thumb && index && pinky) return 'ILY'; // "I love you" sign
  }

  // 3 fingers
  if (fcount === 3) {
    if (index && middle && ring) return 'W';
    if (thumb && index && middle) return '3';
  }

  // 4 fingers
  if (fcount === 4) {
    if (!thumb) return 'B';
    return '5'; // open hand
  }

  return null;
}

function onResults(results) {
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const landmarks = results.multiHandLandmarks[0];
    
    // Draw skeletal tracking with custom styling
    drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: 'rgba(255, 255, 255, 0.2)', lineWidth: 2});
    drawLandmarks(ctx, landmarks, {
      color: '#00f5ff', 
      fillColor: '#0a0a0f',
      lineWidth: 2, 
      radius: (data) => { return [4, 8, 12, 16, 20].includes(data.index) ? 6 : 4; }
    });

    const states = getFingerStates(landmarks);
    const letter = detectLetter(states);

    if (letter) {
      if (letter === pendingLetter) {
        holdCounter++;
        confFill.style.width = Math.min(100, (holdCounter / HOLD_THRESHOLD) * 100) + '%';
        if (holdCounter === HOLD_THRESHOLD) {
          if (letter === '5') addSpace();
          else if (letter !== 'ILY' && letter !== '3') addLetter(letter); // ignore some states mapping to numbers/words temporarily
          holdCounter = -30; // cool down delay
        }
      } else {
        pendingLetter = letter;
        holdCounter = 1;
        confFill.style.width = '0%';
      }
      letterEl.textContent = letter;
      // Add glow effect based on confidence
      letterEl.style.textShadow = `0 0 ${Math.min(20, holdCounter)}px rgba(0, 245, 255, 0.8)`;
    } else {
      pendingLetter = null;
      holdCounter = 0;
      letterEl.textContent = '-';
      confFill.style.width = '0%';
      letterEl.style.textShadow = 'none';
    }
  } else {
    pendingLetter = null;
    holdCounter = 0;
    letterEl.textContent = '-';
    confFill.style.width = '0%';
    letterEl.style.textShadow = 'none';
  }
  ctx.restore();
}

function addLetter(l) {
  currentWord += l;
  updateDisplay();
}

function addSpace() {
  if (currentWord.length > 0 && currentWord[currentWord.length-1] !== ' ') {
    currentWord += ' ';
    updateDisplay();
  }
}

function backspace() {
  currentWord = currentWord.slice(0, -1);
  updateDisplay();
}

function clearText() {
  currentWord = '';
  updateDisplay();
}

function updateDisplay() {
  wordBox.textContent = currentWord || "start signing...";
  wordBox.style.opacity = currentWord ? 1 : 0.4;
}

function speakText() {
  if (!currentWord.trim()) return;
  const utterance = new SpeechSynthesisUtterance(currentWord);
  utterance.rate = 0.9;
  utterance.pitch = 1.0;
  
  // Visual feedback during speech
  const btn = document.getElementById('speak-btn');
  btn.style.boxShadow = '0 0 30px rgba(157, 78, 221, 0.8)';
  btn.textContent = 'Speaking...';
  
  utterance.onend = () => {
    btn.style.boxShadow = '';
    btn.textContent = 'Speak Output';
  };
  
  window.speechSynthesis.speak(utterance);
}

// Global hook for keyboard to also help debug
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); addSpace(); }
  if (e.code === 'Backspace') backspace();
  if (e.key.length === 1 && e.key.match(/[a-z]/i)) addLetter(e.key.toUpperCase());
});

async function init() {
  canvas.width = 640;
  canvas.height = 480;

  const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.75,
    minTrackingConfidence: 0.75
  });
  hands.onResults(onResults);

  const camera = new Camera(video, {
    onFrame: async () => {
      await hands.send({image: video});
    },
    width: 640,
    height: 480
  });

  camera.start().then(() => {
    loadingOverlay.style.opacity = '0';
    setTimeout(() => {
      loadingOverlay.style.display = 'none';
    }, 500);
    updateDisplay();
  }).catch((err) => {
    alert("Camera access denied or unavailable: " + err);
  });
}

init();
</script> </body> </html>
